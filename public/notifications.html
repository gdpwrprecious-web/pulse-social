<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Notifications • Pulse</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f0f2f5;
      color: #050505;
    }

    button,
    input {
      font: inherit;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* HEADER */

    .topbar {
      height: 64px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    .brand {
      color: #1877f2;
      font-size: 30px;
      font-weight: 800;
      margin-right: 30px;
    }

    .search {
      height: 42px;
      width: 280px;
      border-radius: 22px;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      padding: 0 15px;
      color: #65676b;
    }

    .search input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      margin-left: 8px;
    }

    .top-actions {
      margin-left: auto;
      display: flex;
      gap: 10px;
    }

    .top-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 0;
      background: #e4e6eb;
      cursor: pointer;
      font-size: 19px;
    }

    /* PAGE */

    .page {
      width: 100%;
      max-width: 760px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .notifications-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 2px rgba(0,0,0,.12);
      overflow: hidden;
    }

    .heading {
      padding: 20px;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .heading h1 {
      font-size: 24px;
    }

    .mark-read {
      border: 0;
      background: #e7f3ff;
      color: #1877f2;
      padding: 9px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .filters {
      display: flex;
      gap: 8px;
      padding: 12px 15px;
      border-bottom: 1px solid #eee;
    }

    .filter {
      border: 0;
      background: transparent;
      padding: 8px 14px;
      border-radius: 18px;
      cursor: pointer;
      font-weight: 600;
    }

    .filter.active,
    .filter:hover {
      background: #e7f3ff;
      color: #1877f2;
    }

    /* NOTIFICATION */

    .notification {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 13px 18px;
      cursor: pointer;
      transition: background .15s;
    }

    .notification:hover {
      background: #f5f6f7;
    }

    .notification.unread {
      background: #e7f3ff;
    }

    .notification-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: #ddd;
    }

    .notification-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #1877f2;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      margin-left: -28px;
      margin-top: 32px;
      border: 2px solid white;
    }

    .notification-content {
      flex: 1;
      min-width: 0;
    }

    .notification-text {
      line-height: 1.4;
      font-size: 15px;
    }

    .notification-text strong {
      font-weight: 700;
    }

    .notification-time {
      color: #65676b;
      font-size: 13px;
      margin-top: 4px;
    }

    .notification-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #1877f2;
      flex-shrink: 0;
    }

    .empty {
      text-align: center;
      padding: 70px 20px;
      color: #65676b;
    }

    .empty-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .loading {
      text-align: center;
      padding: 50px 20px;
      color: #65676b;
    }

    @media (max-width: 600px) {

      .topbar {
        padding: 0 10px;
      }

      .brand {
        font-size: 25px;
        margin-right: 10px;
      }

      .search {
        display: none;
      }

      .page {
        margin-top: 10px;
        padding: 0;
      }

      .notifications-card {
        border-radius: 0;
      }

      .heading {
        padding: 17px 15px;
      }

      .notification {
        padding: 13px 12px;
      }
    }
  </style>
</head>

<body>

<header class="topbar">

  <a
    href="/feed.html"
    class="brand"
  >
    Pulse
  </a>

  <div class="search">
    🔍
    <input
      type="text"
      placeholder="Search Pulse"
      id="search"
    >
  </div>

  <div class="top-actions">

    <button
      class="top-btn"
      onclick="location.href='/feed.html'"
    >
      🏠
    </button>

    <button
      class="top-btn"
      onclick="location.href='/messages.html'"
    >
      💬
    </button>

    <button
      class="top-btn"
      onclick="location.href='/profile.html'"
    >
      👤
    </button>

  </div>

</header>

<main class="page">

  <section class="notifications-card">

    <div class="heading">

      <h1>Notifications</h1>

      <button
        class="mark-read"
        onclick="markAllRead()"
      >
        Mark all as read
      </button>

    </div>

    <div class="filters">

      <button
        class="filter active"
        onclick="setFilter('all', this)"
      >
        All
      </button>

      <button
        class="filter"
        onclick="setFilter('unread', this)"
      >
        Unread
      </button>

    </div>

    <div id="notifications">
      <div class="loading">
        Loading notifications...
      </div>
    </div>

  </section>

</main>

<script>

  let allNotifications = [];
  let currentFilter = "all";

  const defaultAvatar =
    "/images/default-avatar.png";

  function escapeHTML(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  async function api(url, options = {}) {

    const response = await fetch(url, {
      credentials: "include",
      ...options,
      headers: {
        "Content-Type": "application/json",
        ...(options.headers || {})
      }
    });

    const data =
      await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(
        data.error ||
        data.message ||
        `Request failed (${response.status})`
      );
    }

    return data;
  }

  function getNotificationUser(notification) {

    return (
      notification.user ||
      notification.sender ||
      notification.actor ||
      notification.from ||
      notification.author ||
      {}
    );
  }

  function getNotificationText(notification) {

    if (notification.text) {
      return notification.text;
    }

    const user =
      getNotificationUser(notification);

    const name =
      user.name ||
      user.username ||
      "Someone";

    const type =
      String(
        notification.type ||
        notification.action ||
        ""
      ).toLowerCase();

    if (
      type.includes("like")
    ) {
      return `<strong>${escapeHTML(name)}</strong> liked your post.`;
    }

    if (
      type.includes("comment")
    ) {
      return `<strong>${escapeHTML(name)}</strong> commented on your post.`;
    }

    if (
      type.includes("follow")
    ) {
      return `<strong>${escapeHTML(name)}</strong> started following you.`;
    }

    if (
      type.includes("message")
    ) {
      return `<strong>${escapeHTML(name)}</strong> sent you a message.`;
    }

    if (
      type.includes("verification")
    ) {
      return notification.message ||
        "Your verification status was updated.";
    }

    return notification.message ||
      `${name} interacted with you.`;
  }

  function notificationIcon(notification) {

    const type =
      String(
        notification.type ||
        notification.action ||
        ""
      ).toLowerCase();

    if (type.includes("like")) return "♥";
    if (type.includes("comment")) return "💬";
    if (type.includes("follow")) return "👤";
    if (type.includes("message")) return "✉";
    if (type.includes("verification")) return "✓";

    return "•";
  }

  function notificationAvatar(notification) {

    const user =
      getNotificationUser(notification);

    return (
      user.profilePicture ||
      user.profileImage ||
      user.avatar ||
      notification.profilePicture ||
      defaultAvatar
    );
  }

  function isUnread(notification) {

    return (
      notification.read === false ||
      notification.isRead === false ||
      notification.unread === true ||
      notification.readAt === null
    );
  }

  function formatTime(value) {

    if (!value) return "";

    const date =
      new Date(value);

    if (Number.isNaN(date.getTime())) {
      return "";
    }

    const now =
      Date.now();

    const difference =
      now - date.getTime();

    const minute =
      60 * 1000;

    const hour =
      60 * minute;

    const day =
      24 * hour;

    if (difference < minute) {
      return "Just now";
    }

    if (difference < hour) {
      return `${Math.floor(
        difference / minute
      )}m`;
    }

    if (difference < day) {
      return `${Math.floor(
        difference / hour
      )}h`;
    }

    if (difference < 7 * day) {
      return `${Math.floor(
        difference / day
      )}d`;
    }

    return date.toLocaleDateString();
  }

  function renderNotifications() {

    const container =
      document.getElementById(
        "notifications"
      );

    let notifications =
      allNotifications;

    if (currentFilter === "unread") {

      notifications =
        notifications.filter(
          isUnread
        );
    }

    if (!notifications.length) {

      container.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🔔</div>

          <h2>
            ${
              currentFilter === "unread"
                ? "No unread notifications"
                : "No notifications yet"
            }
          </h2>

          <p>
            We'll let you know when something happens.
          </p>
        </div>
      `;

      return;
    }

    container.innerHTML =
      notifications.map(notification => {

        const user =
          getNotificationUser(
            notification
          );

        const unread =
          isUnread(notification);

        const timestamp =
          notification.createdAt ||
          notification.timestamp ||
          notification.date;

        return `
          <div
            class="notification ${unread ? "unread" : ""}"
            onclick="openNotification('${escapeHTML(
              notification.id || ""
            )}')"
          >

            <img
              class="notification-avatar"
              src="${escapeHTML(
                notificationAvatar(notification)
              )}"
              onerror="this.src='${defaultAvatar}'"
              alt=""
            >

            <div class="notification-icon">
              ${notificationIcon(notification)}
            </div>

            <div class="notification-content">

              <div class="notification-text">
                ${getNotificationText(notification)}
              </div>

              <div class="notification-time">
                ${escapeHTML(
                  formatTime(timestamp)
                )}
              </div>

            </div>

            ${
              unread
                ? `<div class="notification-dot"></div>`
                : ""
            }

          </div>
        `;
      }).join("");
  }

  async function loadNotifications() {

    try {

      const data =
        await api(
          "/api/notifications"
        );

      allNotifications =
        data.notifications ||
        data.data ||
        data ||
        [];

      if (
        !Array.isArray(
          allNotifications
        )
      ) {
        allNotifications = [];
      }

      renderNotifications();

    } catch (error) {

      console.error(error);

      document.getElementById(
        "notifications"
      ).innerHTML = `
        <div class="empty">

          <div class="empty-icon">
            ⚠️
          </div>

          <h2>
            Unable to load notifications
          </h2>

          <p>
            ${escapeHTML(error.message)}
          </p>

        </div>
      `;
    }
  }

  async function markAllRead() {

    try {

      await api(
        "/api/notifications/read",
        {
          method: "POST",
          body: JSON.stringify({
            all: true
          })
        }
      );

      allNotifications =
        allNotifications.map(
          notification => ({
            ...notification,
            read: true,
            isRead: true,
            unread: false
          })
        );

      renderNotifications();

    } catch (error) {

      console.error(error);

      alert(
        "Unable to mark notifications as read: " +
        error.message
      );
    }
  }

  function setFilter(
    filter,
    button
  ) {

    currentFilter = filter;

    document
      .querySelectorAll(".filter")
      .forEach(item =>
        item.classList.remove("active")
      );

    button.classList.add("active");

    renderNotifications();
  }

  async function openNotification(id) {

    if (!id) return;

    try {

      await api(
        "/api/notifications/read",
        {
          method: "POST",
          body: JSON.stringify({
            id
          })
        }
      );

    } catch (error) {
      console.warn(
        "Could not mark notification read:",
        error
      );
    }

    const notification =
      allNotifications.find(
        item =>
          String(item.id) === String(id)
      );

    if (!notification) return;

    notification.read = true;
    notification.isRead = true;
    notification.unread = false;

    renderNotifications();

    const postId =
      notification.postId ||
      notification.post?.id;

    const user =
      getNotificationUser(
        notification
      );

    const type =
      String(
        notification.type ||
        notification.action ||
        ""
      ).toLowerCase();

    if (
      postId &&
      (
        type.includes("like") ||
        type.includes("comment")
      )
    ) {

      location.href =
        "/feed.html?post=" +
        encodeURIComponent(postId);

      return;
    }

    if (
      type.includes("message") &&
      user.id
    ) {

      location.href =
        "/messages.html?user=" +
        encodeURIComponent(user.id);

      return;
    }

    if (
      type.includes("follow") &&
      user.username
    ) {

      location.href =
        "/profile.html?username=" +
        encodeURIComponent(user.username);

      return;
    }
  }

  async function init() {

    try {

      const me =
        await api("/api/me");

      const user =
        me.user ||
        me;

      if (!user || !user.id) {
        location.href = "/login.html";
        return;
      }

      await loadNotifications();

    } catch (error) {

      location.href = "/login.html";
    }
  }

  init();

</script>

</body>
</html>
