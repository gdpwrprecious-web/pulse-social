<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages • Pulse</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f0f2f5;
      color: #050505;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button,
    input {
      font: inherit;
    }

    /* HEADER */
    .topbar {
      height: 64px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    .brand {
      font-size: 30px;
      font-weight: 800;
      color: #1877f2;
      margin-right: 30px;
    }

    .search {
      background: #f0f2f5;
      border-radius: 22px;
      height: 42px;
      width: 280px;
      display: flex;
      align-items: center;
      padding: 0 15px;
      color: #65676b;
    }

    .search input {
      border: 0;
      outline: 0;
      background: transparent;
      width: 100%;
      margin-left: 8px;
      font-size: 15px;
    }

    .top-actions {
      margin-left: auto;
      display: flex;
      gap: 10px;
    }

    .top-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 0;
      background: #e4e6eb;
      cursor: pointer;
      font-size: 20px;
    }

    /* MAIN */
    .layout {
      max-width: 1200px;
      margin: auto;
      display: grid;
      grid-template-columns: 330px 1fr;
      min-height: calc(100vh - 64px);
      background: #fff;
    }

    /* CONVERSATIONS */
    .conversations {
      border-right: 1px solid #ddd;
      background: #fff;
    }

    .conversation-header {
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .conversation-header h1 {
      font-size: 24px;
    }

    .new-message {
      border: 0;
      background: #e7f3ff;
      color: #1877f2;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
    }

    .message-search {
      margin: 0 15px 12px;
      background: #f0f2f5;
      border-radius: 20px;
      padding: 10px 14px;
    }

    .message-search input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
    }

    .conversation-list {
      overflow-y: auto;
      max-height: calc(100vh - 160px);
    }

    .conversation {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      cursor: pointer;
      gap: 12px;
    }

    .conversation:hover,
    .conversation.active {
      background: #f0f2f5;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
      flex-shrink: 0;
    }

    .conversation-info {
      min-width: 0;
      flex: 1;
    }

    .conversation-name {
      font-weight: 700;
      margin-bottom: 5px;
    }

    .last-message {
      color: #65676b;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* CHAT */
    .chat {
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: calc(100vh - 64px);
    }

    .chat-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #65676b;
      padding: 30px;
    }

    .chat-empty-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .chat-header {
      height: 70px;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      padding: 10px 18px;
      gap: 12px;
    }

    .chat-user {
      flex: 1;
    }

    .chat-user-name {
      font-weight: 700;
      font-size: 17px;
    }

    .chat-user-status {
      color: #65676b;
      font-size: 13px;
      margin-top: 3px;
    }

    .chat-actions {
      display: flex;
      gap: 7px;
    }

    .chat-action {
      border: 0;
      background: transparent;
      color: #1877f2;
      font-size: 19px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
    }

    .chat-action:hover {
      background: #f0f2f5;
    }

    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #fff;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message-row {
      display: flex;
      max-width: 75%;
    }

    .message-row.mine {
      margin-left: auto;
      justify-content: flex-end;
    }

    .message-bubble {
      padding: 10px 14px;
      border-radius: 18px;
      background: #e4e6eb;
      line-height: 1.4;
      word-break: break-word;
    }

    .message-row.mine .message-bubble {
      background: #1877f2;
      color: white;
    }

    .message-time {
      font-size: 10px;
      color: #65676b;
      margin-top: 4px;
    }

    .message-row.mine .message-time {
      text-align: right;
    }

    .composer {
      border-top: 1px solid #ddd;
      padding: 12px;
      display: flex;
      gap: 10px;
      background: #fff;
    }

    .composer input {
      flex: 1;
      border: 0;
      outline: 0;
      background: #f0f2f5;
      border-radius: 22px;
      padding: 12px 17px;
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: #1877f2;
      color: white;
      cursor: pointer;
      font-size: 18px;
    }

    .loading {
      padding: 20px;
      text-align: center;
      color: #65676b;
    }

    /* MOBILE */
    @media (max-width: 750px) {
      .topbar {
        padding: 0 10px;
      }

      .brand {
        margin-right: 10px;
        font-size: 25px;
      }

      .search {
        display: none;
      }

      .layout {
        display: block;
      }

      .conversations {
        border-right: 0;
      }

      .chat {
        position: fixed;
        inset: 64px 0 0;
        background: white;
        z-index: 50;
        display: none;
      }

      .chat.open {
        display: flex;
      }

      .conversation-list {
        max-height: calc(100vh - 160px);
      }

      .mobile-back {
        display: block !important;
      }
    }

    .mobile-back {
      display: none;
      border: 0;
      background: transparent;
      font-size: 22px;
      cursor: pointer;
      color: #1877f2;
    }

    .verified {
      color: #1877f2;
      font-size: 13px;
    }

    .unread {
      font-weight: 700;
    }
  </style>
</head>

<body>

<header class="topbar">
  <a href="/feed.html" class="brand">Pulse</a>

  <div class="search">
    🔍
    <input
      id="globalSearch"
      type="text"
      placeholder="Search Pulse"
      autocomplete="off"
    >
  </div>

  <div class="top-actions">
    <button class="top-btn" onclick="location.href='/feed.html'">🏠</button>
    <button class="top-btn" onclick="location.href='/notifications.html'">🔔</button>
    <button class="top-btn" onclick="location.href='/profile.html'">👤</button>
  </div>
</header>

<main class="layout">

  <aside class="conversations">
    <div class="conversation-header">
      <h1>Messages</h1>
      <button class="new-message" onclick="newMessage()">✎</button>
    </div>

    <div class="message-search">
      🔍
      <input
        id="conversationSearch"
        type="text"
        placeholder="Search Messenger"
        oninput="filterConversations()"
      >
    </div>

    <div id="conversationList" class="conversation-list">
      <div class="loading">Loading conversations...</div>
    </div>
  </aside>

  <section id="chat" class="chat">

    <div id="chatEmpty" class="chat-empty">
      <div>
        <div class="chat-empty-icon">💬</div>
        <h2>Your Messages</h2>
        <p>Select a conversation to start chatting.</p>
      </div>
    </div>

    <div id="chatContent" style="display:none;height:100%;flex-direction:column;">

      <div class="chat-header">

        <button
          class="mobile-back"
          onclick="closeChat()"
        >
          ←
        </button>

        <img
          id="chatAvatar"
          class="avatar"
          src="/images/default-avatar.png"
          alt=""
        >

        <div class="chat-user">
          <div id="chatName" class="chat-user-name">User</div>
          <div id="chatStatus" class="chat-user-status">
            Pulse user
          </div>
        </div>

        <div class="chat-actions">
          <button class="chat-action">📞</button>
          <button class="chat-action">🎥</button>
          <button
            class="chat-action"
            onclick="openProfile()"
          >
            ℹ️
          </button>
        </div>

      </div>

      <div id="messages" class="messages"></div>

      <form id="composer" class="composer">
        <input
          id="messageInput"
          type="text"
          placeholder="Type a message..."
          maxlength="2000"
          autocomplete="off"
        >

        <button
          class="send-btn"
          type="submit"
        >
          ➤
        </button>
      </form>

    </div>

  </section>

</main>

<script>
  let currentUser = null;
  let currentChatUser = null;
  let conversations = [];

  const defaultAvatar = "/images/default-avatar.png";

  function escapeHTML(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function avatarOf(user) {
    return (
      user?.profilePicture ||
      user?.profileImage ||
      user?.avatar ||
      defaultAvatar
    );
  }

  function nameOf(user) {
    return (
      user?.name ||
      user?.displayName ||
      user?.username ||
      "User"
    );
  }

  function verified(user) {
    return user?.verified || user?.isVerified
      ? `<span class="verified">●</span>`
      : "";
  }

  async function api(url, options = {}) {
    const response = await fetch(url, {
      credentials: "include",
      ...options,
      headers: {
        "Content-Type": "application/json",
        ...(options.headers || {})
      }
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(
        data.error ||
        data.message ||
        `Request failed (${response.status})`
      );
    }

    return data;
  }

  async function loadMe() {
    const data = await api("/api/me");

    currentUser =
      data.user ||
      data;

    if (!currentUser || !currentUser.id) {
      location.href = "/login.html";
      return false;
    }

    return true;
  }

  async function loadConversations() {
    const box = document.getElementById("conversationList");

    try {
      const data = await api("/api/messages/conversations");

      conversations =
        data.conversations ||
        data.users ||
        data ||
        [];

      if (!Array.isArray(conversations)) {
        conversations = [];
      }

      renderConversations();

    } catch (error) {
      console.error(error);

      box.innerHTML = `
        <div class="loading">
          Unable to load messages.
          <br>
          <small>${escapeHTML(error.message)}</small>
        </div>
      `;
    }
  }

  function renderConversations(list = conversations) {
    const box = document.getElementById("conversationList");

    if (!list.length) {
      box.innerHTML = `
        <div class="loading">
          No conversations yet.
          <br><br>
          Start a conversation with another Pulse user.
        </div>
      `;
      return;
    }

    box.innerHTML = list.map(item => {

      const user =
        item.user ||
        item.otherUser ||
        item.recipient ||
        item;

      const lastMessage =
        item.lastMessage ||
        item.message ||
        item.last_message ||
        "Start a conversation";

      const unread =
        item.unreadCount ||
        item.unread ||
        0;

      return `
        <div
          class="conversation ${unread ? "unread" : ""}"
          data-user="${escapeHTML(user.id || "")}"
          data-name="${escapeHTML(nameOf(user).toLowerCase())}"
          onclick="openConversation('${escapeHTML(user.id || "")}')"
        >

          <img
            class="avatar"
            src="${escapeHTML(avatarOf(user))}"
            onerror="this.src='${defaultAvatar}'"
            alt=""
          >

          <div class="conversation-info">
            <div class="conversation-name">
              ${escapeHTML(nameOf(user))}
              ${verified(user)}
            </div>

            <div class="last-message">
              ${escapeHTML(
                typeof lastMessage === "object"
                  ? lastMessage.text || ""
                  : lastMessage
              )}

              ${
                unread
                  ? ` · ${escapeHTML(unread)}`
                  : ""
              }
            </div>
          </div>

        </div>
      `;
    }).join("");
  }

  function filterConversations() {
    const query =
      document
        .getElementById("conversationSearch")
        .value
        .toLowerCase()
        .trim();

    const filtered = conversations.filter(item => {

      const user =
        item.user ||
        item.otherUser ||
        item.recipient ||
        item;

      return nameOf(user)
        .toLowerCase()
        .includes(query);
    });

    renderConversations(filtered);
  }

  async function openConversation(userId) {

    if (!userId) return;

    try {
      const data = await api(`/api/messages/${encodeURIComponent(userId)}`);

      currentChatUser =
        data.user ||
        data.otherUser ||
        data.recipient ||
        data.profile ||
        null;

      let messages =
        data.messages ||
        data.data ||
        data ||
        [];

      if (!Array.isArray(messages)) {
        messages = [];
      }

      if (!currentChatUser) {
        const item = conversations.find(c => {

          const u =
            c.user ||
            c.otherUser ||
            c.recipient ||
            c;

          return String(u.id) === String(userId);
        });

        currentChatUser =
          item?.user ||
          item?.otherUser ||
          item?.recipient ||
          item ||
          {
            id: userId,
            name: "User"
          };
      }

      showChatHeader();

      renderMessages(messages);

      document.getElementById("chat").classList.add("open");

      setTimeout(() => {
        document.getElementById("messageInput")?.focus();
      }, 100);

    } catch (error) {
      console.error(error);
      alert("Unable to load conversation: " + error.message);
    }
  }

  function showChatHeader() {

    document.getElementById("chatEmpty").style.display = "none";

    const content =
      document.getElementById("chatContent");

    content.style.display = "flex";

    const user = currentChatUser || {};

    document.getElementById("chatAvatar").src =
      avatarOf(user);

    document.getElementById("chatAvatar").onerror =
      function () {
        this.src = defaultAvatar;
      };

    document.getElementById("chatName").innerHTML =
      `${escapeHTML(nameOf(user))} ${verified(user)}`;

    document.getElementById("chatStatus").textContent =
      user.username
        ? "@" + user.username
        : "Pulse user";
  }

  function renderMessages(messages) {

    const box = document.getElementById("messages");

    if (!messages.length) {
      box.innerHTML = `
        <div class="chat-empty">
          <div>
            <div class="chat-empty-icon">👋</div>
            <h3>Say hello!</h3>
            <p>Send your first message.</p>
          </div>
        </div>
      `;
      return;
    }

    box.innerHTML = messages.map(message => {

      const senderId =
        message.senderId ||
        message.fromId ||
        message.sender?.id ||
        message.from?.id;

      const mine =
        String(senderId) === String(currentUser?.id);

      const text =
        message.text ||
        message.content ||
        message.message ||
        "";

      const date =
        message.createdAt ||
        message.timestamp ||
        message.date;

      return `
        <div class="message-row ${mine ? "mine" : ""}">
          <div>
            <div class="message-bubble">
              ${escapeHTML(text)}
            </div>

            ${
              date
                ? `<div class="message-time">
                    ${formatTime(date)}
                   </div>`
                : ""
            }
          </div>
        </div>
      `;
    }).join("");

    box.scrollTop = box.scrollHeight;
  }

  function formatTime(value) {

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return "";
    }

    return date.toLocaleString([], {
      hour: "numeric",
      minute: "2-digit"
    });
  }

  document
    .getElementById("composer")
    .addEventListener("submit", async event => {

      event.preventDefault();

      const input =
        document.getElementById("messageInput");

      const text =
        input.value.trim();

      if (!text || !currentChatUser?.id) {
        return;
      }

      const button =
        document.querySelector(".send-btn");

      button.disabled = true;

      try {

        const data = await api("/api/messages", {
          method: "POST",
          body: JSON.stringify({
            recipientId: currentChatUser.id,
            receiverId: currentChatUser.id,
            userId: currentChatUser.id,
            text,
            message: text,
            content: text
          })
        });

        input.value = "";

        const sent =
          data.message ||
          data;

        const box =
          document.getElementById("messages");

        const senderId =
          sent.senderId ||
          currentUser.id;

        const sentText =
          sent.text ||
          sent.content ||
          sent.message ||
          text;

        const time =
          sent.createdAt ||
          new Date().toISOString();

        const html = `
          <div class="message-row mine">
            <div>
              <div class="message-bubble">
                ${escapeHTML(sentText)}
              </div>
              <div class="message-time">
                ${formatTime(time)}
              </div>
            </div>
          </div>
        `;

        if (
          box.querySelector(".chat-empty")
        ) {
          box.innerHTML = "";
        }

        box.insertAdjacentHTML(
          "beforeend",
          html
        );

        box.scrollTop = box.scrollHeight;

        loadConversations();

      } catch (error) {
        console.error(error);
        alert("Unable to send message: " + error.message);
      } finally {
        button.disabled = false;
        input.focus();
      }
    });

  function closeChat() {
    document
      .getElementById("chat")
      .classList.remove("open");
  }

  function openProfile() {

    if (!currentChatUser) return;

    if (currentChatUser.username) {
      location.href =
        "/profile.html?username=" +
        encodeURIComponent(
          currentChatUser.username
        );
    }
  }

  function newMessage() {

    const username =
      prompt("Enter the username of the person you want to message:");

    if (!username) return;

    findUser(username);
  }

  async function findUser(username) {

    try {

      const data =
        await api(
          "/api/search?q=" +
          encodeURIComponent(username)
        );

      const users =
        data.users ||
        data.results ||
        data ||
        [];

      if (!Array.isArray(users) || !users.length) {
        alert("User not found.");
        return;
      }

      const user = users[0];

      if (!user.id) {
        alert("This user cannot be messaged.");
        return;
      }

      await openConversation(user.id);

    } catch (error) {
      alert("Unable to find user: " + error.message);
    }
  }

  async function init() {

    try {

      const loggedIn =
        await loadMe();

      if (!loggedIn) return;

      await loadConversations();

      const params =
        new URLSearchParams(location.search);

      const userId =
        params.get("user");

      if (userId) {
        await openConversation(userId);
      }

    } catch (error) {

      console.error(error);

      location.href = "/login.html";
    }
  }

  init();
</script>

</body>
</html>
