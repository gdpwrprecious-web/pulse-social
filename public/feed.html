<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Pulse Social</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
      color: #fff;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =====================================================
       APP
    ===================================================== */

    .app {
      width: 100%;
      height: 100vh;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    .feed {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;

      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;

      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .feed::-webkit-scrollbar {
      display: none;
    }

    /* =====================================================
       POST
    ===================================================== */

    .post {
      width: 100%;
      height: 100vh;
      min-height: 100vh;

      position: relative;

      scroll-snap-align: start;
      scroll-snap-stop: always;

      overflow: hidden;
      background: #111;
    }

    .post-media {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      background: #111;
    }

    .post-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .post-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .media-gradient {
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, .42) 0%,
          transparent 24%,
          transparent 48%,
          rgba(0, 0, 0, .15) 58%,
          rgba(0, 0, 0, .9) 100%
        );

      pointer-events: none;
    }

    .empty-media {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(circle at 30% 20%, #252525, #080808 65%);
    }

    .empty-media span {
      font-size: 80px;
      font-weight: 900;
      opacity: .08;
    }

    /* =====================================================
       TOP BAR
    ===================================================== */

    .top-bar {
      position: fixed;
      z-index: 100;

      top: 0;
      left: 0;
      right: 0;

      height: 72px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0 18px;

      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, .5),
        transparent
      );

      pointer-events: none;
    }

    .top-tabs {
      display: flex;
      align-items: center;
      gap: 24px;

      pointer-events: auto;
    }

    .tab {
      position: relative;

      background: none;
      color: rgba(255,255,255,.65);

      font-size: 16px;
      font-weight: 600;

      padding: 12px 2px;
    }

    .tab.active {
      color: #fff;
      font-weight: 800;
    }

    .tab.active::after {
      content: "";

      position: absolute;
      left: 50%;
      bottom: 2px;

      width: 28px;
      height: 3px;

      transform: translateX(-50%);

      background: #fff;
      border-radius: 10px;
    }

    .top-search {
      position: absolute;
      right: 18px;

      width: 38px;
      height: 38px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(0,0,0,.28);

      font-size: 21px;
    }

    /* =====================================================
       RIGHT ACTIONS
    ===================================================== */

    .actions {
      position: absolute;

      right: 10px;
      bottom: 94px;

      z-index: 20;

      width: 62px;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 18px;
    }

    .profile-action {
      position: relative;
      width: 50px;
      height: 50px;
    }

    .action-avatar {
      width: 48px;
      height: 48px;

      border-radius: 50%;

      object-fit: cover;

      border: 2px solid #fff;
      background: #222;
    }

    .follow-plus {
      position: absolute;

      left: 50%;
      bottom: -9px;

      transform: translateX(-50%);

      width: 21px;
      height: 21px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #fe2c55;
      color: white;

      font-size: 16px;
      font-weight: 900;

      border: 2px solid #000;
    }

    .follow-plus.following {
      background: #fff;
      color: #111;
    }

    .action {
      width: 58px;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 4px;

      color: #fff;

      background: transparent;

      text-shadow: 0 1px 4px rgba(0,0,0,.7);
    }

    .action-icon {
      width: 48px;
      height: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 31px;

      transition: transform .15s ease;
    }

    .action:active .action-icon {
      transform: scale(.82);
    }

    .action.liked .action-icon {
      color: #fe2c55;
    }

    .action-count {
      font-size: 12px;
      font-weight: 700;
    }

    /* =====================================================
       BOTTOM POST INFO
    ===================================================== */

    .post-info {
      position: absolute;

      left: 16px;
      right: 84px;
      bottom: 92px;

      z-index: 15;
    }

    .username-row {
      display: flex;
      align-items: center;
      gap: 6px;

      margin-bottom: 9px;
    }

    .username {
      font-size: 17px;
      font-weight: 800;

      text-shadow: 0 1px 5px rgba(0,0,0,.7);
    }

    .verified {
      width: 17px;
      height: 17px;

      border-radius: 50%;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      background: #20d5ec;
      color: #fff;

      font-size: 10px;
      font-weight: 900;
    }

    .caption {
      font-size: 15px;
      line-height: 1.4;

      max-width: 480px;

      margin-bottom: 10px;

      text-shadow: 0 1px 5px rgba(0,0,0,.8);
    }

    .hashtags {
      color: #fff;
      font-weight: 700;
    }

    .sound-row {
      display: flex;
      align-items: center;
      gap: 8px;

      font-size: 13px;
      font-weight: 600;

      max-width: 300px;

      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .music-icon {
      font-size: 16px;
    }

    /* =====================================================
       BOTTOM NAVIGATION
    ===================================================== */

    .bottom-nav {
      position: fixed;

      z-index: 200;

      left: 0;
      right: 0;
      bottom: 0;

      height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-around;

      background: linear-gradient(
        to bottom,
        transparent,
        rgba(0,0,0,.92) 35%
      );

      padding: 7px 7px 5px;
    }

    .nav-item {
      width: 20%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 3px;

      color: rgba(255,255,255,.7);

      background: transparent;

      font-size: 10px;
      font-weight: 600;
    }

    .nav-item.active {
      color: #fff;
    }

    .nav-icon {
      font-size: 23px;
      line-height: 1;
    }

    .nav-label {
      font-size: 10px;
    }

    .create-button {
      position: relative;

      width: 48px;
      height: 32px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 10px;

      background: #fff;
      color: #000;

      font-size: 25px;
      font-weight: 400;

      box-shadow:
        -5px 0 0 #20d5ec,
        5px 0 0 #fe2c55;
    }

    /* =====================================================
       LOADING
    ===================================================== */

    .loading {
      position: fixed;

      inset: 0;

      z-index: 500;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #000;
    }

    .loader {
      width: 40px;
      height: 40px;

      border: 4px solid rgba(255,255,255,.2);
      border-top-color: #fff;

      border-radius: 50%;

      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .hidden {
      display: none !important;
    }

    /* =====================================================
       EMPTY STATE
    ===================================================== */

    .empty {
      position: absolute;
      inset: 0;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background: #000;

      text-align: center;

      padding: 30px;
    }

    .empty-logo {
      width: 70px;
      height: 70px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 20px;

      background: #fff;
      color: #000;

      font-size: 38px;
      font-weight: 900;

      margin-bottom: 20px;
    }

    .empty h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .empty p {
      color: #999;
      margin-bottom: 20px;
    }

    .empty button {
      padding: 12px 22px;

      border-radius: 8px;

      background: #fe2c55;
      color: #fff;

      font-weight: 700;
    }

    /* =====================================================
       COMMENTS
    ===================================================== */

    .comments-overlay {
      position: fixed;
      inset: 0;

      z-index: 700;

      background: rgba(0,0,0,.55);

      display: flex;
      align-items: flex-end;

      opacity: 1;
      transition: opacity .2s ease;
    }

    .comments-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .comments-panel {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;

      height: 68vh;

      background: #fff;
      color: #111;

      border-radius: 18px 18px 0 0;

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }

    .comments-header {
      height: 55px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 18px;

      border-bottom: 1px solid #eee;

      font-weight: 800;
    }

    .close-comments {
      width: 34px;
      height: 34px;

      border-radius: 50%;

      background: #f2f2f2;

      font-size: 18px;
    }

    .comments-list {
      flex: 1;

      overflow-y: auto;

      padding: 12px 16px;
    }

    .comment {
      display: flex;
      gap: 10px;

      margin-bottom: 18px;
    }

    .comment-avatar {
      width: 36px;
      height: 36px;

      border-radius: 50%;

      object-fit: cover;

      background: #ddd;
      flex-shrink: 0;
    }

    .comment-body {
      flex: 1;
    }

    .comment-name {
      font-size: 13px;
      font-weight: 800;

      margin-bottom: 4px;
    }

    .comment-text {
      font-size: 14px;
      line-height: 1.35;
    }

    .no-comments {
      text-align: center;
      color: #888;
      padding: 40px 10px;
    }

    .comment-form {
      display: flex;
      gap: 8px;

      padding: 10px;

      border-top: 1px solid #eee;
    }

    .comment-input {
      flex: 1;

      border: 0;
      outline: none;

      background: #f1f1f1;

      border-radius: 22px;

      padding: 12px 15px;
    }

    .comment-submit {
      width: 44px;
      height: 44px;

      border-radius: 50%;

      background: #fe2c55;
      color: white;

      font-size: 18px;
    }

    /* =====================================================
       CREATE SHEET
    ===================================================== */

    .create-overlay {
      position: fixed;
      inset: 0;

      z-index: 800;

      background: rgba(0,0,0,.65);

      display: flex;
      align-items: flex-end;

      transition: opacity .2s ease;
    }

    .create-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .create-panel {
      width: 100%;
      max-width: 600px;

      margin: 0 auto;

      background: #fff;
      color: #111;

      border-radius: 20px 20px 0 0;

      padding: 20px;

      max-height: 80vh;

      overflow-y: auto;
    }

    .create-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 20px;
    }

    .create-header h2 {
      font-size: 20px;
    }

    .create-close {
      width: 34px;
      height: 34px;

      border-radius: 50%;

      background: #eee;
    }

    .create-input,
    .create-textarea {
      width: 100%;

      border: 1px solid #ddd;
      outline: none;

      border-radius: 10px;

      padding: 13px;

      margin-bottom: 12px;
    }

    .create-textarea {
      min-height: 120px;
      resize: vertical;
    }

    .create-file {
      margin-bottom: 15px;
    }

    .create-submit {
      width: 100%;

      padding: 14px;

      border-radius: 10px;

      background: #fe2c55;
      color: white;

      font-weight: 800;
    }

    /* =====================================================
       DESKTOP
    ===================================================== */

    @media (min-width: 700px) {
      body {
        background: #111;
      }

      .app {
        width: 430px;
        height: 100vh;

        margin: 0 auto;

        box-shadow:
          0 0 60px rgba(0,0,0,.8);
      }

      .top-bar {
        left: calc(50% - 215px);
        right: calc(50% - 215px);
      }

      .bottom-nav {
        left: calc(50% - 215px);
        right: calc(50% - 215px);
      }

      .comments-overlay,
      .create-overlay {
        justify-content: center;
        align-items: center;
      }

      .comments-panel,
      .create-panel {
        border-radius: 18px;
      }
    }

    /* =====================================================
       SAFE AREA
    ===================================================== */

    @supports (padding: env(safe-area-inset-bottom)) {
      .bottom-nav {
        padding-bottom: calc(
          5px + env(safe-area-inset-bottom)
        );
      }

      .post-info {
        bottom: calc(
          92px + env(safe-area-inset-bottom)
        );
      }

      .actions {
        bottom: calc(
          94px + env(safe-area-inset-bottom)
        );
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- ===================================================
       TOP BAR
  ==================================================== -->

  <header class="top-bar">

    <div class="top-tabs">

      <button
        class="tab"
        id="followingTab"
        onclick="switchFeed('following')"
      >
        Following
      </button>

      <button
        class="tab active"
        id="forYouTab"
        onclick="switchFeed('foryou')"
      >
        For You
      </button>

    </div>

    <button
      class="top-search"
      onclick="goToSearch()"
      aria-label="Search"
    >
      🔍
    </button>

  </header>

  <!-- ===================================================
       FEED
  ==================================================== -->

  <main
    id="feed"
    class="feed"
  ></main>

  <!-- ===================================================
       BOTTOM NAV
  ==================================================== -->

  <nav class="bottom-nav">

    <button
      class="nav-item active"
      onclick="goHome()"
    >
      <span class="nav-icon">⌂</span>
      <span class="nav-label">Home</span>
    </button>

    <button
      class="nav-item"
      onclick="goFriends()"
    >
      <span class="nav-icon">◎</span>
      <span class="nav-label">Friends</span>
    </button>

    <button
      class="nav-item"
      onclick="openCreate()"
    >
      <span class="create-button">+</span>
      <span class="nav-label">Create</span>
    </button>

    <button
      class="nav-item"
      onclick="goMessages()"
    >
      <span class="nav-icon">▢</span>
      <span class="nav-label">Inbox</span>
    </button>

    <button
      class="nav-item"
      onclick="goProfile()"
    >
      <span class="nav-icon">◉</span>
      <span class="nav-label">Profile</span>
    </button>

  </nav>

</div>

<!-- =====================================================
     LOADING
====================================================== -->

<div
  id="loading"
  class="loading"
>
  <div class="loader"></div>
</div>

<!-- =====================================================
     COMMENTS
====================================================== -->

<div
  id="commentsOverlay"
  class="comments-overlay hidden"
  onclick="closeComments(event)"
>

  <section
    class="comments-panel"
    onclick="event.stopPropagation()"
  >

    <header class="comments-header">

      <span id="commentsTitle">
        Comments
      </span>

      <button
        class="close-comments"
        onclick="closeComments()"
      >
        ✕
      </button>

    </header>

    <div
      id="commentsList"
      class="comments-list"
    ></div>

    <form
      class="comment-form"
      onsubmit="submitComment(event)"
    >

      <input
        id="commentInput"
        class="comment-input"
        type="text"
        placeholder="Add comment..."
        autocomplete="off"
        maxlength="500"
      >

      <button
        class="comment-submit"
        type="submit"
      >
        ➤
      </button>

    </form>

  </section>

</div>

<!-- =====================================================
     CREATE
====================================================== -->

<div
  id="createOverlay"
  class="create-overlay hidden"
  onclick="closeCreate(event)"
>

  <section
    class="create-panel"
    onclick="event.stopPropagation()"
  >

    <header class="create-header">

      <h2>Create post</h2>

      <button
        class="create-close"
        onclick="closeCreate()"
      >
        ✕
      </button>

    </header>

    <form
      id="createForm"
      onsubmit="createPost(event)"
    >

      <textarea
        id="createText"
        class="create-textarea"
        placeholder="What's happening?"
        maxlength="1000"
      ></textarea>

      <input
        id="createImage"
        class="create-file"
        type="file"
        accept="image/*,video/*"
      >

      <button
        class="create-submit"
        type="submit"
      >
        Post
      </button>

    </form>

  </section>

</div>

<script>
  /* =====================================================
     STATE
  ===================================================== */

  let currentUser = null;
  let posts = [];

  let activeFeed = "foryou";

  let currentCommentPostId = null;

  let observer = null;

  /* =====================================================
     API
  ===================================================== */

  async function api(url, options = {}) {

    const config = {
      credentials: "include",
      ...options
    };

    config.headers = {
      ...(options.headers || {})
    };

    const response = await fetch(url, config);

    let data = null;

    try {
      data = await response.json();
    } catch {
      data = {};
    }

    if (!response.ok) {

      throw new Error(
        data.error ||
        data.message ||
        "Request failed"
      );

    }

    return data;
  }

  /* =====================================================
     INIT
  ===================================================== */

  document.addEventListener(
    "DOMContentLoaded",
    init
  );

  async function init() {

    try {

      const me = await api("/api/me");

      if (!me.loggedIn || !me.user) {

        window.location.href = "/login.html";
        return;

      }

      currentUser = me.user;

      await loadFeed();

    } catch (error) {

      console.error(error);

      window.location.href = "/login.html";

    }
  }

  /* =====================================================
     LOAD FEED
  ===================================================== */

  async function loadFeed() {

    const feed = document.getElementById("feed");

    feed.innerHTML = "";

    try {

      const data = await api("/api/feed");

      posts = Array.isArray(data.posts)
        ? data.posts
        : [];

      /*
        Current backend returns the main feed.

        Following is filtered client-side using
        isFollowing when available.
      */

      let displayPosts = posts;

      if (activeFeed === "following") {

        displayPosts = posts.filter(post => {

          return (
            post.user &&
            (
              post.user.isFollowing === true ||
              post.isFollowing === true
            )
          );

        });

      }

      renderPosts(displayPosts);

    } catch (error) {

      console.error(error);

      feed.innerHTML = `
        <div class="empty">
          <div class="empty-logo">P</div>
          <h2>Unable to load your feed</h2>
          <p>${escapeHtml(error.message)}</p>
          <button onclick="loadFeed()">Try again</button>
        </div>
      `;

    } finally {

      document
        .getElementById("loading")
        .classList.add("hidden");

    }
  }

  /* =====================================================
     RENDER POSTS
  ===================================================== */

  function renderPosts(list) {

    const feed = document.getElementById("feed");

    feed.innerHTML = "";

    if (!list.length) {

      feed.innerHTML = `
        <div class="empty">
          <div class="empty-logo">P</div>

          <h2>
            ${
              activeFeed === "following"
                ? "No posts from people you follow"
                : "Your For You feed is empty"
            }
          </h2>

          <p>
            ${
              activeFeed === "following"
                ? "Follow people to see their posts here."
                : "Be the first to create something."
            }
          </p>

          <button onclick="openCreate()">
            Create post
          </button>
        </div>
      `;

      return;
    }

    list.forEach((post, index) => {

      const element = createPostElement(
        post,
        index
      );

      feed.appendChild(element);

    });

    setupMediaObserver();

  }

  /* =====================================================
     CREATE POST ELEMENT
  ===================================================== */

  function createPostElement(post, index) {

    const article = document.createElement("article");

    article.className = "post";

    article.dataset.id = post.id;

    const user = post.user || post.author || {};

    const avatar =
      user.profilePicture ||
      user.profileImage ||
      user.avatar ||
      "/images/default-avatar.png";

    const username =
      user.username ||
      "user";

    const name =
      user.name ||
      username;

    const verified =
      user.verified ||
      user.isVerified;

    const liked =
      post.liked ||
      post.isLiked;

    const following =
      user.isFollowing ||
      post.isFollowing;

    const likes =
      Number(
        post.likesCount ??
        post.likeCount ??
        0
      );

    const comments =
      Number(
        post.commentsCount ??
        post.commentCount ??
        0
      );

    const text =
      post.text ||
      post.caption ||
      "";

    const media =
      getMedia(post);

    article.innerHTML = `

      ${media}

      <div class="media-gradient"></div>

      <!-- RIGHT ACTIONS -->

      <aside class="actions">

        <button
          class="profile-action"
          onclick="openUserProfile('${escapeAttr(username)}')"
        >

          <img
            class="action-avatar"
            src="${escapeAttr(avatar)}"
            alt="${escapeAttr(name)}"
            onerror="this.src='/images/default-avatar.png'"
          >

          ${
            user.id !== currentUser.id
              ? `
                <span
                  class="follow-plus ${
                    following ? "following" : ""
                  }"
                  onclick="toggleFollow(event, '${escapeAttr(user.id)}', this)"
                >
                  ${following ? "✓" : "+"}
                </span>
              `
              : ""
          }

        </button>

        <button
          class="action ${liked ? "liked" : ""}"
          onclick="toggleLike('${escapeAttr(post.id)}', this)"
        >

          <span class="action-icon">
            ${liked ? "♥" : "♡"}
          </span>

          <span class="action-count">
            ${formatCount(likes)}
          </span>

        </button>

        <button
          class="action"
          onclick="openComments('${escapeAttr(post.id)}')"
        >

          <span class="action-icon">
            💬
          </span>

          <span class="action-count">
            ${formatCount(comments)}
          </span>

        </button>

        <button
          class="action"
          onclick="sharePost('${escapeAttr(post.id)}', '${escapeAttr(username)}')"
        >

          <span class="action-icon">
            ↗
          </span>

          <span class="action-count">
            Share
          </span>

        </button>

        ${
          user.id === currentUser.id
            ? `
              <button
                class="action"
                onclick="deletePost('${escapeAttr(post.id)}')"
              >
                <span class="action-icon">
                  ⋯
                </span>

                <span class="action-count">
                  Delete
                </span>
              </button>
            `
            : ""
        }

      </aside>

      <!-- POST INFO -->

      <div class="post-info">

        <div class="username-row">

          <span class="username">
            @${escapeHtml(username)}
          </span>

          ${
            verified
              ? `
                <span
                  class="verified"
                  title="Verified"
                >
                  ✓
                </span>
              `
              : ""
          }

        </div>

        ${
          text
            ? `
              <div class="caption">
                ${formatCaption(text)}
              </div>
            `
            : ""
        }

        <div class="sound-row">

          <span class="music-icon">
            ♪
          </span>

          <span>
            Original sound · ${escapeHtml(username)}
          </span>

        </div>

      </div>

    `;

    return article;
  }

  /* =====================================================
     MEDIA
  ===================================================== */

  function getMedia(post) {

    const video =
      post.video ||
      post.videoUrl ||
      post.mediaType === "video"
        ? (
            post.video ||
            post.videoUrl ||
            post.mediaUrl
          )
        : null;

    const image =
      post.image ||
      post.imageUrl ||
      post.mediaUrl;

    if (video) {

      return `
        <video
          class="post-media post-video"
          src="${escapeAttr(video)}"
          loop
          muted
          playsinline
          preload="metadata"
        ></video>
      `;

    }

    if (image) {

      return `
        <img
          class="post-media post-image"
          src="${escapeAttr(image)}"
          alt="Post"
          loading="lazy"
          onerror="this.style.display='none'"
        >
      `;

    }

    return `
      <div class="post-media empty-media">
        <span>Pulse</span>
      </div>
    `;

  }

  /* =====================================================
     VIDEO OBSERVER
  ===================================================== */

  function setupMediaObserver() {

    if (observer) {
      observer.disconnect();
    }

    const videos =
      document.querySelectorAll(".post-video");

    observer = new IntersectionObserver(
      entries => {

        entries.forEach(entry => {

          const video = entry.target;

          if (entry.isIntersecting) {

            video.play().catch(() => {});

          } else {

            video.pause();

          }

        });

      },
      {
        threshold: .65
      }
    );

    videos.forEach(video => {

      observer.observe(video);

    });

  }

  /* =====================================================
     FEED TABS
  ===================================================== */

  function switchFeed(type) {

    activeFeed = type;

    document
      .getElementById("forYouTab")
      .classList.toggle(
        "active",
        type === "foryou"
      );

    document
      .getElementById("followingTab")
      .classList.toggle(
        "active",
        type === "following"
      );

    loadFeed();

  }

  /* =====================================================
     LIKE
  ===================================================== */

  async function toggleLike(postId, button) {

    try {

      const data = await api(
        `/api/posts/${encodeURIComponent(postId)}/like`,
        {
          method: "POST"
        }
      );

      const liked =
        data.liked ??
        data.isLiked ??
        false;

      const count =
        data.likesCount ??
        data.likeCount;

      button.classList.toggle(
        "liked",
        liked
      );

      const icon =
        button.querySelector(".action-icon");

      if (icon) {
        icon.textContent =
          liked ? "♥" : "♡";
      }

      if (count !== undefined) {

        const counter =
          button.querySelector(".action-count");

        if (counter) {
          counter.textContent =
            formatCount(count);
        }

      }

    } catch (error) {

      console.error(error);

    }

  }

  /* =====================================================
     FOLLOW
  ===================================================== */

  async function toggleFollow(
    event,
    userId,
    element
  ) {

    event.stopPropagation();

    if (!userId) {
      return;
    }

    try {

      const data = await api(
        `/api/users/${encodeURIComponent(userId)}/follow`,
        {
          method: "POST"
        }
      );

      const following =
        data.following ??
        data.isFollowing ??
        false;

      element.classList.toggle(
        "following",
        following
      );

      element.textContent =
        following ? "✓" : "+";

    } catch (error) {

      console.error(error);

    }

  }

  /* =====================================================
     COMMENTS
  ===================================================== */

  async function openComments(postId) {

    currentCommentPostId = postId;

    const overlay =
      document.getElementById(
        "commentsOverlay"
      );

    const list =
      document.getElementById(
        "commentsList"
      );

    overlay.classList.remove("hidden");

    list.innerHTML = `
      <div class="no-comments">
        Loading comments...
      </div>
    `;

    try {

      const data = await api(
        `/api/posts/${encodeURIComponent(postId)}/comments`
      );

      const comments =
        Array.isArray(data.comments)
          ? data.comments
          : [];

      renderComments(comments);

    } catch (error) {

      list.innerHTML = `
        <div class="no-comments">
          Unable to load comments.
          <br><br>
          ${escapeHtml(error.message)}
        </div>
      `;

    }

  }

  function renderComments(comments) {

    const list =
      document.getElementById(
        "commentsList"
      );

    if (!comments.length) {

      list.innerHTML = `
        <div class="no-comments">
          No comments yet.<br>
          Be the first to comment.
        </div>
      `;

      return;
    }

    list.innerHTML = comments
      .map(comment => {

        const user =
          comment.user ||
          comment.author ||
          {};

        const avatar =
          user.profilePicture ||
          user.profileImage ||
          user.avatar ||
          "/images/default-avatar.png";

        const username =
          user.username ||
          "user";

        const text =
          comment.text ||
          comment.content ||
          "";

        return `
          <div class="comment">

            <img
              class="comment-avatar"
              src="${escapeAttr(avatar)}"
              onerror="this.src='/images/default-avatar.png'"
            >

            <div class="comment-body">

              <div class="comment-name">
                @${escapeHtml(username)}
              </div>

              <div class="comment-text">
                ${escapeHtml(text)}
              </div>

            </div>

          </div>
        `;

      })
      .join("");

  }

  async function submitComment(event) {

    event.preventDefault();

    if (!currentCommentPostId) {
      return;
    }

    const input =
      document.getElementById(
        "commentInput"
      );

    const text =
      input.value.trim();

    if (!text) {
      return;
    }

    input.disabled = true;

    try {

      await api(
        `/api/posts/${encodeURIComponent(currentCommentPostId)}/comments`,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            text
          })
        }
      );

      input.value = "";

      await openComments(
        currentCommentPostId
      );

    } catch (error) {

      alert(
        error.message ||
        "Unable to add comment."
      );

    } finally {

      input.disabled = false;

      input.focus();

    }

  }

  function closeComments(event) {

    if (
      event &&
      event.target !==
        document.getElementById(
          "commentsOverlay"
        )
    ) {
      return;
    }

    document
      .getElementById("commentsOverlay")
      .classList.add("hidden");

    currentCommentPostId = null;

  }

  /* =====================================================
     SHARE
  ===================================================== */

  async function sharePost(
    postId,
    username
  ) {

    const url =
      `${window.location.origin}/feed.html#post-${postId}`;

    const shareData = {
      title: `Pulse Social`,
      text: `Check out @${username}'s post on Pulse Social`,
      url
    };

    try {

      if (
        navigator.share &&
        navigator.canShare
          ? navigator.canShare(shareData)
          : navigator.share
      ) {

        await navigator.share(
          shareData
        );

        return;

      }

    } catch (error) {

      if (error.name === "AbortError") {
        return;
      }

    }

    try {

      await navigator.clipboard.writeText(
        url
      );

      alert(
        "Post link copied."
      );

    } catch {

      alert(url);

    }

  }

  /* =====================================================
     DELETE POST
  ===================================================== */

  async function deletePost(postId) {

    const confirmed =
      confirm(
        "Delete this post?"
      );

    if (!confirmed) {
      return;
    }

    try {

      await api(
        `/api/posts/${encodeURIComponent(postId)}`,
        {
          method: "DELETE"
        }
      );

      await loadFeed();

    } catch (error) {

      alert(
        error.message ||
        "Unable to delete post."
      );

    }

  }

  /* =====================================================
     CREATE
  ===================================================== */

  function openCreate() {

    document
      .getElementById("createOverlay")
      .classList.remove("hidden");

  }

  function closeCreate(event) {

    if (
      event &&
      event.target !==
        document.getElementById(
          "createOverlay"
        )
    ) {
      return;
    }

    document
      .getElementById("createOverlay")
      .classList.add("hidden");

  }

  async function createPost(event) {

    event.preventDefault();

    const text =
      document
        .getElementById("createText")
        .value
        .trim();

    const file =
      document
        .getElementById("createImage")
        .files[0];

    if (!text && !file) {

      alert(
        "Write something or choose a photo/video."
      );

      return;

    }

    const button =
      document.querySelector(
        ".create-submit"
      );

    button.disabled = true;
    button.textContent = "Posting...";

    try {

      const form =
        new FormData();

      form.append(
        "text",
        text
      );

      if (file) {

        /*
          Current server expects "image".
          Video upload support can be added
          to server.js next.
        */

        form.append(
          "image",
          file
        );

      }

      await api(
        "/api/posts",
        {
          method: "POST",
          body: form
        }
      );

      document
        .getElementById("createForm")
        .reset();

      closeCreate();

      activeFeed = "foryou";

      document
        .getElementById("forYouTab")
        .classList.add("active");

      document
        .getElementById("followingTab")
        .classList.remove("active");

      await loadFeed();

    } catch (error) {

      alert(
        error.message ||
        "Unable to create post."
      );

    } finally {

      button.disabled = false;
      button.textContent = "Post";

    }

  }

  /* =====================================================
     NAVIGATION
  ===================================================== */

  function goHome() {

    window.location.href =
      "/feed.html";

  }

  function goFriends() {

    /*
      Friends can use search for now.
    */

    window.location.href =
      "/feed.html#friends";

  }

  function goMessages() {

    window.location.href =
      "/messages.html";

  }

  function goProfile() {

    if (!currentUser) {
      return;
    }

    const username =
      currentUser.username;

    if (!username) {
      return;
    }

    window.location.href =
      `/profile.html?username=${encodeURIComponent(username)}`;

  }

  function openUserProfile(username) {

    if (!username) {
      return;
    }

    window.location.href =
      `/profile.html?username=${encodeURIComponent(username)}`;

  }

  function goToSearch() {

    window.location.href =
      "/feed.html#search";

  }

  /* =====================================================
     HELPERS
  ===================================================== */

  function formatCount(number) {

    number =
      Number(number) || 0;

    if (number >= 1000000) {

      return (
        (number / 1000000)
          .toFixed(1)
          .replace(".0", "") +
        "M"
      );

    }

    if (number >= 1000) {

      return (
        (number / 1000)
          .toFixed(1)
          .replace(".0", "") +
        "K"
      );

    }

    return String(number);

  }

  function formatCaption(text) {

    let safe =
      escapeHtml(text);

    safe =
      safe.replace(
        /(^|\s)(#[a-zA-Z0-9_]+)/g,
        '$1<span class="hashtags">$2</span>'
      );

    safe =
      safe.replace(
        /\n/g,
        "<br>"
      );

    return safe;

  }

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }

  function escapeAttr(value) {

    return escapeHtml(value);

  }

  /* =====================================================
     KEYBOARD
  ===================================================== */

  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Escape"
      ) {

        closeComments();

        closeCreate();

      }

    }
  );

</script>
