<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pulse Social — Feed</title>

  <link rel="stylesheet" href="/css/style.css">

  <style>
    :root {
      --pulse-blue: #1877f2;
      --pulse-blue-dark: #0d65d9;
      --pulse-green: #16a34a;
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #1c1e21;
      --muted: #65676b;
      --border: #dddfe2;
      --hover: #f2f2f2;
      --danger: #e41e3f;
      --shadow: 0 2px 8px rgba(0,0,0,.08);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img,
    video {
      max-width: 100%;
    }

    .hidden {
      display: none !important;
    }

    /* =====================================================
       TOP BAR
    ===================================================== */

    .topbar {
      height: 64px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 250px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1877f2, #16a34a);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 900;
      font-size: 21px;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 900;
      color: var(--pulse-blue);
    }

    .search-box {
      width: 260px;
      height: 40px;
      background: #f0f2f5;
      border-radius: 22px;
      display: flex;
      align-items: center;
      padding: 0 15px;
      gap: 9px;
    }

    .search-box span {
      font-size: 18px;
    }

    .search-box input {
      border: 0;
      outline: none;
      background: transparent;
      width: 100%;
      font-size: 14px;
    }

    .top-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-nav-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      position: relative;
    }

    .top-nav-btn:hover {
      background: #e4e6eb;
    }

    .notification-dot {
      position: absolute;
      right: 3px;
      top: 2px;
      background: #e41e3f;
      color: white;
      font-size: 10px;
      min-width: 17px;
      height: 17px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid white;
    }

    .top-profile {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      cursor: pointer;
    }

    /* =====================================================
       LAYOUT
    ===================================================== */

    .page {
      max-width: 1500px;
      margin: auto;
      display: grid;
      grid-template-columns: 260px minmax(450px, 680px) 280px;
      gap: 22px;
      padding: 22px;
      align-items: start;
    }

    .left-sidebar,
    .right-sidebar {
      position: sticky;
      top: 86px;
    }

    /* =====================================================
       SIDEBAR
    ===================================================== */

    .sidebar-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .sidebar-profile:hover {
      background: #e4e6eb;
    }

    .sidebar-profile img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
    }

    .sidebar-profile strong {
      display: block;
    }

    .sidebar-profile small {
      color: var(--muted);
    }

    .side-menu {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .side-menu button {
      width: 100%;
      background: transparent;
      border-radius: 10px;
      padding: 11px;
      display: flex;
      align-items: center;
      gap: 13px;
      text-align: left;
      font-weight: 600;
      color: #333;
    }

    .side-menu button:hover {
      background: #e4e6eb;
    }

    .side-icon {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e4e6eb;
      font-size: 17px;
    }

    .sidebar-divider {
      height: 1px;
      background: var(--border);
      margin: 15px 0;
    }

    .shortcut-title {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      padding: 0 10px 8px;
    }

    /* =====================================================
       STORIES
    ===================================================== */

    .stories-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-header h2 {
      font-size: 18px;
    }

    .section-header button {
      background: transparent;
      color: var(--pulse-blue);
      font-weight: 700;
    }

    .stories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }

    .stories::-webkit-scrollbar {
      display: none;
    }

    .story {
      flex: 0 0 108px;
      height: 175px;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      background: linear-gradient(145deg, #1877f2, #16a34a);
      box-shadow: 0 2px 5px rgba(0,0,0,.15);
    }

    .story img,
    .story video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .story::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        transparent 40%,
        rgba(0,0,0,.75)
      );
    }

    .story-user {
      position: absolute;
      left: 9px;
      bottom: 9px;
      color: white;
      font-size: 12px;
      font-weight: 800;
      z-index: 2;
      max-width: 90px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .story-avatar {
      position: absolute;
      left: 8px;
      top: 8px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 3px solid var(--pulse-blue);
      object-fit: cover;
      z-index: 3;
    }

    .create-story {
      background: white;
      border: 1px solid var(--border);
    }

    .create-story::after {
      display: none;
    }

    .create-story .story-create-image {
      height: 115px;
      background: #e4e6eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      color: var(--pulse-blue);
    }

    .create-story span {
      display: block;
      text-align: center;
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
      padding: 9px 2px;
    }

    /* =====================================================
       COMPOSER
    ===================================================== */

    .composer {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 15px;
      margin-bottom: 18px;
    }

    .composer-top {
      display: flex;
      gap: 11px;
      align-items: center;
    }

    .composer-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
    }

    .composer-input {
      flex: 1;
      background: #f0f2f5;
      border-radius: 22px;
      padding: 12px 16px;
      color: #65676b;
      cursor: pointer;
    }

    .composer-input:hover {
      background: #e4e6eb;
    }

    .composer-editor {
      margin-top: 12px;
    }

    .composer-editor textarea {
      width: 100%;
      min-height: 100px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px;
      outline: none;
      resize: vertical;
    }

    .composer-tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .composer-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .composer-action {
      background: #f0f2f5;
      padding: 9px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 13px;
    }

    .composer-action:hover {
      background: #e4e6eb;
    }

    .post-btn {
      background: var(--pulse-blue);
      color: white;
      padding: 10px 23px;
      border-radius: 20px;
      font-weight: 800;
    }

    .post-btn:hover {
      background: var(--pulse-blue-dark);
    }

    .image-preview {
      margin-top: 10px;
      position: relative;
      display: inline-block;
    }

    .image-preview img {
      max-height: 250px;
      max-width: 100%;
      border-radius: 10px;
    }

    .remove-preview {
      position: absolute;
      right: 8px;
      top: 8px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(0,0,0,.7);
      color: white;
    }

    /* =====================================================
       FEED TABS
    ===================================================== */

    .feed-tabs {
      background: white;
      border-radius: 12px;
      padding: 5px;
      display: flex;
      margin-bottom: 15px;
      box-shadow: var(--shadow);
    }

    .feed-tab {
      flex: 1;
      background: transparent;
      padding: 11px;
      border-radius: 8px;
      font-weight: 800;
      color: var(--muted);
    }

    .feed-tab.active {
      background: #eaf2ff;
      color: var(--pulse-blue);
    }

    /* =====================================================
       POSTS
    ===================================================== */

    .post {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 17px;
      overflow: hidden;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 15px 8px;
    }

    .post-avatar {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      object-fit: cover;
      cursor: pointer;
    }

    .post-user-info {
      flex: 1;
      min-width: 0;
    }

    .post-user-name {
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .post-user-name:hover {
      text-decoration: underline;
    }

    .verified {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--pulse-blue);
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 900;
    }

    .post-meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .post-menu {
      width: 35px;
      height: 35px;
      background: transparent;
      border-radius: 50%;
      font-size: 20px;
    }

    .post-menu:hover {
      background: #f0f2f5;
    }

    .follow-small {
      background: #eaf2ff;
      color: var(--pulse-blue);
      padding: 6px 12px;
      border-radius: 18px;
      font-size: 12px;
      font-weight: 800;
    }

    .follow-small.following {
      background: #e4e6eb;
      color: #333;
    }

    .post-body {
      padding: 5px 15px 12px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }

    .mention,
    .hashtag {
      color: var(--pulse-blue);
      font-weight: 700;
    }

    .post-media {
      width: 100%;
      max-height: 650px;
      background: #000;
      display: block;
      object-fit: contain;
    }

    .post-stats {
      display: flex;
      justify-content: space-between;
      padding: 9px 15px;
      color: var(--muted);
      font-size: 13px;
      border-bottom: 1px solid #eee;
    }

    .post-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 5px 10px;
    }

    .post-action {
      background: transparent;
      padding: 9px;
      border-radius: 7px;
      color: #65676b;
      font-weight: 700;
    }

    .post-action:hover {
      background: #f0f2f5;
    }

    .post-action.liked {
      color: #1877f2;
    }

    .comments {
      border-top: 1px solid #eee;
      padding: 10px 15px 13px;
      display: none;
    }

    .comments.open {
      display: block;
    }

    .comment {
      display: flex;
      gap: 8px;
      margin-bottom: 9px;
    }

    .comment img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    .comment-bubble {
      background: #f0f2f5;
      border-radius: 15px;
      padding: 7px 10px;
      flex: 1;
    }

    .comment-bubble strong {
      display: block;
      font-size: 12px;
    }

    .comment-bubble span {
      font-size: 13px;
      white-space: pre-wrap;
    }

    .comment-form {
      display: flex;
      gap: 7px;
    }

    .comment-form input {
      flex: 1;
      border: 0;
      background: #f0f2f5;
      border-radius: 20px;
      padding: 9px 13px;
      outline: none;
    }

    .comment-form button {
      background: var(--pulse-blue);
      color: white;
      width: 38px;
      border-radius: 50%;
    }

    /* =====================================================
       REELS
    ===================================================== */

    .reels-card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 18px;
      padding: 14px;
    }

    .reels-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .reels-title h2 {
      font-size: 19px;
    }

    .reels-title button {
      background: #eaf2ff;
      color: var(--pulse-blue);
      border-radius: 18px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 800;
    }

    .reels {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .reels::-webkit-scrollbar {
      display: none;
    }

    .reel-card {
      flex: 0 0 180px;
      height: 280px;
      border-radius: 12px;
      overflow: hidden;
      background: #111;
      position: relative;
      cursor: pointer;
    }

    .reel-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .reel-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        transparent 45%,
        rgba(0,0,0,.8)
      );
      pointer-events: none;
    }

    .reel-info {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      color: white;
      z-index: 2;
    }

    .reel-info strong {
      display: block;
      font-size: 13px;
    }

    .reel-info small {
      opacity: .8;
    }

    .reel-play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(0,0,0,.55);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      z-index: 3;
    }

    /* =====================================================
       RIGHT SIDEBAR
    ===================================================== */

    .right-card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      margin-bottom: 15px;
    }

    .right-card h3 {
      font-size: 16px;
      margin-bottom: 13px;
    }

    .person {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 12px;
    }

    .person img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }

    .person-info {
      flex: 1;
      min-width: 0;
    }

    .person-info strong {
      display: block;
      font-size: 13px;
    }

    .person-info small {
      color: var(--muted);
      font-size: 11px;
    }

    .person button {
      background: #eaf2ff;
      color: var(--pulse-blue);
      border-radius: 15px;
      padding: 6px 9px;
      font-size: 11px;
      font-weight: 800;
    }

    .online-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #31a24c;
      margin-left: auto;
    }

    /* =====================================================
       EMPTY / LOADING
    ===================================================== */

    .loading {
      background: white;
      padding: 35px;
      border-radius: var(--radius);
      text-align: center;
      color: var(--muted);
      box-shadow: var(--shadow);
    }

    .empty {
      background: white;
      padding: 35px 20px;
      border-radius: var(--radius);
      text-align: center;
      color: var(--muted);
      box-shadow: var(--shadow);
      margin-bottom: 15px;
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 8px;
    }

    /* =====================================================
       MODALS
    ===================================================== */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.open {
      display: flex;
    }

    .modal-box {
      background: white;
      border-radius: 16px;
      max-width: 520px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h2 {
      font-size: 18px;
    }

    .modal-close {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: #f0f2f5;
      font-size: 20px;
    }

    .modal-body {
      padding: 16px;
    }

    .modal-body input,
    .modal-body textarea,
    .modal-body select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 11px;
      outline: none;
      margin-bottom: 12px;
    }

    .modal-submit {
      width: 100%;
      background: var(--pulse-blue);
      color: white;
      border-radius: 9px;
      padding: 12px;
      font-weight: 800;
    }

    /* STORY VIEWER */

    .story-viewer {
      max-width: 440px;
      width: 100%;
      height: 82vh;
      background: #000;
      border-radius: 15px;
      overflow: hidden;
      position: relative;
    }

    .story-viewer img,
    .story-viewer video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .story-viewer-top {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 5;
      color: white;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .story-viewer-top img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
    }

    .story-close {
      margin-left: auto;
      background: rgba(0,0,0,.55);
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 20px;
    }

    .story-progress {
      position: absolute;
      top: 5px;
      left: 10px;
      right: 10px;
      height: 3px;
      background: rgba(255,255,255,.35);
      z-index: 5;
    }

    .story-progress-inner {
      width: 0%;
      height: 100%;
      background: white;
      transition: width .1s linear;
    }

    /* REEL VIEWER */

    .reel-viewer {
      max-width: 430px;
      width: 100%;
      height: 85vh;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
    }

    .reel-viewer video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .reel-viewer-close {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 5;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0,0,0,.6);
      color: white;
      font-size: 20px;
    }

    /* =====================================================
       MOBILE NAV
    ===================================================== */

    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 62px;
      background: white;
      border-top: 1px solid var(--border);
      z-index: 2000;
      grid-template-columns: repeat(5, 1fr);
    }

    .mobile-nav button {
      background: transparent;
      color: #555;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 18px;
    }

    .mobile-nav button span {
      font-size: 10px;
      font-weight: 700;
    }

    .mobile-nav button.active {
      color: var(--pulse-blue);
    }

    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-width: 1100px) {
      .page {
        grid-template-columns: 210px minmax(420px, 680px);
      }

      .right-sidebar {
        display: none;
      }

      .brand-area {
        min-width: auto;
      }
    }

  <script>

    /* =====================================================
       GLOBAL STATE
    ===================================================== */

    let currentUser = null;
    let currentMode = "for-you";
    let selectedImage = null;
    let storiesData = [];
    let reelsData = [];
    let currentStoryIndex = 0;
    let storyTimer = null;

    const DEFAULT_AVATAR = "/images/default-avatar.png";

    /* =====================================================
       API HELPER
    ===================================================== */

    async function api(url, options = {}) {

      const config = {
        credentials: "include",
        ...options
      };

      if (
        config.body &&
        !(config.body instanceof FormData)
      ) {
        config.headers = {
          "Content-Type": "application/json",
          ...(config.headers || {})
        };
      }

      const response = await fetch(url, config);

      let data = null;

      try {
        data = await response.json();
      } catch {
        data = {};
      }

      if (!response.ok) {

        throw new Error(
          data.error ||
          data.message ||
          `Request failed (${response.status})`
        );
      }

      return data;
    }

    /* =====================================================
       SAFE HELPERS
    ===================================================== */

    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function avatarUrl(user) {

      return (
        user?.profilePicture ||
        user?.avatar ||
        user?.profileImage ||
        DEFAULT_AVATAR
      );
    }

    function userName(user) {

      return (
        user?.name ||
        user?.displayName ||
        user?.username ||
        "Pulse User"
      );
    }

    function username(user) {

      return user?.username
        ? `@${user.username}`
        : "";
    }

    function verifiedBadge(user) {

      if (
        user?.verified ||
        user?.isVerified ||
        user?.verificationStatus === "approved"
      ) {
        return `<span class="verified" title="Verified">✓</span>`;
      }

      return "";
    }

    function formatDate(date) {

      if (!date) return "Just now";

      const d = new Date(date);

      if (Number.isNaN(d.getTime())) {
        return "Just now";
      }

      const diff =
        Math.floor(
          (Date.now() - d.getTime()) / 1000
        );

      if (diff < 60) {
        return "Just now";
      }

      if (diff < 3600) {
        return `${Math.floor(diff / 60)}m`;
      }

      if (diff < 86400) {
        return `${Math.floor(diff / 3600)}h`;
      }

      if (diff < 604800) {
        return `${Math.floor(diff / 86400)}d`;
      }

      return d.toLocaleDateString();
    }

    /* =====================================================
       ME
    ===================================================== */

    async function loadMe() {

      try {

        const data = await api("/api/me");

        if (!data.loggedIn || !data.user) {
          location.href = "/login.html";
          return false;
        }

        currentUser = data.user;

        updateUserUI();

        return true;

      } catch (error) {

        console.error(error);

        location.href = "/login.html";

        return false;
      }
    }

    function updateUserUI() {

      if (!currentUser) return;

      const avatar = avatarUrl(currentUser);

      const topProfile =
        document.getElementById("topProfile");

      const sidebarAvatar =
        document.getElementById("sidebarAvatar");

      const composerAvatar =
        document.getElementById("composerAvatar");

      if (topProfile) {
        topProfile.src = avatar;
      }

      if (sidebarAvatar) {
        sidebarAvatar.src = avatar;
      }

      if (composerAvatar) {
        composerAvatar.src = avatar;
      }

      const name =
        document.getElementById("sidebarName");

      const usernameEl =
        document.getElementById("sidebarUsername");

      if (name) {
        name.textContent = userName(currentUser);
      }

      if (usernameEl) {
        usernameEl.textContent =
          username(currentUser);
      }
    }

    /* =====================================================
       NAVIGATION
    ===================================================== */

    function goHome() {

      if (
        location.pathname !== "/feed.html"
      ) {
        location.href = "/feed.html";
        return;
      }

      setFeedMode("for-you");
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function goProfile() {

      if (!currentUser?.username) {
        location.href = "/profile.html";
        return;
      }

      location.href =
        `/profile.html?username=${encodeURIComponent(
          currentUser.username
        )}`;
    }

    function openSearch() {

      const input =
        document.getElementById("searchInput");

      input.focus();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function setFeedMode(mode) {

      currentMode = mode === "following"
        ? "following"
        : "for-you";

      const forYou =
        document.getElementById("forYouTab");

      const following =
        document.getElementById("followingTab");

      forYou.classList.toggle(
        "active",
        currentMode === "for-you"
      );

      following.classList.toggle(
        "active",
        currentMode === "following"
      );

      loadFeed();
    }

    /* =====================================================
       FEED
    ===================================================== */

    async function loadFeed() {

      const feed =
        document.getElementById("feed");

      feed.innerHTML = `
        <div class="loading">
          Loading your feed...
        </div>
      `;

      try {

        let url =
          "/api/feed?limit=50";

        if (currentMode === "following") {
          url += "&following=true";
        }

        const data = await api(url);

        const posts =
          Array.isArray(data)
            ? data
            : (
              data.posts ||
              data.feed ||
              []
            );

        renderFeed(posts);

      } catch (error) {

        console.error(error);

        feed.innerHTML = `
          <div class="empty">
            <div class="empty-icon">⚠️</div>
            <strong>Unable to load feed</strong>
            <p>${escapeHTML(error.message)}</p>

            <br>

            <button
              class="post-btn"
              onclick="loadFeed()"
            >
              Try Again
            </button>
          </div>
        `;
      }
    }

    function renderFeed(posts) {

      const feed =
        document.getElementById("feed");

      if (!posts.length) {

        feed.innerHTML = `
          <div class="empty">
            <div class="empty-icon">🌱</div>
            <strong>
              ${
                currentMode === "following"
                  ? "No posts from people you follow yet."
                  : "Your Pulse feed is empty."
              }
            </strong>

            <p>
              Follow people and create posts to get started.
            </p>
          </div>
        `;

        return;
      }

      feed.innerHTML =
        posts.map(renderPost).join("");
    }

    function renderPost(post) {

      const user =
        post.user ||
        post.author ||
        {};

      const postId =
        post.id ||
        post._id;

      const image =
        post.image ||
        post.imageUrl ||
        post.mediaUrl ||
        "";

      const text =
        post.text ||
        post.content ||
        "";

      const likeCount =
        Number(
          post.likeCount ??
          post.likesCount ??
          post.likes ??
          0
        );

      const commentCount =
        Number(
          post.commentCount ??
          post.commentsCount ??
          post.comments ??
          0
        );

      const liked =
        !!(
          post.liked ||
          post.isLiked ||
          post.userLiked
        );

      const owner =
        !!(
          post.isOwner ||
          post.owner ||
          String(user.id) === String(currentUser?.id)
        );

      const following =
        !!(
          user.isFollowing ||
          user.following
        );

      const safePostId =
        escapeHTML(postId);

      return `
        <article
          class="post"
          id="post-${safePostId}"
        >

          <div class="post-header">

            <img
              class="post-avatar"
              src="${escapeHTML(avatarUrl(user))}"
              alt=""
              onclick="openUserProfile('${escapeHTML(user.username || "")}')"
            >

            <div class="post-user-info">

              <div class="post-user-name">

                <span
                  onclick="openUserProfile('${escapeHTML(user.username || "")}')"
                  style="cursor:pointer;"
                >
                  ${escapeHTML(userName(user))}
                </span>

                ${verifiedBadge(user)}

              </div>

              <div class="post-meta">
                ${escapeHTML(username(user))}
                ·
                ${escapeHTML(
                  formatDate(
                    post.createdAt ||
                    post.created_at ||
                    post.date
                  )
                )}
              </div>

            </div>

            ${
              !owner &&
              user.id
                ? `
                  <button
                    class="follow-small ${
                      following ? "following" : ""
                    }"
                    onclick="toggleFollow(
                      '${escapeHTML(user.id)}',
                      this
                    )"
                  >
                    ${following ? "Following" : "Follow"}
                  </button>
                `
                : ""
            }

            ${
              owner
                ? `
                  <button
                    class="post-menu"
                    onclick="deletePost('${safePostId}')"
                    title="Delete"
                  >
                    ⋯
                  </button>
                `
                : ""
            }

          </div>

          ${
            text
              ? `
                <div class="post-body">
                  ${formatPostText(text)}
                </div>
              `
              : ""
          }

          ${
            image
              ? `
                <img
                  class="post-media"
                  src="${escapeHTML(image)}"
                  alt="Post image"
                  loading="lazy"
                  onclick="openImage('${escapeHTML(image)}')"
                  style="cursor:pointer;"
                >
              `
              : ""
          }

          <div class="post-stats">

            <span>
              ${
                likeCount > 0
                  ? `👍 ${likeCount}`
                  : " "
              }
            </span>

            <span>
              ${
                commentCount > 0
                  ? `${commentCount} comment${commentCount === 1 ? "" : "s"}`
                  : ""
              }
            </span>

          </div>

          <div class="post-actions">

            <button
              class="post-action ${
                liked ? "liked" : ""
              }"
              onclick="toggleLike(
                '${safePostId}',
                this
              )"
            >
              ${liked ? "👍 Liked" : "👍 Like"}
            </button>

            <button
              class="post-action"
              onclick="toggleComments('${safePostId}')"
            >
              💬 Comment
            </button>

            <button
              class="post-action"
              onclick="sharePost('${safePostId}')"
            >
              ↗️ Share
            </button>

          </div>

          <div
            id="comments-${safePostId}"
            class="comments"
          >

            <div
              id="commentList-${safePostId}"
            >
              Loading comments...
            </div>

            <form
              class="comment-form"
              onsubmit="submitComment(event, '${safePostId}')"
            >

              <input
                id="commentInput-${safePostId}"
                placeholder="Write a comment..."
                maxlength="1000"
                autocomplete="off"
              >

              <button type="submit">
                ➤
              </button>

            </form>

          </div>

        </article>
      `;
    }

    function formatPostText(text) {

      let result =
        escapeHTML(text);

      result =
        result.replace(
          /(^|\s)(@[a-zA-Z0-9_]+)/g,
          '$1<span class="mention">$2</span>'
        );

      result =
        result.replace(
          /(^|\s)(#[a-zA-Z0-9_]+)/g,
          '$1<span class="hashtag">$2</span>'
        );

      return result;
    }

    async function loadComments(postId) {

      const list =
        document.getElementById(
          `commentList-${postId}`
        );

      if (!list) return;

      list.innerHTML =
        `<div style="color:#777;font-size:13px;">
          Loading comments...

      try {

        const data =
          await api(
            `/api/posts/${encodeURIComponent(postId)}/comments`
          );

        const comments =
          Array.isArray(data)
            ? data
            : (
              data.comments ||
              []
            );

        if (!comments.length) {

          list.innerHTML =
            `<div style="color:#777;font-size:13px;margin-bottom:10px;">
              No comments yet. Be the first.
            </div>`;

          return;
        }

        list.innerHTML =
          comments
            .map(renderComment)
            .join("");

      } catch (error) {

        console.error(error);

        list.innerHTML =
          `<div style="color:#d00;font-size:13px;">
            Unable to load comments.
          </div>`;
      }
    }

    function openStory(
      index
    ) {

      if (!storiesData[index]) {
        return;
      }

      currentStoryIndex =
        index;

      showCurrentStory();

      document
        .getElementById(
          "storyViewerModal"
        )
        .classList.add("open");
    }

    function showCurrentStory() {

      clearTimeout(
        storyTimer
      );

      const story =
        storiesData[
          currentStoryIndex
        ];

      if (!story) return;

      const user =
        story.user ||
        story.author ||
        {};

      const media =
        story.mediaUrl ||
        story.image ||
        story.video ||
        "";

      const isVideo =
        String(
          story.type ||
          story.mediaType ||
          ""
        ).toLowerCase() === "video" ||
        /\.(mp4|webm|mov)$/i.test(
          media
        );

      document.getElementById(
        "storyViewerAvatar"
      ).src =
        avatarUrl(user);

      document.getElementById(
        "storyViewerName"
      ).textContent =
        userName(user);

      const content =
        document.getElementById(
          "storyViewerContent"
        );

      if (isVideo) {

        content.innerHTML = `
          <video
            src="${escapeHTML(media)}"
            autoplay
            controls
            playsinline
            style="
              width:100%;
              height:100%;
              object-fit:contain;
            "
          ></video>
        `;

      } else if (media) {

        content.innerHTML = `
          <img
            src="${escapeHTML(media)}"
            style="
              width:100%;
              height:100%;
              object-fit:contain;
            "
          >
        `;

      } else {

        content.innerHTML = `
          <div
            style="
              width:100%;
              height:100%;
              display:flex;
              align-items:center;
              justify-content:center;
              color:white;
              padding:35px;
              text-align:center;
              font-size:25px;
              font-weight:800;
            "
          >
            ${escapeHTML(
              story.text ||
              "Pulse Story"
            )}
          </div>
        `;
      }

      const progress =
        document.getElementById(
          "storyProgress"
        );

      progress.style.width = "0%";

      const duration =
        isVideo
          ? 8000
          : 5000;

      const started =
        Date.now();

      function updateProgress() {

        const elapsed =
          Date.now() - started;

        const percentage =
          Math.min(
            100,
            elapsed / duration * 100
          );

        progress.style.width =
          `${percentage}%`;

        if (
          percentage < 100
        ) {

          storyTimer =
            setTimeout(
              updateProgress,
              50
            );

        } else {

          nextStory();
        }
      }

      updateProgress();
    }

    function nextStory() {

      if (
        currentStoryIndex <
        storiesData.length - 1
      ) {

        currentStoryIndex++;

        showCurrentStory();

      } else {

        closeModal(
          "storyViewerModal"
        );
      }
    }

        const data =
          await api(
            `/api/search?q=${encodeURIComponent(query)}`
          );

        const users =
          Array.isArray(data)
            ? data
            : (
              data.users ||
              data.results ||
              []

        if (!users.length) {
          return;

          users[0];

        if (
          first.username

          location.href =
            `/profile.html?username=${encodeURIComponent(
              first.username

        console.error(
          "Search failed:",
          error
        );

    }

            ? data
            : (
              data.notifications ||
              []
            );

        const unread =
          notifications.filter(
            notification =>
              !notification.read &&
              !notification.isRead
          ).length;

        const dot =
          document.getElementById(
            "notificationDot"
          );

        if (unread > 0) {

          dot.textContent =
            unread > 99
              ? "99+"
              : unread;

          dot.classList.remove(
            "hidden"
          );

        } else {

          dot.classList.add(
            "hidden"
          );
        }

      } catch (error) {

        console.warn(
          "Notification count unavailable"
        );
      }
    }

        "fullImage"
      ).src = src;

      document
        .getElementById(
          "imageModal"
        )
        .classList.add("open");
    }

    /* =====================================================
       MODALS
    ===================================================== */

    function closeModal(
      id
    ) {

      const modal =
        document.getElementById(id);

      if (modal) {
        modal.classList.remove(
          "open"
        );
      }

      if (
        id === "storyViewerModal"
      ) {

        clearTimeout(
          storyTimer
        );
      }
    }

    document
      .querySelectorAll(".modal")
      .forEach(
        modal => {

          modal.addEventListener(
            "click",
            event => {

              if (
                event.target === modal
              ) {

                modal.classList.remove(
                  "open"
                );

                if (
                  modal.id ===
                  "storyViewerModal"
                ) {

                  clearTimeout(
                    storyTimer
                  );
                }

                if (
                  modal.id ===
                  "reelViewerModal"
                ) {

                  closeReelViewer();
                }
              }
            }
          );
        }
      );

    /* =====================================================
       LOGOUT
    ===================================================== */

    async function logout() {

      try {

        await api(
          "/api/logout",
          {
            method: "POST"
          }
        );

      } catch (error) {

        console.error(
          "Logout error:",
          error
        );

      } finally {

        location.href =
          "/login.html";
      }
    }

    /* =====================================================
       INIT
    ===================================================== */

    async function init() {

      const loggedIn =
        await loadMe();

      if (!loggedIn) {
        return;
      }

      await Promise.all([
        loadFeed(),
        loadStories(),
        loadReels(),
        loadSuggestions(),
        loadNotificationCount()
      ]);

      const hash =
        location.hash;

      if (
        hash.startsWith("#post-")
      ) {

        setTimeout(
          () => {

            const element =
              document.querySelector(
                hash
              );

            if (element) {

              element.scrollIntoView({
                behavior: "smooth",
                block: "center"
              });
            }

          },
          500
        );
      }
    }

    init();

  </script>

</body>
</html>
