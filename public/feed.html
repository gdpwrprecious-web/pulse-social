<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pulse Social - Feed</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue: #1877f2;
      --blue-dark: #166fe5;
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #050505;
      --muted: #65676b;
      --border: #dddfe2;
      --hover: #f2f2f2;
      --green: #42b72a;
      --shadow: 0 1px 2px rgba(0,0,0,.2);
    }

    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* HEADER */

    .topbar {
      height: 64px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      padding: 0 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
    }

    .topbar-inner {
      width: 100%;
      max-width: 1400px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 42px;
      height: 42px;
      background: var(--blue);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: 900;
    }

    .brand {
      color: var(--blue);
      font-size: 24px;
      font-weight: 800;
      white-space: nowrap;
    }

    .search {
      width: 250px;
      height: 42px;
      background: #f0f2f5;
      border: none;
      border-radius: 22px;
      padding: 0 18px;
      outline: none;
      font-size: 15px;
    }

    .top-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: #e4e6eb;
      font-size: 20px;
    }

    .top-btn:hover {
      background: #d8dadf;
    }

    .avatar-small {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #ddd;
    }

    /* LAYOUT */

    .page {
      width: 100%;
      max-width: 1400px;
      margin: auto;
      display: grid;
      grid-template-columns: 270px minmax(400px, 680px) 300px;
      gap: 22px;
      padding: 22px 18px;
    }

    /* SIDEBAR */

    .sidebar {
      position: sticky;
      top: 84px;
      height: calc(100vh - 100px);
      overflow-y: auto;
    }

    .side-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .side-profile:hover {
      background: #e4e6eb;
    }

    .side-profile img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
    }

    .side-name {
      font-weight: 700;
    }

    .side-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px;
      border: none;
      background: transparent;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
    }

    .side-item:hover {
      background: #e4e6eb;
    }

    .side-icon {
      width: 32px;
      text-align: center;
      font-size: 22px;
    }

    .sidebar-divider {
      height: 1px;
      background: var(--border);
      margin: 14px 0;
    }

    .sidebar-title {
      padding: 5px 10px 10px;
      color: var(--muted);
      font-weight: 700;
      font-size: 16px;
    }

    /* CENTER */

    .center {
      min-width: 0;
    }

    /* STORIES */

    .stories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 18px;
      scrollbar-width: none;
    }

    .stories::-webkit-scrollbar {
      display: none;
    }

    .story {
      flex: 0 0 110px;
      height: 190px;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      box-shadow: var(--shadow);
      border: 1px solid #ddd;
    }

    .story img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .story-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          transparent 45%,
          rgba(0,0,0,.7)
        );
    }

    .story-avatar {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 3px solid var(--blue);
      object-fit: cover;
    }

    .story-name {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 7px;
      color: white;
      font-size: 13px;
      font-weight: 700;
    }

    .create-story {
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    .create-story .story-main {
      height: 130px;
      background: #e4e6eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: var(--blue);
    }

    .create-story span {
      padding: 12px;
      text-align: center;
      font-weight: 700;
    }

    /* CREATE POST */

    .card {
      background: var(--card);
      border-radius: 10px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
      overflow: hidden;
    }

    .create-post {
      padding: 14px 16px 10px;
    }

    .create-top {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .create-top img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
    }

    .fake-input {
      flex: 1;
      background: #f0f2f5;
      border: none;
      border-radius: 22px;
      height: 42px;
      padding: 11px 17px;
      color: #65676b;
      cursor: pointer;
    }

    .fake-input:hover {
      background: #e4e6eb;
    }

    .create-actions {
      border-top: 1px solid var(--border);
      margin-top: 12px;
      padding-top: 8px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }

    .create-action {
      border: none;
      background: transparent;
      border-radius: 8px;
      padding: 10px 5px;
      color: var(--muted);
      font-weight: 700;
    }

    .create-action:hover {
      background: var(--hover);
    }

    .live {
      color: #f02849;
    }

    .photo {
      color: #45bd62;
    }

    .feeling {
      color: #f7b928;
    }

    /* POST */

    .post-header {
      padding: 14px 16px 5px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .post-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .post-author {
      font-weight: 700;
      font-size: 15px;
    }

    .verified {
      color: var(--blue);
      font-size: 14px;
    }

    .post-time {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .post-menu {
      margin-left: auto;
      border: none;
      background: transparent;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      font-size: 20px;
    }

    .post-menu:hover {
      background: var(--hover);
    }

    .post-text {
      padding: 8px 16px 12px;
      font-size: 15px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .post-media {
      width: 100%;
      max-height: 700px;
      display: block;
      object-fit: cover;
      background: #000;
    }

    .post-video {
      width: 100%;
      max-height: 700px;
      background: #000;
      display: block;
    }

    .post-stats {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 16px;
      color: var(--muted);
      font-size: 13px;
    }

    .stats-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .like-circle {
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: var(--blue);
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .post-buttons {
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 3px 8px;
    }

    .post-btn {
      border: none;
      background: transparent;
      padding: 9px 4px;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
    }

    .post-btn:hover {
      background: var(--hover);
    }

    .post-btn.liked {
      color: var(--blue);
    }

    /* COMMENTS */

    .comments-area {
      display: none;
      border-top: 1px solid var(--border);
      padding: 10px 15px;
    }

    .comments-area.open {
      display: block;
    }

    .comment {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .comment img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    .comment-bubble {
      background: #f0f2f5;
      border-radius: 15px;
      padding: 7px 11px;
      font-size: 13px;
    }

    .comment-name {
      font-weight: 700;
      margin-bottom: 2px;
    }

    .comment-form {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .comment-form input {
      flex: 1;
      border: none;
      outline: none;
      background: #f0f2f5;
      border-radius: 20px;
      padding: 9px 13px;
    }

    .comment-form button {
      border: none;
      background: var(--blue);
      color: white;
      border-radius: 50%;
      width: 38px;
      height: 38px;
    }

    /* RIGHT */

    .rightbar {
      position: sticky;
      top: 84px;
      height: calc(100vh - 100px);
    }

    .right-title {
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .contact {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 8px;
    }

    .contact:hover {
      background: #e4e6eb;
    }

    .contact img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
    }

    .online {
      width: 10px;
      height: 10px;
      background: #31a24c;
      border-radius: 50%;
      margin-left: -19px;
      margin-top: 27px;
      border: 2px solid white;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 3000;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: min(520px, 100%);
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
      overflow: hidden;
    }

    .modal-header {
      padding: 15px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h2 {
      font-size: 20px;
    }

    .close {
      width: 35px;
      height: 35px;
      border: none;
      border-radius: 50%;
      background: #e4e6eb;
      font-size: 20px;
    }

    .modal-body {
      padding: 16px;
    }

    .modal-user {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .modal-user img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
    }

    .modal textarea {
      width: 100%;
      min-height: 140px;
      border: none;
      outline: none;
      resize: vertical;
      font-size: 20px;
    }

    .upload-box {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      margin-top: 10px;
    }

    .upload-box input {
      width: 100%;
    }

    .publish {
      width: 100%;
      border: none;
      background: var(--blue);
      color: white;
      padding: 12px;
      border-radius: 7px;
      margin-top: 14px;
      font-size: 16px;
      font-weight: 700;
    }

    .publish:hover {
      background: var(--blue-dark);
    }

    /* MOBILE */

    .mobile-nav {
      display: none;
    }

    @media (max-width: 1100px) {
      .page {
        grid-template-columns: 220px minmax(400px, 680px);
      }

      .rightbar {
        display: none;
      }
    }

    @media (max-width: 760px) {
      .topbar {
        height: 58px;
        padding: 0 10px;
      }

      .brand {
        font-size: 20px;
      }

      .search {
        flex: 1;
        min-width: 0;
        width: auto;
      }

      .top-actions .top-btn {
        display: none;
      }

      .page {
        display: block;
        padding: 10px 0 75px;
      }

      .sidebar {
        display: none;
      }

      .center {
        width: 100%;
      }

      .card {
        border-radius: 0;
        box-shadow: none;
        border-top: 1px solid #ddd;
        border-bottom: 1px solid #ddd;
      }

      .stories {
        padding: 0 10px 8px;
      }

      .story {
        flex-basis: 105px;
        height: 175px;
      }

      .mobile-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 62px;
        background: white;
        border-top: 1px solid var(--border);
        z-index: 2000;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
      }

      .mobile-nav button {
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }

      .mobile-nav button span {
        display: block;
        font-size: 21px;
        margin-bottom: 2px;
      }

      .mobile-nav .active {
        color: var(--blue);
      }
    }

    @media (max-width: 450px) {
      .logo {
        width: 38px;
        height: 38px;
      }

      .brand {
        display: none;
      }

      .search {
        font-size: 13px;
      }

      .create-actions {
        font-size: 12px;
      }

      .post-media,
      .post-video {
        max-height: 550px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="topbar-inner">

      <a href="/feed.html" class="logo">P</a>

      <a href="/feed.html" class="brand">
        Pulse
      </a>

      <input
        id="searchInput"
        class="search"
        type="search"
        placeholder="Search Pulse"
      >

      <div class="top-actions">

        <button
          class="top-btn"
          onclick="location.href='/messages.html'"
          title="Messages"
        >
          💬
        </button>

        <button
          class="top-btn"
          onclick="location.href='/notifications.html'"
          title="Notifications"
        >
          🔔
        </button>

        <img
          id="topAvatar"
          class="avatar-small"
          src="/images/default-avatar.png"
          onclick="openMyProfile()"
          alt=""
        >

      </div>
    </div>
  </header>

  <main class="page">

    <!-- LEFT SIDEBAR -->

    <aside class="sidebar">

      <a
        id="myProfileLink"
        class="side-profile"
        href="#"
      >
        <img
          id="sideAvatar"
          src="/images/default-avatar.png"
          alt=""
        >

        <span
          id="sideName"
          class="side-name"
        >
          Loading...
        </span>
      </a>

      <button
        class="side-item"
        onclick="openMyProfile()"
      >
        <span class="side-icon">👤</span>
        Profile
      </button>

      <button
        class="side-item"
        onclick="location.href='/messages.html'"
      >
        <span class="side-icon">💬</span>
        Messages
      </button>

      <button
        class="side-item"
        onclick="location.href='/notifications.html'"
      >
        <span class="side-icon">🔔</span>
        Notifications
      </button>

      <button
        class="side-item"
        onclick="location.href='/profile.html'"
      >
        <span class="side-icon">👥</span>
        Friends
      </button>

      <div class="sidebar-divider"></div>

      <div class="sidebar-title">
        Your shortcuts
      </div>

      <button class="side-item">
        <span class="side-icon">📰</span>
        News Feed
      </button>

      <button class="side-item">
        <span class="side-icon">🎥</span>
        Videos
      </button>

      <button class="side-item">
        <span class="side-icon">🏪</span>
        Marketplace
      </button>

      <button class="side-item">
        <span class="side-icon">🎮</span>
        Gaming
      </button>

    </aside>

    <!-- CENTER -->

    <section class="center">

      <!-- STORIES -->

      <div id="stories" class="stories">

        <div
          class="story create-story"
          onclick="openPostModal()"
        >
          <div class="story-main">
            +
          </div>

          <span>
            Create story
          </span>
        </div>

      </div>

      <!-- CREATE POST -->

      <div class="card create-post">

        <div class="create-top">

          <img
            id="createAvatar"
            src="/images/default-avatar.png"
            alt=""
          >

          <div
            class="fake-input"
            onclick="openPostModal()"
          >
            What's on your mind?
          </div>

        </div>

        <div class="create-actions">

          <button
            class="create-action live"
            onclick="openPostModal()"
          >
            🔴 Live Video
          </button>

          <button
            class="create-action photo"
            onclick="openPostModal()"
          >
            🖼️ Photo/Video
          </button>

          <button
            class="create-action feeling"
            onclick="openPostModal()"
          >
            😊 Feeling
          </button>

        </div>
      </div>

      <!-- FEED -->

      <div id="feed"></div>

    </section>

    <!-- RIGHT SIDEBAR -->

    <aside class="rightbar">

      <div class="right-title">
        Contacts
      </div>

      <div id="contacts"></div>

    </aside>

  </main>

  <!-- MOBILE NAV -->

  <nav class="mobile-nav">

    <button class="active">
      <span>🏠</span>
      Home
    </button>

    <button
      onclick="location.href='/profile.html'"
    >
      <span>👥</span>
      Friends
    </button>

    <button onclick="openPostModal()">
      <span>➕</span>
      Create
    </button>

    <button
      onclick="location.href='/messages.html'"
    >
      <span>💬</span>
      Inbox
    </button>

    <button onclick="openMyProfile()">
      <span>👤</span>
      Profile
    </button>

  </nav>

  <!-- CREATE POST MODAL -->

  <div
    id="postModal"
    class="modal"
  >

    <div class="modal-box">

      <div class="modal-header">

        <h2>
          Create post
        </h2>

        <button
          class="close"
          onclick="closePostModal()"
        >
          ×
        </button>

      </div>

      <div class="modal-body">

        <div class="modal-user">

          <img
            id="modalAvatar"
            src="/images/default-avatar.png"
            alt=""
          >

          <strong id="modalName">
            You
          </strong>

        </div>

        <textarea
          id="postText"
          placeholder="What's on your mind?"
        ></textarea>

        <div class="upload-box">

          <strong>
            Add photo or video
          </strong>

          <br><br>

          <input
            id="postMedia"
            type="file"
            accept="image/*,video/*"
          >

        </div>

        <button
          class="publish"
          onclick="publishPost()"
        >
          Post
        </button>

      </div>

    </div>

  </div>

  <script>
    let currentUser = null;

    async function api(url, options = {}) {
      const response = await fetch(
        url,
        {
          credentials: "include",
          ...options
        }
      );

      const data =
        await response.json()
          .catch(() => ({}));

      if (!response.ok) {
        throw new Error(
          data.message ||
          "Request failed."
        );
      }

      return data;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function avatar(user) {
      return (
        user?.profilePicture ||
        user?.profileImage ||
        user?.avatar ||
        "/images/default-avatar.png"
      );
    }

    function verified(user) {
      return user?.verified ||
        user?.isVerified
        ? '<span class="verified">✔</span>'
        : "";
    }

    function timeAgo(date) {
      const seconds =
        Math.floor(
          (Date.now() -
            new Date(date).getTime()) /
          1000
        );

      if (seconds < 60)
        return "Just now";

      const minutes =
        Math.floor(seconds / 60);

      if (minutes < 60)
        return `${minutes}m`;

      const hours =
        Math.floor(minutes / 60);

      if (hours < 24)
        return `${hours}h`;

      const days =
        Math.floor(hours / 24);

      if (days < 7)
        return `${days}d`;

      return new Date(date)
        .toLocaleDateString();
    }

    function openMyProfile() {
      if (!currentUser) return;

      location.href =
        `/profile.html?username=${encodeURIComponent(
          currentUser.username
        )}`;
    }

    function openPostModal() {
      document
        .getElementById("postModal")
        .classList.add("show");
    }

    function closePostModal() {
      document
        .getElementById("postModal")
        .classList.remove("show");

      document
        .getElementById("postText")
        .value = "";

      document
        .getElementById("postMedia")
        .value = "";
    }

    async function loadMe() {
      const data =
        await api("/api/me");

      if (!data.authenticated) {
        location.href =
          "/login.html";

        return;
      }

      currentUser =
        data.user;

      const image =
        avatar(currentUser);

      document
        .getElementById("topAvatar")
        .src = image;

      document
        .getElementById("sideAvatar")
        .src = image;

      document
        .getElementById("createAvatar")
        .src = image;

      document
        .getElementById("modalAvatar")
        .src = image;

      document
        .getElementById("sideName")
        .textContent =
        currentUser.name ||
        currentUser.username;

      document
        .getElementById("modalName")
        .textContent =
        currentUser.name ||
        currentUser.username;

      document
        .getElementById("myProfileLink")
        .href =
        `/profile.html?username=${encodeURIComponent(
          currentUser.username
        )}`;
    }

    function renderPost(post) {
      const author =
        post.author ||
        post.user ||
        {};

      const content =
        post.content ||
        post.caption ||
        "";

      let media = "";

      if (post.video || post.videoUrl) {
        media = `
          <video
            class="post-video"
            src="${escapeHtml(
              post.video ||
              post.videoUrl
            )}"
            controls
            preload="metadata"
          ></video>
        `;
      } else if (
        post.image ||
        post.imageUrl
      ) {
        media = `
          <img
            class="post-media"
            src="${escapeHtml(
              post.image ||
              post.imageUrl
            )}"
            alt="Post"
            loading="lazy"
          >
        `;
      }

      return `
        <article
          class="card post"
          data-post-id="${escapeHtml(
            post.id
          )}"
        >

          <div class="post-header">

            <a
              href="/profile.html?username=${encodeURIComponent(
                author.username || ""
              )}"
            >
              <img
                class="post-avatar"
                src="${escapeHtml(
                  avatar(author)
                )}"
                alt=""
              >
            </a>

            <div>

              <a
                class="post-author"
                href="/profile.html?username=${encodeURIComponent(
                  author.username || ""
                )}"
              >
                ${escapeHtml(
                  author.name ||
                  author.username ||
                  "User"
                )}

                ${verified(author)}
              </a>

              <div class="post-time">
                ${timeAgo(
                  post.createdAt
                )} · 🌎
              </div>

            </div>

            <button
              class="post-menu"
              onclick="postMenu('${post.id}')"
            >
              •••
            </button>

          </div>

          ${
            content
              ? `
                <div class="post-text">
                  ${escapeHtml(
                    content
                  )}
                </div>
              `
              : ""
          }

          ${media}

          <div class="post-stats">

            <div class="stats-left">
              <span class="like-circle">
                👍
              </span>

              <span class="like-count">
                ${post.likesCount || 0}
              </span>
            </div>

            <div>
              <span>
                ${post.commentsCount || 0}
                comments
              </span>

              <span>
                ·
              </span>

              <span>
                0 shares
              </span>
            </div>

          </div>

          <div class="post-buttons">

            <button
              class="post-btn ${
                post.liked
                  ? "liked"
                  : ""
              }"
              onclick="toggleLike(
                '${post.id}',
                this
              )"
            >
              👍 Like
            </button>

            <button
              class="post-btn"
              onclick="toggleComments(
                '${post.id}'
              )"
            >
              💬 Comment
            </button>

            <button
              class="post-btn"
              onclick="sharePost(
                '${post.id}'
              )"
            >
              ↗ Share
            </button>

          </div>

          <div
            id="comments-${post.id}"
            class="comments-area"
          >
            Loading comments...
          </div>

        </article>
      `;
    }

    async function loadFeed() {
      const feed =
        document.getElementById(
          "feed"
        );

      feed.innerHTML = `
        <div class="card" style="padding:25px;text-align:center">
          Loading your feed...
        </div>
      `;

      try {
        const data =
          await api(
            "/api/feed?mode=all"
          );

        if (!data.posts?.length) {
          feed.innerHTML = `
            <div class="card" style="padding:35px;text-align:center">
              <h3>Your feed is empty</h3>
              <p style="margin-top:8px;color:#65676b">
                Create your first post or follow people to see their posts here.
              </p>
            </div>
          `;

          return;
        }

        feed.innerHTML =
          data.posts
            .map(renderPost)
            .join("");
      } catch (error) {
        feed.innerHTML = `
          <div class="card" style="padding:25px;color:#d00">
            ${escapeHtml(
              error.message
            )}
          </div>
        `;
      }
    }

    async function toggleLike(
      postId,
      button
    ) {
      try {
        const data =
          await api(
            `/api/posts/${postId}/like`,
            {
              method: "POST"
            }
          );

        button.classList.toggle(
          "liked",
          data.liked
        );

        const post =
          button.closest(".post");

        const count =
          post.querySelector(
            ".like-count"
          );

        count.textContent =
          data.likesCount || 0;
      } catch (error) {
        alert(error.message);
      }
    }

    async function toggleComments(
      postId
    ) {
      const box =
        document.getElementById(
          `comments-${postId}`
        );

      if (
        box.classList.contains("open")
      ) {
        box.classList.remove(
          "open"
        );

        return;
      }

      box.classList.add("open");

      try {
        const data =
          await api(
            `/api/posts/${postId}/comments`
          );

        box.innerHTML = `
          ${
            data.comments?.length
              ? data.comments
                  .map(
                    (comment) => `
                      <div class="comment">

                        <img
                          src="${escapeHtml(
                            avatar(
                              comment.user
                            )
                          )}"
                          alt=""
                        >

                        <div class="comment-bubble">

                          <div class="comment-name">
                            ${escapeHtml(
                              comment.user?.name ||
                              comment.user?.username ||
                              "User"
                            )}
                          </div>

                          ${escapeHtml(
                            comment.text ||
                            comment.content ||
                            ""
                          )}

                        </div>

                      </div>
                    `
                  )
                  .join("")
              : `
                <div style="color:#65676b">
                  No comments yet.
                </div>
              `
          }

          <form
            class="comment-form"
            onsubmit="submitComment(event,'${postId}')"
          >
            <input
              id="comment-input-${postId}"
              placeholder="Write a comment..."
              autocomplete="off"
            >

            <button>
              ➤
            </button>
          </form>
        `;
      } catch (error) {
        box.innerHTML =
          "Unable to load comments.";
      }
    }

    async function submitComment(
      event,
      postId
    ) {
      event.preventDefault();

      const input =
        document.getElementById(
          `comment-input-${postId}`
        );

      const text =
        input.value.trim();

      if (!text) return;

      try {
        await api(
          `/api/posts/${postId}/comments`,
          {
            method: "POST",
            headers: {
              "Content-Type":
                "application/json"
            },
            body: JSON.stringify({
              text
            })
          }
        );

        await toggleComments(
          postId
        );

        await toggleComments(
          postId
        );
      } catch (error) {
        alert(error.message);
      }
    }

    async function sharePost(
      postId
    ) {
      const url =
        `${location.origin}/feed.html?post=${encodeURIComponent(
          postId
        )}`;

      if (
        navigator.share
      ) {
        await navigator.share({
          title:
            "Pulse Social",
          url
        }).catch(() => {});
      } else {
        await navigator.clipboard.writeText(
          url
        );

        alert(
          "Post link copied."
        );
      }
    }

    function postMenu(postId) {
      const choice =
        confirm(
          "Delete this post?"
        );

      if (!choice) return;

      deletePost(postId);
    }

    async function deletePost(
      postId
    ) {
      try {
        await api(
          `/api/posts/${postId}`,
          {
            method: "DELETE"
          }
        );

        await loadFeed();
      } catch (error) {
        alert(error.message);
      }
    }

    async function publishPost() {
      const text =
        document
          .getElementById(
            "postText"
          )
          .value.trim();

      const media =
        document
          .getElementById(
            "postMedia"
          ).files[0];

      if (!text && !media) {
        alert(
          "Write something or select a photo/video."
        );

        return;
      }

      const form =
        new FormData();

      form.append(
        "content",
        text
      );

      if (media) {
        if (
          media.type.startsWith(
            "video/"
          )
        ) {
          form.append(
            "video",
            media
          );
        } else {
          form.append(
            "image",
            media
          );
        }
      }

      try {
        const button =
          document.querySelector(
            ".publish"
          );

        button.disabled =
          true;

        button.textContent =
          "Posting...";

        await api(
          "/api/posts",
          {
            method: "POST",
            body: form
          }
        );

        button.disabled =
          false;

        button.textContent =
          "Post";

        closePostModal();

        await loadFeed();
      } catch (error) {
        alert(
          error.message
        );

        const button =
          document.querySelector(
            ".publish"
          );

        button.disabled =
          false;

        button.textContent =
          "Post";
      }
    }

    async function loadContacts() {
      try {
        const data =
          await api(
            "/api/search?q=a"
          );

        const contacts =
          document.getElementById(
            "contacts"
          );

        const list =
          (data.users || [])
            .filter(
              (u) =>
                String(u.id) !==
                String(
                  currentUser?.id
                )
            )
            .slice(0, 8);

        contacts.innerHTML =
          list.length
            ? list
                .map(
                  (user) => `
                    <a
                      class="contact"
                      href="/profile.html?username=${encodeURIComponent(
                        user.username
                      )}"
                    >

                      <img
                        src="${escapeHtml(
                          avatar(user)
                        )}"
                        alt=""
                      >

                      <strong>
                        ${escapeHtml(
                          user.name ||
                          user.username
                        )}
                      </strong>

                      <span class="online"></span>

                    </a>
                  `
                )
                .join("")
            : `
              <div style="color:#65676b;padding:10px">
                No contacts yet.
              </div>
            `;
      } catch {}
    }

    function renderStories() {
      const container =
        document.getElementById(
          "stories"
        );

      const image =
        avatar(
          currentUser
        );

      container.innerHTML = `
        <div
          class="story create-story"
          onclick="openPostModal()"
        >
          <div class="story-main">
            +
          </div>

          <span>
            Create story
          </span>
        </div>

        <div class="story">
          <img
            src="${escapeHtml(image)}"
            alt=""
          >

          <div class="story-overlay"></div>

          <img
            class="story-avatar"
            src="${escapeHtml(image)}"
            alt=""
          >

          <div class="story-name">
            Your story
          </div>
        </div>
      `;
    }

    document
      .getElementById(
        "searchInput"
      )
      .addEventListener(
        "keydown",
        function (event) {
          if (
            event.key === "Enter"
          ) {
            const q =
              this.value.trim();

            if (!q) return;

            location.href =
              `/profile.html?search=${encodeURIComponent(
                q
              )}`;
          }
        }
      );

    document
      .getElementById(
        "postModal"
      )
      .addEventListener(
        "click",
        function (event) {
          if (
            event.target === this
          ) {
            closePostModal();
          }
        }
      );

    async function init() {
      try {
        await loadMe();

        renderStories();

        await loadFeed();

        await loadContacts();
      } catch (error) {
        console.error(
          error
        );
      }
    }

    init();
  </script>

</body>
</html>
