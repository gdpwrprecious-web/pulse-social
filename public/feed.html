<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Feed | Pulse Social</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue: #1877f2;
      --blue-dark: #166fe5;
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #050505;
      --muted: #65676b;
      --border: #dddfe2;
      --hover: #f2f2f2;
      --danger: #e41e3f;
      --green: #42b72a;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       HEADER
    ========================= */

    .topbar {
      height: 64px;
      background: #fff;
      border-bottom: 1px solid var(--border);

      display: flex;
      align-items: center;

      padding: 0 18px;

      position: sticky;
      top: 0;
      z-index: 1000;

      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    .topbar-inner {
      width: 100%;
      max-width: 1400px;
      margin: auto;

      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;

      text-decoration: none;
      color: var(--blue);

      font-size: 28px;
      font-weight: 800;
    }

    .logo-icon {
      width: 40px;
      height: 40px;

      border-radius: 50%;

      background: var(--blue);
      color: white;

      display: grid;
      place-items: center;

      font-size: 24px;
      font-weight: 800;
    }

    .search-box {
      position: relative;
      width: 260px;
    }

    .search-box input {
      width: 100%;
      height: 42px;

      border: none;
      outline: none;

      background: #f0f2f5;

      border-radius: 22px;

      padding: 0 16px 0 42px;

      font-size: 15px;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 11px;

      color: var(--muted);
    }

    .nav-spacer {
      flex: 1;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;

      border: none;
      border-radius: 50%;

      background: #e4e6eb;

      font-size: 20px;

      display: grid;
      place-items: center;

      transition: .2s;
    }

    .icon-btn:hover {
      background: #d8dadf;
    }

    .profile-mini {
      display: flex;
      align-items: center;
      gap: 8px;

      padding: 4px 8px 4px 4px;

      border-radius: 22px;

      text-decoration: none;
      color: #111;

      font-weight: 600;
    }

    .profile-mini:hover {
      background: var(--hover);
    }

    .avatar-small {
      width: 36px;
      height: 36px;

      border-radius: 50%;

      object-fit: cover;

      background: #ddd;
    }

    /* =========================
       LAYOUT
    ========================= */

    .page {
      max-width: 1400px;
      margin: auto;

      display: grid;
      grid-template-columns: 280px minmax(0, 680px) 300px;

      gap: 24px;

      padding: 22px 18px 50px;
    }

    /* =========================
       LEFT SIDEBAR
    ========================= */

    .sidebar {
      position: sticky;
      top: 85px;
      height: max-content;
    }

    .sidebar-card {
      background: transparent;
    }

    .side-link {
      display: flex;
      align-items: center;
      gap: 14px;

      padding: 10px;

      border-radius: 10px;

      text-decoration: none;
      color: #111;

      font-weight: 600;

      transition: .2s;
    }

    .side-link:hover {
      background: #e4e6eb;
    }

    .side-icon {
      width: 40px;
      height: 40px;

      border-radius: 50%;

      display: grid;
      place-items: center;

      font-size: 20px;

      background: white;
    }

    .side-divider {
      height: 1px;
      background: var(--border);
      margin: 12px 0;
    }

    .sidebar-title {
      color: var(--muted);
      font-size: 17px;
      margin: 10px;
    }

    /* =========================
       STORIES
    ========================= */

    .stories {
      display: flex;
      gap: 10px;

      overflow-x: auto;

      padding-bottom: 4px;
      margin-bottom: 18px;

      scrollbar-width: none;
    }

    .stories::-webkit-scrollbar {
      display: none;
    }

    .story {
      min-width: 120px;
      height: 190px;

      border-radius: 12px;

      overflow: hidden;

      position: relative;

      background: #222;

      box-shadow: 0 1px 3px rgba(0,0,0,.15);

      cursor: pointer;
    }

    .story img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .story::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          transparent 45%,
          rgba(0,0,0,.7)
        );
    }

    .story-avatar {
      position: absolute;

      top: 10px;
      left: 10px;

      width: 38px;
      height: 38px;

      border-radius: 50%;

      border: 3px solid var(--blue);

      object-fit: cover;

      z-index: 2;
    }

    .story-name {
      position: absolute;

      bottom: 10px;
      left: 10px;
      right: 8px;

      color: white;

      font-weight: 700;
      font-size: 13px;

      z-index: 2;
    }

    .create-story {
      background: white;
    }

    .create-story img {
      height: 130px;
    }

    .story-plus {
      position: absolute;

      bottom: 42px;
      left: 50%;

      transform: translateX(-50%);

      width: 38px;
      height: 38px;

      border-radius: 50%;

      background: var(--blue);
      color: white;

      display: grid;
      place-items: center;

      border: 4px solid white;

      font-size: 24px;

      z-index: 4;
    }

    .create-story .story-name {
      color: #111;
      text-align: center;
      bottom: 9px;
    }

    /* =========================
       COMPOSER
    ========================= */

    .card {
      background: var(--card);

      border-radius: 10px;

      box-shadow:
        0 1px 2px rgba(0,0,0,.12);

      margin-bottom: 16px;
    }

    .composer {
      padding: 14px 16px;
    }

    .composer-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .composer-avatar {
      width: 42px;
      height: 42px;

      border-radius: 50%;

      object-fit: cover;

      background: #ddd;
    }

    .composer-input {
      flex: 1;

      height: 42px;

      border: none;
      outline: none;

      background: #f0f2f5;

      border-radius: 22px;

      padding: 0 16px;

      cursor: pointer;
    }

    .composer-input:hover {
      background: #e4e6eb;
    }

    .composer-divider {
      height: 1px;
      background: var(--border);

      margin: 14px 0 8px;
    }

    .composer-actions {
      display: flex;
      justify-content: space-around;
    }

    .composer-action {
      flex: 1;

      border: none;
      background: transparent;

      padding: 10px;

      border-radius: 8px;

      font-weight: 600;

      color: var(--muted);
    }

    .composer-action:hover {
      background: var(--hover);
    }

    .photo-text {
      color: #45bd62;
    }

    .feeling-text {
      color: #f7b928;
    }

    /* =========================
       CREATE POST MODAL
    ========================= */

    .modal {
      position: fixed;
      inset: 0;

      background: rgba(0,0,0,.55);

      display: none;
      align-items: center;
      justify-content: center;

      z-index: 3000;

      padding: 16px;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 500px;

      background: white;

      border-radius: 12px;

      box-shadow: 0 10px 40px rgba(0,0,0,.3);

      overflow: hidden;
    }

    .modal-header {
      height: 58px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-bottom: 1px solid var(--border);

      position: relative;

      font-size: 18px;
      font-weight: 700;
    }

    .close-modal {
      position: absolute;
      right: 12px;

      width: 36px;
      height: 36px;

      border: none;
      border-radius: 50%;

      background: #e4e6eb;

      font-size: 22px;
    }

    .modal-body {
      padding: 16px;
    }

    .modal-user {
      display: flex;
      align-items: center;
      gap: 10px;

      margin-bottom: 12px;
    }

    .modal-user img {
      width: 42px;
      height: 42px;

      border-radius: 50%;
      object-fit: cover;
    }

    .modal-user-name {
      font-weight: 700;
    }

    .post-textarea {
      width: 100%;

      min-height: 130px;

      border: none;
      outline: none;

      resize: vertical;

      font-size: 20px;
    }

    .image-preview {
      display: none;

      position: relative;

      margin-top: 10px;
    }

    .image-preview img {
      width: 100%;
      max-height: 320px;

      object-fit: cover;

      border-radius: 8px;
    }

    .remove-preview {
      position: absolute;

      top: 8px;
      right: 8px;

      width: 34px;
      height: 34px;

      border: none;
      border-radius: 50%;

      background: rgba(0,0,0,.65);

      color: white;
    }

    .modal-bottom {
      border: 1px solid var(--border);

      border-radius: 8px;

      padding: 10px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-top: 12px;
    }

    .modal-bottom label {
      cursor: pointer;
      font-weight: 600;
    }

    .publish-btn {
      width: 100%;

      border: none;

      background: var(--blue);

      color: white;

      padding: 12px;

      border-radius: 8px;

      margin-top: 14px;

      font-weight: 700;

      font-size: 16px;
    }

    .publish-btn:hover {
      background: var(--blue-dark);
    }

    .publish-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* =========================
       POST
    ========================= */

    .post {
      padding: 0;

      overflow: hidden;
    }

    .post-header {
      display: flex;
      align-items: center;

      padding: 14px 16px 8px;

      gap: 10px;
    }

    .post-avatar {
      width: 42px;
      height: 42px;

      border-radius: 50%;

      object-fit: cover;

      flex-shrink: 0;
    }

    .post-user {
      flex: 1;
      min-width: 0;
    }

    .post-user-line {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .post-user-name {
      font-weight: 700;

      text-decoration: none;
      color: #111;
    }

    .verified {
      display: inline-grid;
      place-items: center;

      width: 18px;
      height: 18px;

      border-radius: 50%;

      background: var(--blue);

      color: white;

      font-size: 11px;
      font-weight: 800;
    }

    .post-time {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }

    .post-menu {
      width: 38px;
      height: 38px;

      border: none;

      border-radius: 50%;

      background: transparent;

      font-size: 20px;
    }

    .post-menu:hover {
      background: var(--hover);
    }

    .post-content {
      padding: 4px 16px 12px;

      line-height: 1.45;

      white-space: pre-wrap;

      word-break: break-word;
    }

    .post-image {
      width: 100%;

      max-height: 650px;

      display: block;

      object-fit: cover;

      background: #eee;
    }

    .post-stats {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 8px 16px;

      color: var(--muted);

      font-size: 14px;
    }

    .reaction-count {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .like-circle {
      width: 20px;
      height: 20px;

      border-radius: 50%;

      background: var(--blue);

      color: white;

      display: grid;
      place-items: center;

      font-size: 11px;
    }

    .post-actions {
      display: flex;

      margin: 0 12px;

      border-top: 1px solid var(--border);
    }

    .post-action {
      flex: 1;

      border: none;

      background: transparent;

      padding: 11px 5px;

      color: var(--muted);

      font-weight: 600;

      border-radius: 6px;

      margin: 4px 0;
    }

    .post-action:hover {
      background: var(--hover);
    }

    .post-action.liked {
      color: var(--blue);
    }

    .comments {
      padding: 0 16px 14px;
    }

    .comment {
      display: flex;

      gap: 8px;

      margin-top: 9px;
    }

    .comment-avatar {
      width: 32px;
      height: 32px;

      border-radius: 50%;

      object-fit: cover;

      flex-shrink: 0;
    }

    .comment-body {
      background: #f0f2f5;

      border-radius: 16px;

      padding: 7px 11px;

      flex: 1;
    }

    .comment-name {
      font-size: 13px;
      font-weight: 700;
    }

    .comment-text {
      font-size: 14px;
      margin-top: 2px;
    }

    .comment-form {
      display: flex;
      gap: 8px;

      margin-top: 10px;
    }

    .comment-input {
      flex: 1;

      border: none;
      outline: none;

      background: #f0f2f5;

      border-radius: 20px;

      padding: 9px 14px;
    }

    .comment-send {
      width: 38px;
      height: 38px;

      border: none;
      border-radius: 50%;

      background: var(--blue);
      color: white;
    }

    /* =========================
       RIGHT SIDEBAR
    ========================= */

    .right-sidebar {
      position: sticky;
      top: 85px;
      height: max-content;
    }

    .right-title {
      color: var(--muted);

      font-size: 17px;

      margin-bottom: 12px;
    }

    .contact {
      display: flex;
      align-items: center;
      gap: 10px;

      padding: 8px;

      border-radius: 8px;

      cursor: pointer;
    }

    .contact:hover {
      background: #e4e6eb;
    }

    .contact img {
      width: 38px;
      height: 38px;

      border-radius: 50%;

      object-fit: cover;
    }

    .online-dot {
      width: 10px;
      height: 10px;

      background: #31a24c;

      border: 2px solid white;

      border-radius: 50%;

      margin-left: -19px;
      margin-top: 25px;
    }

    .contact-name {
      font-weight: 600;
    }

    /* =========================
       EMPTY / LOADING
    ========================= */

    .loading,
    .empty {
      text-align: center;

      padding: 40px 20px;

      color: var(--muted);
    }

    .spinner {
      width: 30px;
      height: 30px;

      border: 3px solid #ddd;

      border-top-color: var(--blue);

      border-radius: 50%;

      animation: spin .8s linear infinite;

      margin: auto auto 10px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .toast {
      position: fixed;

      bottom: 25px;
      left: 50%;

      transform: translateX(-50%);

      background: #222;

      color: white;

      padding: 12px 18px;

      border-radius: 8px;

      display: none;

      z-index: 5000;

      box-shadow: 0 5px 20px rgba(0,0,0,.25);
    }

    .toast.show {
      display: block;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 1100px) {
      .page {
        grid-template-columns: 220px minmax(0, 680px);
      }

      .right-sidebar {
        display: none;
      }
    }

    @media (max-width: 760px) {
      .topbar {
        height: 58px;
        padding: 0 10px;
      }

      .logo span {
        display: none;
      }

      .search-box {
        flex: 1;
        width: auto;
      }

      .profile-mini span {
        display: none;
      }

      .page {
        display: block;

        padding: 10px 0 70px;
      }

      .sidebar {
        display: none;
      }

      .feed-column {
        width: 100%;
      }

      .stories {
        padding: 0 10px;
      }

      .card {
        border-radius: 0;

        box-shadow:
          0 1px 2px rgba(0,0,0,.12);
      }

      .composer {
        padding: 12px;
      }

      .post {
        margin-top: 10px;
      }

      .post-image {
        max-height: 550px;
      }

      .top-actions .icon-btn:nth-child(2) {
        display: none;
      }
    }

    @media (max-width: 450px) {
      .top-actions {
        gap: 2px;
      }

      .icon-btn {
        width: 38px;
        height: 38px;
      }

      .search-box input {
        height: 38px;
      }

      .story {
        min-width: 105px;
        height: 170px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="topbar">

    <div class="topbar-inner">

      <a href="/feed.html" class="logo">
        <div class="logo-icon">P</div>
        <span>Pulse</span>
      </a>

      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input
          id="searchInput"
          type="search"
          placeholder="Search Pulse"
        >
      </div>

      <div class="nav-spacer"></div>

      <div class="top-actions">

        <button
          class="icon-btn"
          onclick="location.href='/messages.html'"
          title="Messages"
        >
          💬
        </button>

        <button
          class="icon-btn"
          onclick="location.href='/notifications.html'"
          title="Notifications"
        >
          🔔
        </button>

        <a
          href="/profile.html"
          class="profile-mini"
          id="miniProfile"
        >
          <img
            id="miniAvatar"
            class="avatar-small"
            src="/images/default-avatar.png"
            alt="Profile"
          >
          <span id="miniName">Profile</span>
        </a>

      </div>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main class="page">

    <!-- LEFT -->

    <aside class="sidebar">

      <div class="sidebar-card">

        <a href="/profile.html" class="side-link">
          <div class="side-icon">👤</div>
          <span id="sideProfileName">Profile</span>
        </a>

        <a href="/feed.html" class="side-link">
          <div class="side-icon">🏠</div>
          <span>Home</span>
        </a>

        <a href="/messages.html" class="side-link">
          <div class="side-icon">💬</div>
          <span>Messages</span>
        </a>

        <a href="/notifications.html" class="side-link">
          <div class="side-icon">🔔</div>
          <span>Notifications</span>
        </a>

        <a href="/profile.html" class="side-link">
          <div class="side-icon">👥</div>
          <span>Friends</span>
        </a>

        <div class="side-divider"></div>

        <div class="sidebar-title">
          Your shortcuts
        </div>

        <a href="#" class="side-link">
          <div class="side-icon">⭐</div>
          <span>Saved Posts</span>
        </a>

        <a href="#" class="side-link">
          <div class="side-icon">🎬</div>
          <span>Videos</span>
        </a>

        <a href="#" class="side-link">
          <div class="side-icon">📷</div>
          <span>Photos</span>
        </a>

      </div>

    </aside>


    <!-- FEED -->

    <section class="feed-column">

      <!-- STORIES -->

      <div class="stories">

        <div class="story create-story">
          <img
            id="storyProfileImage"
            src="/images/default-avatar.png"
            alt=""
          >

          <div class="story-plus">+</div>

          <div class="story-name">
            Create Story
          </div>
        </div>

        <div class="story">
          <img
            src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=400&q=80"
            alt=""
          >

          <img
            class="story-avatar"
            src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=100&q=80"
            alt=""
          >

          <div class="story-name">
            Alex
          </div>
        </div>

        <div class="story">
          <img
            src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=400&q=80"
            alt=""
          >

          <img
            class="story-avatar"
            src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=100&q=80"
            alt=""
          >

          <div class="story-name">
            Sarah
          </div>
        </div>

        <div class="story">
          <img
            src="https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?auto=format&fit=crop&w=400&q=80"
            alt=""
          >

          <img
            class="story-avatar"
            src="https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?auto=format&fit=crop&w=100&q=80"
            alt=""
          >

          <div class="story-name">
            Daniel
          </div>
        </div>

      </div>


      <!-- CREATE POST -->

      <div class="card composer">

        <div class="composer-top">

          <img
            id="composerAvatar"
            class="composer-avatar"
            src="/images/default-avatar.png"
            alt="Profile"
          >

          <input
            id="composerInput"
            class="composer-input"
            type="text"
            readonly
            placeholder="What's on your mind?"
            onclick="openPostModal()"
          >

        </div>

        <div class="composer-divider"></div>

        <div class="composer-actions">

          <button
            class="composer-action photo-text"
            onclick="openPostModal(true)"
          >
            📷 Photo/Video
          </button>

          <button
            class="composer-action"
            onclick="openPostModal()"
          >
            👥 Tag People
          </button>

          <button
            class="composer-action feeling-text"
            onclick="openPostModal()"
          >
            😊 Feeling
          </button>

        </div>

      </div>


      <!-- FEED POSTS -->

      <div id="feedContainer">

        <div class="card loading">
          <div class="spinner"></div>
          Loading your feed...
        </div>

      </div>

    </section>


    <!-- RIGHT -->

    <aside class="right-sidebar">

      <h3 class="right-title">
        Contacts
      </h3>

      <div class="contact">
        <img
          src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=100&q=80"
          alt=""
        >
        <span class="contact-name">Alex</span>
        <span class="online-dot"></span>
      </div>

      <div class="contact">
        <img
          src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=100&q=80"
          alt=""
        >
        <span class="contact-name">Sarah</span>
        <span class="online-dot"></span>
      </div>

      <div class="contact">
        <img
          src="https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?auto=format&fit=crop&w=100&q=80"
          alt=""
        >
        <span class="contact-name">Daniel</span>
        <span class="online-dot"></span>
      </div>

    </aside>

  </main>


  <!-- =========================
       CREATE POST MODAL
  ========================== -->

  <div
    id="postModal"
    class="modal"
  >

    <div class="modal-box">

      <div class="modal-header">

        Create Post

        <button
          class="close-modal"
          onclick="closePostModal()"
        >
          ×
        </button>

      </div>

      <div class="modal-body">

        <div class="modal-user">

          <img
            id="modalAvatar"
            src="/images/default-avatar.png"
            alt=""
          >

          <div>

            <div
              id="modalName"
              class="modal-user-name"
            >
              You
            </div>

          </div>

        </div>

        <textarea
          id="postText"
          class="post-textarea"
          placeholder="What's on your mind?"
        ></textarea>


        <div
          id="imagePreview"
          class="image-preview"
        >

          <img
            id="previewImage"
            src=""
            alt="Preview"
          >

          <button
            class="remove-preview"
            onclick="removeImage()"
          >
            ×
          </button>

        </div>


        <div class="modal-bottom">

          <span>
            Add to your post
          </span>

          <label>
            📷
            <input
              id="postImage"
              type="file"
              accept="image/*"
              hidden
            >
          </label>

        </div>

        <button
          id="publishBtn"
          class="publish-btn"
          onclick="createPost()"
        >
          Post
        </button>

      </div>

    </div>

  </div>


  <div
    id="toast"
    class="toast"
  ></div>


<script>

const API = "";

let currentUser = null;


/* =========================
   API
========================= */

async function api(url, options = {}) {

  const response = await fetch(API + url, {
    credentials: "include",
    ...options
  });

  let data = {};

  try {
    data = await response.json();
  } catch {
    data = {};
  }

  if (!response.ok) {
    throw new Error(
      data.error ||
      data.message ||
      "Something went wrong."
    );
  }

  return data;
}


/* =========================
   INIT
========================= */

async function init() {

  try {

    const me = await api("/api/me");

    currentUser =
      me.user ||
      me;

    if (!currentUser) {
      location.href = "/login.html";
      return;
    }

    updateUserUI();

    await loadFeed();

  } catch (error) {

    console.error(error);

    location.href = "/login.html";
  }
}


/* =========================
   USER UI
========================= */

function updateUserUI() {

  const avatar =
    currentUser.profilePicture ||
    currentUser.profileImage ||
    currentUser.avatar ||
    "/images/default-avatar.png";

  const name =
    currentUser.name ||
    currentUser.username ||
    "Profile";

  document.getElementById("miniAvatar").src = avatar;

  document.getElementById("miniName").textContent = name;

  document.getElementById("sideProfileName").textContent =
    name;

  document.getElementById("composerAvatar").src =
    avatar;

  document.getElementById("modalAvatar").src =
    avatar;

  document.getElementById("modalName").textContent =
    name;

  document.getElementById("storyProfileImage").src =
    avatar;
}


/* =========================
   LOAD FEED
========================= */

async function loadFeed() {

  const container =
    document.getElementById("feedContainer");

  container.innerHTML = `
    <div class="card loading">
      <div class="spinner"></div>
      Loading feed...
    </div>
  `;

  try {

    const data = await api("/api/feed");

    const posts =
      Array.isArray(data)
        ? data
        : (
            data.posts ||
            data.feed ||
            []
          );

    if (!posts.length) {

      container.innerHTML = `
        <div class="card empty">
          <h3>No posts yet</h3>
          <p>
            Be the first person to share something.
          </p>
        </div>
      `;

      return;
    }

    container.innerHTML =
      posts.map(renderPost).join("");

    await loadCommentsForVisiblePosts();

  } catch (error) {

    console.error(error);

    container.innerHTML = `
      <div class="card empty">
        <h3>Unable to load feed</h3>
        <p>${escapeHtml(error.message)}</p>

        <button
          onclick="loadFeed()"
          style="
            margin-top:12px;
            padding:9px 16px;
            border:none;
            border-radius:7px;
            background:#1877f2;
            color:white;
            font-weight:600;
          "
        >
          Try Again
        </button>
      </div>
    `;
  }
}


/* =========================
   RENDER POST
========================= */

function renderPost(post) {

  const user =
    post.user ||
    post.author ||
    {};

  const userName =
    user.name ||
    post.authorName ||
    post.username ||
    "User";

  const username =
    user.username ||
    post.username ||
    "";

  const avatar =
    user.profilePicture ||
    user.profileImage ||
    user.avatar ||
    post.profilePicture ||
    "/images/default-avatar.png";

  const verified =
    user.verified ||
    user.isVerified ||
    post.verified;

  const text =
    post.text ||
    post.content ||
    "";

  const image =
    post.image ||
    post.imageUrl ||
    post.mediaUrl ||
    "";

  const likes =
    Number(
      post.likesCount ??
      post.likeCount ??
      post.likes ??
      0
    );

  const comments =
    Number(
      post.commentsCount ??
      post.commentCount ??
      post.comments ??
      0
    );

  const liked =
    Boolean(
      post.liked ||
      post.isLiked ||
      post.userLiked
    );

  const postId =
    post.id ||
    post._id;

  const time =
    formatDate(
      post.createdAt ||
      post.date ||
      post.timestamp
    );

  return `

    <article
      class="card post"
      id="post-${escapeAttribute(postId)}"
    >

      <div class="post-header">

        <img
          class="post-avatar"
          src="${escapeAttribute(avatar)}"
          alt=""
          onerror="this.src='/images/default-avatar.png'"
        >

        <div class="post-user">

          <div class="post-user-line">

            <a
              class="post-user-name"
              href="/profile.html?username=${encodeURIComponent(username)}"
            >
              ${escapeHtml(userName)}
            </a>

            ${
              verified
                ? `<span class="verified">✓</span>`
                : ""
            }

          </div>

          <div class="post-time">
            ${escapeHtml(time)} · 🌐
          </div>

        </div>

        <button
          class="post-menu"
          onclick="postMenu('${escapeAttribute(postId)}')"
        >
          ···
        </button>

      </div>


      ${
        text
          ? `
            <div class="post-content">
              ${escapeHtml(text)}
            </div>
          `
          : ""
      }


      ${
        image
          ? `
            <img
              class="post-image"
              src="${escapeAttribute(image)}"
              alt="Post image"
              loading="lazy"
              onerror="this.style.display='none'"
            >
          `
          : ""
      }


      <div class="post-stats">

        <div class="reaction-count">

          <span class="like-circle">
            👍
          </span>

          <span id="like-count-${escapeAttribute(postId)}">
            ${likes}
          </span>

        </div>

        <div>
          ${comments} comments
        </div>

      </div>


      <div class="post-actions">

        <button
          class="post-action ${liked ? "liked" : ""}"
          onclick="toggleLike('${escapeAttribute(postId)}', this)"
        >
          👍 Like
        </button>

        <button
          class="post-action"
          onclick="focusComment('${escapeAttribute(postId)}')"
        >
          💬 Comment
        </button>

        <button
          class="post-action"
          onclick="sharePost('${escapeAttribute(postId)}')"
        >
          ↗ Share
        </button>

      </div>


      <div
        class="comments"
        id="comments-${escapeAttribute(postId)}"
      >

        <div
          class="comment-loading"
          style="
            text-align:center;
            color:#65676b;
            font-size:13px;
            padding-top:8px;
          "
        >
          Loading comments...
        </div>

        <div class="comment-form">

          <img
            class="comment-avatar"
            src="${escapeAttribute(
              currentUser?.profilePicture ||
              currentUser?.profileImage ||
              currentUser?.avatar ||
              "/images/default-avatar.png"
            )}"
            alt=""
          >

          <input
            id="comment-input-${escapeAttribute(postId)}"
            class="comment-input"
            placeholder="Write a comment..."
            onkeydown="
              if(event.key === 'Enter'){
                event.preventDefault();
                submitComment('${escapeAttribute(postId)}');
              }
            "
          >

          <button
            class="comment-send"
            onclick="submitComment('${escapeAttribute(postId)}')"
          >
            ➤
          </button>

        </div>

      </div>

    </article>
  `;
}


/* =========================
   COMMENTS
========================= */

async function loadCommentsForVisiblePosts() {

  const posts =
    document.querySelectorAll(".post");

  for (const article of posts) {

    const id =
      article.id.replace("post-", "");

    await loadComments(id);
  }
}


async function loadComments(postId) {

  const box =
    document.getElementById(
      `comments-${postId}`
    );

  if (!box) return;

  try {

    const data =
      await api(`/api/posts/${encodeURIComponent(postId)}/comments`);

    const comments =
      Array.isArray(data)
        ? data
        : (
            data.comments ||
            []
          );

    const form =
      box.querySelector(".comment-form");

    const loading =
      box.querySelector(".comment-loading");

    if (loading) {
      loading.remove();
    }

    comments.forEach(comment => {

      const html =
        renderComment(comment);

      form.insertAdjacentHTML(
        "beforebegin",
        html
      );
    });

  } catch (error) {

    const loading =
      box.querySelector(".comment-loading");

    if (loading) {
      loading.textContent =
        "Unable to load comments.";
    }

    console.error(error);
  }
}


function renderComment(comment) {

  const user =
    comment.user ||
    comment.author ||
    {};

  const name =
    user.name ||
    comment.username ||
    "User";

  const avatar =
    user.profilePicture ||
    user.profileImage ||
    user.avatar ||
    "/images/default-avatar.png";

  const text =
    comment.text ||
    comment.content ||
    "";

  return `

    <div class="comment">

      <img
        class="comment-avatar"
        src="${escapeAttribute(avatar)}"
        alt=""
        onerror="this.src='/images/default-avatar.png'"
      >

      <div class="comment-body">

        <div class="comment-name">
          ${escapeHtml(name)}
        </div>

        <div class="comment-text">
          ${escapeHtml(text)}
        </div>

      </div>

    </div>
  `;
}


async function submitComment(postId) {

  const input =
    document.getElementById(
      `comment-input-${postId}`
    );

  if (!input) return;

  const text =
    input.value.trim();

  if (!text) return;

  input.disabled = true;

  try {

    await api(
      `/api/posts/${encodeURIComponent(postId)}/comments`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          text
        })
      }
    );

    input.value = "";

    const box =
      document.getElementById(
        `comments-${postId}`
      );

    const form =
      box.querySelector(".comment-form");

    const comment = {
      text,
      user: currentUser
    };

    form.insertAdjacentHTML(
      "beforebegin",
      renderComment(comment)
    );

  } catch (error) {

    showToast(error.message);

  } finally {

    input.disabled = false;
    input.focus();
  }
}


function focusComment(postId) {

  const input =
    document.getElementById(
      `comment-input-${postId}`
    );

  if (input) {

    input.focus();

    input.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
  }
}


/* =========================
   LIKE
========================= */

async function toggleLike(postId, button) {

  try {

    const data =
      await api(
        `/api/posts/${encodeURIComponent(postId)}/like`,
        {
          method: "POST"
        }
      );

    const liked =
      Boolean(
        data.liked ??
        data.isLiked
      );

    const count =
      Number(
        data.likesCount ??
        data.likeCount ??
        data.count ??
        0
      );

    button.classList.toggle(
      "liked",
      liked
    );

    button.innerHTML =
      liked
        ? "👍 Liked"
        : "👍 Like";

    const countElement =
      document.getElementById(
        `like-count-${postId}`
      );

    if (countElement) {
      countElement.textContent =
        count;
    }

  } catch (error) {

    showToast(error.message);
  }
}


/* =========================
   SHARE
========================= */

async function sharePost(postId) {

  const url =
    `${location.origin}/feed.html#post-${postId}`;

  try {

    if (navigator.share) {

      await navigator.share({
        title: "Pulse Social",
        text: "Check out this post on Pulse Social",
        url
      });

    } else {

      await navigator.clipboard.writeText(url);

      showToast(
        "Post link copied!"
      );
    }

  } catch (error) {

    console.log(error);
  }
}


/* =========================
   POST MENU
========================= */

async function postMenu(postId) {

  const choice =
    confirm(
      "Delete this post?\n\nPress OK to delete if it belongs to you."
    );

  if (!choice) return;

  try {

    await api(
      `/api/posts/${encodeURIComponent(postId)}`,
      {
        method: "DELETE"
      }
    );

    const article =
      document.getElementById(
        `post-${postId}`
      );

    if (article) {
      article.remove();
    }

    showToast(
      "Post deleted."
    );

  } catch (error) {

    showToast(
      error.message
    );
  }
}


/* =========================
   CREATE POST
========================= */

function openPostModal(focusImage = false) {

  document
    .getElementById("postModal")
    .classList.add("active");

  setTimeout(() => {

    if (focusImage) {

      document
        .getElementById("postImage")
        .click();

    } else {

      document
        .getElementById("postText")
        .focus();

    }

  }, 100);
}


function closePostModal() {

  document
    .getElementById("postModal")
    .classList.remove("active");

  document
    .getElementById("postText")
    .value = "";

  removeImage();
}


document
  .getElementById("postModal")
  .addEventListener("click", function(event) {

    if (event.target === this) {
      closePostModal();
    }

  });


/* =========================
   IMAGE PREVIEW
========================= */

document
  .getElementById("postImage")
  .addEventListener("change", function() {

    const file =
      this.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {

      showToast(
        "Please select an image."
      );

      this.value = "";
      return;
    }

    const url =
      URL.createObjectURL(file);

    document
      .getElementById("previewImage")
      .src = url;

    document
      .getElementById("imagePreview")
      .style.display = "block";
  });


function removeImage() {

  const input =
    document.getElementById(
      "postImage"
    );

  input.value = "";

  document
    .getElementById("imagePreview")
    .style.display = "none";

  document
    .getElementById("previewImage")
    .src = "";
}


/* =========================
   POST
========================= */

async function createPost() {

  const text =
    document
      .getElementById("postText")
      .value
      .trim();

  const imageInput =
    document.getElementById(
      "postImage"
    );

  const file =
    imageInput.files[0];

  if (!text && !file) {

    showToast(
      "Write something or add a photo."
    );

    return;
  }

  const button =
    document.getElementById(
      "publishBtn"
    );

  button.disabled = true;

  button.textContent =
    "Posting...";

  try {

    const formData =
      new FormData();

    if (text) {
      formData.append(
        "text",
        text
      );
    }

    if (file) {

      formData.append(
        "image",
        file
      );
    }

    await api(
      "/api/posts",
      {
        method: "POST",
        body: formData
      }
    );

    closePostModal();

    await loadFeed();

    showToast(
      "Post published!"
    );

  } catch (error) {

    showToast(
      error.message
    );

  } finally {

    button.disabled = false;

    button.textContent =
      "Post";
  }
}


/* =========================
   SEARCH
========================= */

let searchTimer;

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    function() {

      clearTimeout(
        searchTimer
      );

      const query =
        this.value.trim();

      if (!query) return;

      searchTimer =
        setTimeout(
          () => searchUsers(query),
          500
        );
    }
  );


async function searchUsers(query) {

  try {

    const data =
      await api(
        `/api/search?q=${encodeURIComponent(query)}`
      );

    console.log(
      "Search results:",
      data
    );

  } catch (error) {

    console.error(
      error
    );
  }
}


/* =========================
   HELPERS
========================= */

function formatDate(value) {

  if (!value) {
    return "Just now";
  }

  const date =
    new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "Just now";
  }

  const seconds =
    Math.floor(
      (Date.now() - date.getTime()) / 1000
    );

  if (seconds < 60) {
    return "Just now";
  }

  const minutes =
    Math.floor(seconds / 60);

  if (minutes < 60) {
    return `${minutes}m`;
  }

  const hours =
    Math.floor(minutes / 60);

  if (hours < 24) {
    return `${hours}h`;
  }

  const days =
    Math.floor(hours / 24);

  if (days < 7) {
    return `${days}d`;
  }

  return date.toLocaleDateString();
}


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function escapeAttribute(value) {

  return escapeHtml(value)
    .replace(/`/g, "&#096;");
}


function showToast(message) {

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  setTimeout(() => {

    toast.classList.remove(
      "show"
    );

  }, 3000);
}


/* =========================
   START
========================= */

init();

</script>
