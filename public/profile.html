<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profile • Pulse Social</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f0f2f5;
      color: #1c1e21;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar {
      height: 64px;
      background: #fff;
      border-bottom: 1px solid #dddfe2;
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      color: #1877f2;
      font-size: 29px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .search {
      width: 240px;
      background: #f0f2f5;
      border-radius: 22px;
      padding: 10px 16px;
      border: none;
      outline: none;
    }

    .topnav {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
    }

    .nav-btn:hover {
      background: #e4e6eb;
    }

    .top-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      cursor: pointer;
    }

    /* =========================
       PAGE
    ========================= */

    .page {
      max-width: 1100px;
      margin: auto;
      padding-bottom: 50px;
    }

    /* =========================
       PROFILE HEADER
    ========================= */

    .profile-card {
      background: #fff;
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
      border-radius: 0 0 10px 10px;
      overflow: hidden;
    }

    .cover {
      height: 360px;
      background: #d8dadf;
      position: relative;
      overflow: hidden;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cover-placeholder {
      width: 100%;
      height: 100%;
      background:
        linear-gradient(
          135deg,
          #1877f2,
          #4b8ff7,
          #8db6fa
        );
    }

    .cover-edit {
      position: absolute;
      right: 18px;
      bottom: 18px;
      background: #fff;
      color: #1c1e21;
      border: none;
      border-radius: 7px;
      padding: 9px 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }

    .cover-edit:hover {
      background: #f0f2f5;
    }

    .profile-main {
      position: relative;
      padding: 0 30px 20px;
    }

    .profile-photo-wrap {
      position: relative;
      width: 168px;
      height: 168px;
      margin-top: -84px;
      border: 5px solid #fff;
      border-radius: 50%;
      background: #fff;
      z-index: 5;
    }

    .profile-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .photo-edit {
      position: absolute;
      right: 3px;
      bottom: 3px;
      width: 38px;
      height: 38px;
      border: 3px solid #fff;
      border-radius: 50%;
      background: #e4e6eb;
      cursor: pointer;
      font-size: 17px;
    }

    .profile-info-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: -15px;
      padding-left: 190px;
    }

    .profile-info h1 {
      font-size: 30px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .verified {
      width: 21px;
      height: 21px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #1877f2;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
    }

    .handle {
      color: #65676b;
      margin-top: 4px;
    }

    .bio {
      margin-top: 12px;
      max-width: 600px;
      line-height: 1.5;
      color: #333;
    }

    .stats {
      display: flex;
      gap: 20px;
      margin-top: 13px;
      color: #65676b;
    }

    .stats strong {
      color: #1c1e21;
    }

    .profile-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      border: none;
      border-radius: 7px;
      padding: 10px 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #1877f2;
      color: #fff;
    }

    .primary:hover {
      background: #166fe5;
    }

    .secondary {
      background: #e4e6eb;
      color: #1c1e21;
    }

    .secondary:hover {
      background: #d8dadf;
    }

    .verification-btn {
      background: #1877f2;
      color: white;
    }

    /* =========================
       PROFILE TABS
    ========================= */

    .tabs {
      height: 60px;
      border-top: 1px solid #dddfe2;
      margin-top: 20px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .tab {
      height: 60px;
      padding: 0 20px;
      border: none;
      background: transparent;
      color: #65676b;
      font-weight: 700;
      cursor: pointer;
      position: relative;
    }

    .tab.active {
      color: #1877f2;
    }

    .tab.active::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 0;
      height: 3px;
      background: #1877f2;
      border-radius: 3px 3px 0 0;
    }

    /* =========================
       CONTENT
    ========================= */

    .content {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 16px;
      margin-top: 18px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
      padding: 18px;
      margin-bottom: 16px;
    }

    .card h2 {
      font-size: 20px;
      margin-bottom: 14px;
    }

    .about-row {
      margin-bottom: 13px;
      color: #65676b;
    }

    .about-row strong {
      color: #1c1e21;
    }

    /* =========================
       CREATE POST
    ========================= */

    .create-post {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .create-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
    }

    .create-input {
      flex: 1;
      border: none;
      background: #f0f2f5;
      border-radius: 22px;
      padding: 12px 17px;
      cursor: pointer;
      color: #65676b;
    }

    /* =========================
       POSTS
    ========================= */

    .post {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
      margin-bottom: 16px;
      overflow: hidden;
    }

    .post-header {
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .post-avatar {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      object-fit: cover;
    }

    .post-user {
      font-weight: 700;
    }

    .post-meta {
      color: #65676b;
      font-size: 13px;
      margin-top: 3px;
    }

    .post-text {
      padding: 0 15px 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .post-image {
      width: 100%;
      max-height: 650px;
      object-fit: cover;
      display: block;
    }

    .post-stats {
      display: flex;
      justify-content: space-between;
      padding: 10px 15px;
      color: #65676b;
      font-size: 14px;
    }

    .post-actions {
      border-top: 1px solid #dddfe2;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 4px 8px;
    }

    .post-action {
      border: none;
      background: transparent;
      padding: 10px;
      color: #65676b;
      font-weight: 700;
      cursor: pointer;
      border-radius: 6px;
    }

    .post-action:hover {
      background: #f0f2f5;
    }

    .post-action.liked {
      color: #1877f2;
    }

    .empty {
      text-align: center;
      color: #65676b;
      padding: 30px;
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 20px;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: min(520px, 100%);
      background: #fff;
      border-radius: 12px;
      padding: 22px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal-header h2 {
      font-size: 21px;
    }

    .close {
      border: none;
      background: #e4e6eb;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }

    .file-label {
      display: block;
      background: #f0f2f5;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .file-label:hover {
      background: #e4e6eb;
    }

    input[type="file"] {
      display: none;
    }

    .modal button.submit {
      width: 100%;
      border: none;
      padding: 12px;
      border-radius: 8px;
      background: #1877f2;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-message {
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 850px) {
      .search {
        display: none;
      }

      .cover {
        height: 260px;
      }

      .profile-main {
        padding: 0 18px 18px;
      }

      .profile-photo-wrap {
        width: 135px;
        height: 135px;
        margin-top: -67px;
      }

      .profile-info-row {
        display: block;
        padding-left: 0;
        margin-top: 12px;
      }

      .profile-info h1 {
        font-size: 25px;
      }

      .profile-actions {
        margin-top: 15px;
        flex-wrap: wrap;
      }

      .tabs {
        overflow-x: auto;
      }

      .tab {
        white-space: nowrap;
      }

      .content {
        grid-template-columns: 1fr;
      }

      .left-column {
        order: 2;
      }

      .right-column {
        order: 1;
      }

      .page {
        width: 100%;
      }

      .profile-card {
        border-radius: 0;
      }
    }

    @media (max-width: 500px) {
      .topbar {
        padding: 0 10px;
      }

      .logo {
        font-size: 24px;
      }

      .topnav {
        gap: 4px;
      }

      .nav-btn {
        width: 38px;
        height: 38px;
        font-size: 17px;
      }

      .cover {
        height: 210px;
      }

      .profile-photo-wrap {
        width: 115px;
        height: 115px;
        margin-top: -57px;
      }

      .profile-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .action-btn {
        width: 100%;
      }

      .stats {
        gap: 12px;
        flex-wrap: wrap;
      }

      .card {
        border-radius: 8px;
      }
    }
  </style>
</head>

<body>

<header class="topbar">

  <a href="/feed.html" class="logo">Pulse</a>

  <input
    id="searchInput"
    class="search"
    placeholder="Search Pulse"
    autocomplete="off"
  >

  <nav class="topnav">

    <a href="/feed.html" class="nav-btn" title="Home">⌂</a>

    <a href="/messages.html" class="nav-btn" title="Messages">💬</a>

    <a href="/notifications.html" class="nav-btn" title="Notifications">🔔</a>

    <img
      id="topAvatar"
      class="top-avatar"
      src="/images/default-avatar.png"
      alt="Profile"
    >

  </nav>

</header>


<main class="page">

  <!-- PROFILE HEADER -->

  <section class="profile-card">

    <div class="cover">

      <div id="coverPlaceholder" class="cover-placeholder"></div>

      <img
        id="coverImage"
        class="hidden"
        alt="Cover photo"
      >

      <button
        id="coverEdit"
        class="cover-edit hidden"
      >
        📷 Edit Cover Photo
      </button>

    </div>


    <div class="profile-main">

      <div class="profile-photo-wrap">

        <img
          id="profileImage"
          class="profile-photo"
          src="/images/default-avatar.png"
          alt="Profile picture"
        >

        <button
          id="profileEdit"
          class="photo-edit hidden"
          title="Change profile picture"
        >
          📷
        </button>

      </div>


      <div class="profile-info-row">

        <div class="profile-info">

          <h1>
            <span id="profileName">Loading...</span>
            <span id="verifiedBadge" class="verified hidden">✓</span>
          </h1>

          <div id="profileUsername" class="handle">
            @username
          </div>

          <div id="bio" class="bio"></div>

          <div class="stats">

            <span>
              <strong id="postsCount">0</strong>
              posts
            </span>

            <span>
              <strong id="followersCount">0</strong>
              followers
            </span>

            <span>
              <strong id="followingCount">0</strong>
              following
            </span>

          </div>

        </div>


        <div class="profile-actions">

          <button
            id="followBtn"
            class="action-btn primary hidden"
          >
            Follow
          </button>

          <button
            id="messageBtn"
            class="action-btn secondary hidden"
          >
            Message
          </button>

          <button
            id="editProfileBtn"
            class="action-btn secondary hidden"
          >
            Edit Profile
          </button>

          <button
            id="verifyBtn"
            class="action-btn verification-btn hidden"
          >
            Get Verified
          </button>

        </div>

      </div>


      <div class="tabs">

        <button class="tab active" data-tab="posts">
          Posts
        </button>

        <button class="tab" data-tab="about">
          About
        </button>

        <button class="tab" data-tab="friends">
          Followers
        </button>

        <button class="tab" data-tab="photos">
          Photos
        </button>

      </div>

    </div>

  </section>


  <!-- CONTENT -->

  <section class="content">

    <div class="left-column">

      <div id="aboutCard" class="card">

        <h2>About</h2>

        <div class="about-row">
          👤
          <strong id="aboutName">User</strong>
        </div>

        <div class="about-row">
          @<span id="aboutUsername">username</span>
        </div>

        <div class="about-row" id="aboutBio"></div>

        <div class="about-row">
          Joined Pulse Social
        </div>

      </div>


      <div id="followersCard" class="card">

        <h2>Followers</h2>

        <div id="followersList" class="empty">
          Loading followers...
        </div>

      </div>

    </div>


    <div class="right-column">

      <div
        id="createPost"
        class="card create-post hidden"
      >

        <img
          id="createAvatar"
          class="create-avatar"
          src="/images/default-avatar.png"
          alt=""
        >

        <div
          id="createPostButton"
          class="create-input"
        >
          What's on your mind?
        </div>

      </div>


      <div id="postsContainer">

        <div class="card empty">
          Loading posts...
        </div>

      </div>

    </div>

  </section>

</main>


<!-- PHOTO MODAL -->

<div id="photoModal" class="modal">

  <div class="modal-box">

    <div class="modal-header">

      <h2>Update Profile Photo</h2>

      <button
        class="close"
        onclick="closePhotoModal()"
      >
        ×
      </button>

    </div>

    <label class="file-label">
      Choose Profile Picture
      <input
        type="file"
        id="profileFile"
        accept="image/*"
      >
    </label>

    <button
      class="submit"
      onclick="uploadProfilePicture()"
    >
      Upload
    </button>

    <div
      id="profileUploadMessage"
      class="modal-message"
    ></div>

  </div>

</div>


<!-- COVER MODAL -->

<div id="coverModal" class="modal">

  <div class="modal-box">

    <div class="modal-header">

      <h2>Update Cover Photo</h2>

      <button
        class="close"
        onclick="closeCoverModal()"
      >
        ×
      </button>

    </div>

    <label class="file-label">
      Choose Cover Photo
      <input
        type="file"
        id="coverFile"
        accept="image/*"
      >
    </label>

    <button
      class="submit"
      onclick="uploadCoverPhoto()"
    >
      Upload
    </button>

    <div
      id="coverUploadMessage"
      class="modal-message"
    ></div>

  </div>

</div>


<script>

  const params = new URLSearchParams(window.location.search);

  const requestedUsername = params.get("username");

  let currentUser = null;
  let profileUser = null;
  let isOwner = false;

  const DEFAULT_AVATAR = "/images/default-avatar.png";


  /* =========================
     HELPERS
  ========================= */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function avatarOf(user) {

    return (
      user?.profilePicture ||
      user?.profileImage ||
      user?.avatar ||
      DEFAULT_AVATAR
    );

  }


  function verifiedOf(user) {

    return (
      user?.verified === true ||
      user?.isVerified === true ||
      user?.verificationStatus === "approved"
    );

  }


  function formatNumber(value) {

    const number = Number(value || 0);

    if (number >= 1000000) {
      return (number / 1000000).toFixed(1) + "M";
    }

    if (number >= 1000) {
      return (number / 1000).toFixed(1) + "K";
    }

    return number.toString();

  }


  function formatDate(date) {

    if (!date) return "";

    const d = new Date(date);

    if (Number.isNaN(d.getTime())) {
      return "";
    }

    return d.toLocaleDateString([], {
      year: "numeric",
      month: "short",
      day: "numeric"
    });

  }


  function showError(message) {

    document.getElementById("postsContainer").innerHTML = `
      <div class="card empty">
        ${escapeHtml(message)}
      </div>
    `;

  }


  /* =========================
     LOAD CURRENT USER
  ========================= */

  async function loadMe() {

    const response = await fetch("/api/me", {
      credentials: "include"
    });

    if (!response.ok) {
      window.location.href = "/login.html";
      return null;
    }

    const data = await response.json();

    return (
      data.user ||
      data.currentUser ||
      data
    );

  }


  /* =========================
     LOAD PROFILE
  ========================= */

  async function loadProfile() {

    if (!requestedUsername) {

      if (!currentUser?.username) {
        window.location.href = "/feed.html";
        return;
      }

      profileUser = currentUser;

    } else {

      const response = await fetch(
        "/api/users/" + encodeURIComponent(requestedUsername),
        {
          credentials: "include"
        }
      );

      if (!response.ok) {
        showError("Profile not found.");
        return;
      }

      const data = await response.json();

      profileUser =
        data.user ||
        data.profile ||
        data;

    }


    if (!profileUser) {
      showError("Unable to load profile.");
      return;
    }


    isOwner =
      String(profileUser.id) === String(currentUser.id) ||
      profileUser.username === currentUser.username;


    renderProfile();

    loadPosts();

    loadFollowers();

  }


  /* =========================
     RENDER PROFILE
  ========================= */

  function renderProfile() {

    const name =
      profileUser.name ||
      profileUser.displayName ||
      profileUser.username ||
      "User";

    const username =
      profileUser.username ||
      "";

    const avatar =
      avatarOf(profileUser);

    const cover =
      profileUser.coverPhoto ||
      profileUser.coverImage ||
      profileUser.cover ||
      "";

    document.title =
      name + " • Pulse Social";


    document.getElementById("profileName").textContent =
      name;

    document.getElementById("profileUsername").textContent =
      "@" + username;

    document.getElementById("aboutName").textContent =
      name;

    document.getElementById("aboutUsername").textContent =
      username;

    document.getElementById("bio").textContent =
      profileUser.bio || "";

    document.getElementById("aboutBio").textContent =
      profileUser.bio || "No bio added yet.";


    document.getElementById("profileImage").src =
      avatar;

    document.getElementById("topAvatar").src =
      avatar;

    document.getElementById("createAvatar").src =
      avatar;


    if (cover) {

      const coverImage =
        document.getElementById("coverImage");

      coverImage.src = cover;
      coverImage.classList.remove("hidden");

      document
        .getElementById("coverPlaceholder")
        .classList.add("hidden");

    }


    /* VERIFIED BADGE */

    if (verifiedOf(profileUser)) {

      document
        .getElementById("verifiedBadge")
        .classList.remove("hidden");

    }


    /* COUNTS */

    document.getElementById("postsCount").textContent =
      formatNumber(
        profileUser.postsCount ||
        profileUser.postCount ||
        0
      );

    document.getElementById("followersCount").textContent =
      formatNumber(
        profileUser.followersCount ||
        profileUser.followerCount ||
        0
      );

    document.getElementById("followingCount").textContent =
      formatNumber(
        profileUser.followingCount ||
        profileUser.following ||
        0
      );


    /* OWNER */

    if (isOwner) {

      document
        .getElementById("editProfileBtn")
        .classList.remove("hidden");

      document
        .getElementById("verifyBtn")
        .classList.remove("hidden");

      document
        .getElementById("profileEdit")
        .classList.remove("hidden");

      document
        .getElementById("coverEdit")
        .classList.remove("hidden");

      document
        .getElementById("createPost")
        .classList.remove("hidden");

      document
        .getElementById("verifyBtn")
        .textContent =
        verifiedOf(profileUser)
          ? "✓ Verified"
          : "Get Verified";

      if (verifiedOf(profileUser)) {
        document
          .getElementById("verifyBtn")
          .disabled = true;
      }

    } else {

      document
        .getElementById("followBtn")
        .classList.remove("hidden");

      document
        .getElementById("messageBtn")
        .classList.remove("hidden");


      updateFollowButton();

    }

  }


  /* =========================
     FOLLOW BUTTON
  ========================= */

  function updateFollowButton() {

    const button =
      document.getElementById("followBtn");

    if (profileUser.isFollowing) {

      button.textContent = "Following";
      button.classList.remove("primary");
      button.classList.add("secondary");

    } else {

      button.textContent = "Follow";
      button.classList.add("primary");
      button.classList.remove("secondary");

    }

  }


  async function toggleFollow() {

    if (!profileUser?.id) return;

    const button =
      document.getElementById("followBtn");

    button.disabled = true;

    try {

      const response = await fetch(
        "/api/users/" +
        encodeURIComponent(profileUser.id) +
        "/follow",
        {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json"
          }
        }
      );

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {

        throw new Error(
          data.message ||
          data.error ||
          "Unable to update follow status."
        );

      }


      profileUser.isFollowing =
        data.isFollowing ??
        data.following ??
        !profileUser.isFollowing;


      if (
        data.followersCount !== undefined
      ) {

        profileUser.followersCount =
          data.followersCount;

      }


      updateFollowButton();

      document.getElementById("followersCount").textContent =
        formatNumber(profileUser.followersCount);

    } catch (error) {

      alert(error.message);

    } finally {

      button.disabled = false;

    }

  }


  /* =========================
     MESSAGE
  ========================= */

  function openMessage() {

    if (!profileUser?.id) return;

    window.location.href =
      "/messages.html?user=" +
      encodeURIComponent(profileUser.id);

  }


  /* =========================
     VERIFICATION
  ========================= */

  function openVerification() {

    if (verifiedOf(profileUser)) return;

    window.location.href =
      "/verification.html";

  }


  /* =========================
     LOAD POSTS
  ========================= */

  async function loadPosts() {

    const username =
      profileUser.username;

    if (!username) {

      showError("Unable to identify this profile.");
      return;

    }


    try {

      const response = await fetch(
        "/api/users/" +
        encodeURIComponent(username) +
        "/posts",
        {
          credentials: "include"
        }
      );


      if (!response.ok) {
        throw new Error("Unable to load posts.");
      }


      const data = await response.json();

      const posts =
        Array.isArray(data)
          ? data
          : (
              data.posts ||
              data.items ||
              []
            );


      renderPosts(posts);


    } catch (error) {

      console.error(error);

      showError("Unable to load posts.");

    }

  }


  /* =========================
     RENDER POSTS
  ========================= */

  function renderPosts(posts) {

    const container =
      document.getElementById("postsContainer");


    if (!posts.length) {

      container.innerHTML = `
        <div class="card empty">
          This profile hasn't posted anything yet.
        </div>
      `;

      return;

    }


    container.innerHTML =
      posts.map(renderPost).join("");

  }


  function renderPost(post) {

    const author =
      post.user ||
      post.author ||
      profileUser;

    const text =
      post.text ||
      post.content ||
      "";

    const image =
      post.image ||
      post.imageUrl ||
      "";

    const likes =
      post.likesCount ??
      post.likeCount ??
      (Array.isArray(post.likes)
        ? post.likes.length
        : 0);

    const comments =
      post.commentsCount ??
      post.commentCount ??
      (Array.isArray(post.comments)
        ? post.comments.length
        : 0);

    const liked =
      post.liked ||
      post.isLiked;


    return `
      <article class="post">

        <div class="post-header">

          <img
            class="post-avatar"
            src="${escapeHtml(avatarOf(author))}"
            onerror="this.src='${DEFAULT_AVATAR}'"
          >

          <div>

            <div class="post-user">

              ${escapeHtml(
                author.name ||
                author.username ||
                "User"
              )}

              ${
                verifiedOf(author)
                  ? `<span class="verified">✓</span>`
                  : ""
              }

            </div>

            <div class="post-meta">
              @${escapeHtml(author.username || "")}
              ·
              ${escapeHtml(formatDate(post.createdAt))}
            </div>

          </div>

        </div>


        ${
          text
            ? `
              <div class="post-text">
                ${escapeHtml(text)}
              </div>
            `
            : ""
        }


        ${
          image
            ? `
              <img
                class="post-image"
                src="${escapeHtml(image)}"
                alt="Post"
                onerror="this.style.display='none'"
              >
            `
            : ""
        }


        <div class="post-stats">

          <span>
            👍 ${formatNumber(likes)}
          </span>

          <span>
            ${formatNumber(comments)} comments
          </span>

        </div>


        <div class="post-actions">

          <button
            class="post-action ${liked ? "liked" : ""}"
            onclick="likePost('${escapeHtml(post.id)}', this)"
          >
            👍 Like
          </button>

          <button
            class="post-action"
            onclick="openPost('${escapeHtml(post.id)}')"
          >
            💬 Comment
          </button>

          <button
            class="post-action"
            onclick="sharePost('${escapeHtml(post.id)}')"
          >
            ↗ Share
          </button>

        </div>

      </article>
    `;

  }


  /* =========================
     LIKE
  ========================= */

  async function likePost(postId, button) {

    if (!postId) return;

    try {

      const response = await fetch(
        "/api/posts/" +
        encodeURIComponent(postId) +
        "/like",
        {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json"
          }
        }
      );

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {

        throw new Error(
          data.message ||
          data.error ||
          "Unable to like post."
        );

      }

      button.classList.toggle(
        "liked",
        data.liked ?? true
      );

    } catch (error) {

      console.error(error);

    }

  }


  /* =========================
     OPEN POST
  ========================= */

  function openPost(postId) {

    if (!postId) return;

    window.location.href =
      "/feed.html?post=" +
      encodeURIComponent(postId);

  }


  /* =========================
     SHARE
  ========================= */

  async function sharePost(postId) {

    const url =
      window.location.origin +
      "/feed.html?post=" +
      encodeURIComponent(postId);


    if (navigator.share) {

      try {

        await navigator.share({
          title: "Pulse Social",
          text: "Check out this post on Pulse Social.",
          url
        });

      } catch (error) {
        // User cancelled share.
      }

    } else {

      try {

        await navigator.clipboard.writeText(url);

        alert("Post link copied.");

      } catch {

        prompt(
          "Copy this post link:",
          url
        );

      }

    }

  }


  /* =========================
     FOLLOWERS
  ========================= */

  async function loadFollowers() {

    if (!profileUser?.id) return;


    const container =
      document.getElementById("followersList");


    try {

      const response = await fetch(
        "/api/users/" +
        encodeURIComponent(profileUser.id) +
        "/followers",
        {
          credentials: "include"
        }
      );


      if (!response.ok) {

        container.innerHTML =
          "Followers unavailable.";

        return;

      }


      const data =
        await response.json();

      const followers =
        Array.isArray(data)
          ? data
          : (
              data.followers ||
              data.users ||
              []
            );


      if (!followers.length) {

        container.innerHTML =
          "No followers yet.";

        return;

      }


      container.innerHTML =
        followers.slice(0, 8).map(user => `

          <div style="
            display:flex;
            align-items:center;
            gap:10px;
            padding:8px 0;
            cursor:pointer;
          "
          onclick="
            window.location.href='/profile.html?username=${encodeURIComponent(user.username || "")}'
          ">

            <img
              src="${escapeHtml(avatarOf(user))}"
              style="
                width:40px;
                height:40px;
                border-radius:50%;
                object-fit:cover;
              "
              onerror="this.src='${DEFAULT_AVATAR}'"
            >

            <div>

              <strong>
                ${escapeHtml(
                  user.name ||
                  user.username ||
                  "User"
                )}

                ${
                  verifiedOf(user)
                    ? `<span class="verified">✓</span>`
                    : ""
                }

              </strong>

              <div style="
                color:#65676b;
                font-size:13px;
              ">
                @${escapeHtml(user.username || "")}
              </div>

            </div>

          </div>

        `).join("");


    } catch (error) {

      console.error(error);

      container.innerHTML =
        "Unable to load followers.";

    }

  }


  /* =========================
     PROFILE PHOTO
  ========================= */

  function openPhotoModal() {

    document
      .getElementById("photoModal")
      .classList.add("show");

  }


  function closePhotoModal() {

    document
      .getElementById("photoModal")
      .classList.remove("show");

  }


  async function uploadProfilePicture() {

    const file =
      document.getElementById("profileFile").files[0];

    const message =
      document.getElementById("profileUploadMessage");


    if (!file) {

      message.textContent =
        "Choose an image first.";

      return;

    }


    const formData =
      new FormData();

    formData.append(
      "profilePicture",
      file
    );


    message.textContent =
      "Uploading...";


    try {

      const response =
        await fetch(
          "/api/profile/picture",
          {
            method: "POST",
            credentials: "include",
            body: formData
          }
        );


      const data =
        await response.json().catch(() => ({}));


      if (!response.ok) {

        throw new Error(
          data.message ||
          data.error ||
          "Upload failed."
        );

      }


      message.textContent =
        "Profile picture updated.";

      setTimeout(() => {

        closePhotoModal();

        window.location.reload();

      }, 700);


    } catch (error) {

      message.textContent =
        error.message;

    }

  }


  /* =========================
     COVER PHOTO
  ========================= */

  function openCoverModal() {

    document
      .getElementById("coverModal")
      .classList.add("show");

  }


  function closeCoverModal() {

    document
      .getElementById("coverModal")
      .classList.remove("show");

  }


  async function uploadCoverPhoto() {

    const file =
      document.getElementById("coverFile").files[0];

    const message =
      document.getElementById("coverUploadMessage");


    if (!file) {

      message.textContent =
        "Choose an image first.";

      return;

    }


    const formData =
      new FormData();

    formData.append(
      "coverPhoto",
      file
    );


    message.textContent =
      "Uploading...";


    try {

      const response =
        await fetch(
          "/api/profile/cover",
          {
            method: "POST",
            credentials: "include",
            body: formData
          }
        );


      const data =
        await response.json().catch(() => ({}));


      if (!response.ok) {

        throw new Error(
          data.message ||
          data.error ||
          "Upload failed."
        );

      }


      message.textContent =
        "Cover photo updated.";

      setTimeout(() => {

        closeCoverModal();

        window.location.reload();

      }, 700);


    } catch (error) {

      message.textContent =
        error.message;

    }

  }


  /* =========================
     EDIT PROFILE
  ========================= */

  function editProfile() {

    const bio =
      prompt(
        "Enter your new bio:",
        profileUser.bio || ""
      );


    if (bio === null) return;


    updateBio(bio);

  }


  async function updateBio(bio) {

    try {

      const response =
        await fetch(
          "/api/profile",
          {
            method: "PUT",
            credentials: "include",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              bio
            })
          }
        );


      const data =
        await response.json().catch(() => ({}));


      if (!response.ok) {

        throw new Error(
          data.message ||
          data.error ||
          "Unable to update profile."
        );

      }


      window.location.reload();

    } catch (error) {

      alert(error.message);

    }

  }


  /* =========================
     CREATE POST
  ========================= */

  function openCreatePost() {

    window.location.href =
      "/feed.html#create-post";

  }


  /* =========================
     SEARCH
  ========================= */

  const searchInput =
    document.getElementById("searchInput");


  searchInput.addEventListener(
    "keydown",
    function(event) {

      if (event.key !== "Enter") return;

      const query =
        searchInput.value.trim();

      if (!query) return;

      window.location.href =
        "/feed.html?search=" +
        encodeURIComponent(query);

    }
  );


  /* =========================
     BUTTON EVENTS
  ========================= */

  document
    .getElementById("followBtn")
    .addEventListener(
      "click",
      toggleFollow
    );


  document
    .getElementById("messageBtn")
    .addEventListener(
      "click",
      openMessage
    );


  document
    .getElementById("verifyBtn")
    .addEventListener(
      "click",
      openVerification
    );


  document
    .getElementById("editProfileBtn")
    .addEventListener(
      "click",
      editProfile
    );


  document
    .getElementById("profileEdit")
    .addEventListener(
      "click",
      openPhotoModal
    );


  document
    .getElementById("coverEdit")
    .addEventListener(
      "click",
      openCoverModal
    );


  document
    .getElementById("createPostButton")
    .addEventListener(
      "click",
      openCreatePost
    );


  /* =========================
     TABS
  ========================= */

  document
    .querySelectorAll(".tab")
    .forEach(tab => {

      tab.addEventListener(
        "click",
        function() {

          document
            .querySelectorAll(".tab")
            .forEach(t =>
              t.classList.remove("active")
            );

          this.classList.add("active");

          const type =
            this.dataset.tab;

          if (type === "posts") {

            document
              .getElementById("postsContainer")
              .style.display = "block";

          }

          if (type === "about") {

            document
              .getElementById("aboutCard")
              .scrollIntoView({
                behavior: "smooth"
              });

          }

          if (type === "friends") {

            document
              .getElementById("followersCard")
              .scrollIntoView({
                behavior: "smooth"
              });

          }

        }
      );

    });


  /* =========================
     IMAGE FALLBACKS
  ========================= */

  document
    .getElementById("profileImage")
    .addEventListener(
      "error",
      function() {
        this.src = DEFAULT_AVATAR;
      }
    );


  document
    .getElementById("topAvatar")
    .addEventListener(
      "error",
      function() {
        this.src = DEFAULT_AVATAR;
      }
    );


  /* =========================
     START
  ========================= */

  async function init() {

    try {

      currentUser =
        await loadMe();

      if (!currentUser) return;

      await loadProfile();

    } catch (error) {

      console.error(
        "Profile initialization error:",
        error
      );

      showError(
        "Unable to load profile."
      );

    }

  }


  init();

</script>

</body>
</html>
