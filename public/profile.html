<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Profile • Pulse Social</title>

  <style>
    :root {
      --black: #000;
      --bg: #050505;
      --card: #111;
      --card2: #181818;
      --text: #fff;
      --muted: #a7a7a7;
      --line: #292929;
      --pink: #fe2c55;
      --cyan: #25f4ee;
      --blue: #1683ff;
      --danger: #ff3b30;
      --nav-height: 62px;
      --max-width: 620px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--black);
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =====================================================
       APP
    ===================================================== */

    .app {
      width: 100%;
      min-height: 100vh;
      background: var(--black);
    }

    .page {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      min-height: 100vh;
      background: var(--bg);
      padding-bottom: calc(var(--nav-height) + 20px);
    }

    /* =====================================================
       TOP BAR
    ===================================================== */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid #151515;
    }

    .topbar-left,
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: transparent;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .icon-btn:active {
      transform: scale(0.9);
    }

    .username-title {
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .verified {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #20a7ff;
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 900;
      flex-shrink: 0;
    }

    /* =====================================================
       COVER
    ===================================================== */

    .cover-wrapper {
      position: relative;
      width: 100%;
      height: 205px;
      background:
        radial-gradient(circle at 30% 30%, #292929 0%, transparent 45%),
        linear-gradient(135deg, #151515, #050505);
      overflow: hidden;
    }

    .cover-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .cover-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.05),
          rgba(0, 0, 0, 0.55)
        );
      pointer-events: none;
    }

    .cover-edit {
      position: absolute;
      right: 14px;
      bottom: 14px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      z-index: 5;
    }

    /* =====================================================
       PROFILE HEADER
    ===================================================== */

    .profile-header {
      position: relative;
      padding: 0 16px 20px;
    }

    .avatar-wrap {
      position: relative;
      width: 104px;
      height: 104px;
      margin-top: -52px;
      z-index: 5;
    }

    .avatar {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      object-fit: cover;
      background: #222;
      border: 4px solid #000;
      display: block;
    }

    .avatar-edit {
      position: absolute;
      right: 2px;
      bottom: 2px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #fff;
      color: #000;
      border: 3px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      z-index: 4;
    }

    .profile-main {
      margin-top: 10px;
    }

    .display-name {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.15;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .handle {
      margin-top: 4px;
      color: #aaa;
      font-size: 14px;
    }

    .bio {
      margin-top: 12px;
      color: #eee;
      font-size: 15px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .website {
      display: inline-block;
      margin-top: 9px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }

    /* =====================================================
       STATS
    ===================================================== */

    .stats {
      display: flex;
      align-items: center;
      gap: 28px;
      margin-top: 18px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      cursor: pointer;
    }

    .stat-number {
      font-size: 18px;
      font-weight: 800;
    }

    .stat-label {
      margin-top: 3px;
      color: #999;
      font-size: 13px;
    }

    /* =====================================================
       ACTIONS
    ===================================================== */

    .profile-actions {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .action-button {
      height: 42px;
      border-radius: 5px;
      padding: 0 20px;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.18s ease;
    }

    .action-button:active {
      transform: scale(0.96);
    }

    .follow-btn {
      flex: 1;
      background: var(--pink);
      color: white;
    }

    .follow-btn.following {
      background: #272727;
      border: 1px solid #3c3c3c;
    }

    .edit-btn {
      flex: 1;
      background: #272727;
      color: white;
      border: 1px solid #3a3a3a;
    }

    .more-btn {
      width: 44px;
      padding: 0;
      background: #272727;
      color: white;
      border: 1px solid #3a3a3a;
      font-size: 21px;
    }

    /* =====================================================
       PROFILE TABS
    ===================================================== */

    .profile-tabs {
      height: 52px;
      display: flex;
      border-bottom: 1px solid var(--line);
      border-top: 1px solid #151515;
      position: sticky;
      top: 54px;
      z-index: 50;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(14px);
    }

    .profile-tab {
      flex: 1;
      color: #777;
      background: transparent;
      position: relative;
      font-size: 21px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .profile-tab.active {
      color: white;
    }

    .profile-tab.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 28%;
      right: 28%;
      height: 2px;
      background: white;
    }

    /* =====================================================
       POSTS GRID
    ===================================================== */

    .posts-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      background: #000;
    }

    .post-item {
      position: relative;
      aspect-ratio: 0.75;
      overflow: hidden;
      background: #151515;
      cursor: pointer;
    }

    .post-media {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.25s ease;
    }

    .post-item:hover .post-media {
      transform: scale(1.04);
    }

    .post-video-icon {
      position: absolute;
      right: 8px;
      top: 8px;
      font-size: 17px;
      text-shadow: 0 2px 5px black;
    }

    .post-stats {
      position: absolute;
      left: 8px;
      bottom: 7px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 7px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.55);
      font-size: 12px;
      font-weight: 700;
    }

    .empty-posts {
      min-height: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #888;
      gap: 10px;
      padding: 40px;
      text-align: center;
    }

    .empty-icon {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 2px solid #444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    .empty-title {
      color: white;
      font-size: 17px;
      font-weight: 700;
    }

    /* =====================================================
       BOTTOM NAV
    ===================================================== */

    .bottom-nav {
      position: fixed;
      z-index: 200;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: var(--max-width);
      height: var(--nav-height);
      background: rgba(0, 0, 0, 0.96);
      border-top: 1px solid #252525;
      display: flex;
      align-items: center;
      justify-content: space-around;
      backdrop-filter: blur(18px);
    }

    .nav-item {
      flex: 1;
      height: 100%;
      color: #aaa;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 500;
    }

    .nav-item.active {
      color: white;
    }

    .nav-icon {
      font-size: 23px;
      line-height: 1;
    }

    .create-icon {
      width: 45px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(
        90deg,
        var(--cyan) 0 25%,
        white 25% 75%,
        var(--pink) 75%
      );
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      font-weight: 900;
    }

    /* =====================================================
       LOADING
    ===================================================== */

    .loading {
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid #333;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =====================================================
       MODAL
    ===================================================== */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-width: var(--max-width);
      max-height: 88vh;
      background: #161616;
      border-radius: 18px 18px 0 0;
      overflow-y: auto;
      animation: slideUp 0.22s ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    .modal-head {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #292929;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 800;
    }

    .modal-close {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #282828;
      color: white;
      font-size: 18px;
    }

    .modal-content {
      padding: 18px;
    }

    .upload-label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 7px;
    }

    .upload-input {
      width: 100%;
      padding: 12px;
      background: #222;
      color: white;
      border: 1px solid #333;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .modal-button {
      width: 100%;
      height: 44px;
      border-radius: 6px;
      background: var(--pink);
      color: white;
      font-weight: 700;
    }

    /* =====================================================
       TOAST
    ===================================================== */

    .toast {
      position: fixed;
      z-index: 999;
      left: 50%;
      bottom: 78px;
      transform: translate(-50%, 20px);
      background: #fff;
      color: #000;
      padding: 11px 16px;
      border-radius: 22px;
      font-size: 14px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: 0.25s ease;
      max-width: calc(100% - 40px);
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* =====================================================
       DESKTOP
    ===================================================== */

    @media (min-width: 700px) {
      body {
        background:
          radial-gradient(
            circle at center,
            #151515 0,
            #050505 500px
          );
      }

      .page {
        box-shadow:
          0 0 0 1px #1b1b1b,
          0 0 80px rgba(0, 0, 0, 0.8);
      }

      .bottom-nav {
        border-left: 1px solid #252525;
        border-right: 1px solid #252525;
      }
    }

    @media (max-width: 380px) {
      .stats {
        gap: 19px;
      }

      .profile-actions {
        gap: 5px;
      }

      .action-button {
        padding: 0 12px;
      }

      .display-name {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

<div class="app">
  <main class="page">

    <!-- TOP BAR -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" id="backBtn" aria-label="Back">‹</button>

        <div class="username-title">
          <span id="topUsername">@profile</span>
          <span id="topVerified" class="verified" style="display:none;">✓</span>
        </div>
      </div>

      <div class="topbar-right">
        <button class="icon-btn" id="shareProfileBtn" title="Share">
          ↗
        </button>

        <button class="icon-btn" id="menuBtn" title="Menu">
          ⋮
        </button>
      </div>
    </header>

    <!-- PROFILE COVER -->
    <section class="cover-wrapper">

      <img
        id="coverImage"
        class="cover-image"
        alt="Cover photo"
      />

      <div class="cover-overlay"></div>

      <button
        id="coverEditBtn"
        class="cover-edit"
        title="Change cover photo"
        style="display:none;"
      >
        ✎
      </button>

    </section>

    <!-- PROFILE HEADER -->
    <section class="profile-header">

      <div class="avatar-wrap">

        <img
          id="avatar"
          class="avatar"
          src="/images/default-avatar.png"
          alt="Profile picture"
        />

        <button
          id="avatarEditBtn"
          class="avatar-edit"
          title="Change profile picture"
          style="display:none;"
        >
          ✎
        </button>

      </div>

      <div class="profile-main">

        <h1 class="display-name">
          <span id="displayName">Loading...</span>
          <span id="verifiedBadge" class="verified" style="display:none;">
            ✓
          </span>
        </h1>

        <div class="handle" id="handle">@loading</div>

        <div class="bio" id="bio"></div>

        <a
          id="website"
          class="website"
          href="#"
          target="_blank"
          style="display:none;"
        ></a>

        <!-- STATS -->
        <div class="stats">

          <div class="stat" id="followingStat">
            <span class="stat-number" id="followingCount">0</span>
            <span class="stat-label">Following</span>
          </div>

          <div class="stat" id="followersStat">
            <span class="stat-number" id="followersCount">0</span>
            <span class="stat-label">Followers</span>
          </div>

          <div class="stat">
            <span class="stat-number" id="likesCount">0</span>
            <span class="stat-label">Likes</span>
          </div>

        </div>

        <!-- ACTIONS -->
        <div class="profile-actions">

          <button
            id="followBtn"
            class="action-button follow-btn"
          >
            Follow
          </button>

          <button
            id="editBtn"
            class="action-button edit-btn"
            style="display:none;"
          >
            Edit profile
          </button>

          <button
            id="messageBtn"
            class="action-button edit-btn"
            style="display:none;"
          >
            Message
          </button>

          <button
            id="moreBtn"
            class="action-button more-btn"
          >
            ⋯
          </button>

        </div>

      </div>
    </section>

    <!-- TABS -->
    <nav class="profile-tabs">

      <button
        class="profile-tab active"
        id="postsTab"
        title="Posts"
      >
        ▦
      </button>

      <button
        class="profile-tab"
        id="likedTab"
        title="Liked"
      >
        ♡
      </button>

    </nav>

    <!-- POSTS -->
    <section id="postsContainer">

      <div class="loading" id="loading">
        <div class="spinner"></div>
      </div>

      <div
        class="posts-grid"
        id="postsGrid"
        style="display:none;"
      ></div>

      <div
        class="empty-posts"
        id="emptyPosts"
        style="display:none;"
      >
        <div class="empty-icon">▦</div>

        <div class="empty-title">
          No posts yet
        </div>

        <div>
          When this user posts, their videos and photos will appear here.
        </div>
      </div>

    </section>

  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <button
      class="nav-item"
      onclick="goTo('/feed.html')"
    >
      <span class="nav-icon">⌂</span>
      <span>Home</span>
    </button>

    <button
      class="nav-item"
      onclick="goTo('/feed.html?tab=friends')"
    >
      <span class="nav-icon">♬</span>
      <span>Friends</span>
    </button>

    <button
      class="nav-item"
      onclick="openCreate()"
    >
      <span class="create-icon">+</span>
      <span>Create</span>
    </button>

    <button
      class="nav-item"
      onclick="goTo('/messages.html')"
    >
      <span class="nav-icon">▢</span>
      <span>Inbox</span>
    </button>

    <button
      class="nav-item active"
      onclick="goTo('/profile.html')"
    >
      <span class="nav-icon">○</span>
      <span>Profile</span>
    </button>

  </nav>
</div>


<!-- =====================================================
     EDIT PROFILE MODAL
===================================================== -->

<div class="modal" id="editModal">

  <div class="modal-sheet">

    <div class="modal-head">

      <div class="modal-title">
        Edit profile
      </div>

      <button
        class="modal-close"
        onclick="closeModal('editModal')"
      >
        ×
      </button>

    </div>

    <div class="modal-content">

      <label class="upload-label">
        Profile picture
      </label>

      <input
        class="upload-input"
        type="file"
        id="profilePictureInput"
        accept="image/jpeg,image/png,image/webp,image/gif"
      />

      <label class="upload-label">
        Cover photo
      </label>

      <input
        class="upload-input"
        type="file"
        id="coverPhotoInput"
        accept="image/jpeg,image/png,image/webp,image/gif"
      />

      <button
        class="modal-button"
        id="savePhotosBtn"
      >
        Save photos
      </button>

    </div>

  </div>
</div>


<!-- =====================================================
     MORE MODAL
===================================================== -->

<div class="modal" id="moreModal">

  <div class="modal-sheet">

    <div class="modal-head">

      <div class="modal-title">
        Profile
      </div>

      <button
        class="modal-close"
        onclick="closeModal('moreModal')"
      >
        ×
      </button>

    </div>

    <div class="modal-content">

      <button
        class="modal-button"
        id="verificationBtn"
        style="margin-bottom:10px;"
      >
        ✓ Request verification
      </button>

      <button
        class="modal-button"
        id="logoutBtn"
        style="background:#292929;"
      >
        Log out
      </button>

    </div>

  </div>
</div>


<div class="toast" id="toast"></div>


<script>
  /* =====================================================
     STATE
  ===================================================== */

  let me = null;
  let profile = null;
  let profilePosts = [];

  const params = new URLSearchParams(window.location.search);
  const requestedUsername = params.get("username");


  /* =====================================================
     HELPERS
  ===================================================== */

  function $(id) {
    return document.getElementById(id);
  }

  function escapeHTML(value) {
    if (value === null || value === undefined) return "";

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function formatNumber(number) {
    const n = Number(number || 0);

    if (n >= 1000000) {
      return (n / 1000000).toFixed(n % 1000000 === 0 ? 0 : 1) + "M";
    }

    if (n >= 1000) {
      return (n / 1000).toFixed(n % 1000 === 0 ? 0 : 1) + "K";
    }

    return n.toString();
  }

  function goTo(url) {
    window.location.href = url;
  }

  function showToast(message) {
    const toast = $("toast");

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer = setTimeout(() => {
      toast.classList.remove("show");
    }, 2500);
  }

  function openModal(id) {
    $(id).classList.add("show");
  }

  function closeModal(id) {
    $(id).classList.remove("show");
  }

  function getProfileImage(user) {
    return (
      user?.profilePicture ||
      user?.profileImage ||
      user?.avatar ||
      "/images/default-avatar.png"
    );
  }

  function getCoverImage(user) {
    return (
      user?.coverPhoto ||
      user?.coverImage ||
      user?.cover ||
      ""
    );
  }

  function isVerified(user) {
    return Boolean(
      user?.verified ||
      user?.isVerified ||
      user?.verificationStatus === "approved"
    );
  }

  function postMedia(post) {
    return (
      post?.video ||
      post?.videoUrl ||
      post?.image ||
      post?.imageUrl ||
      ""
    );
  }

  function isVideo(post) {
    const media = postMedia(post);

    if (!media) return false;

    return (
      post?.type === "video" ||
      post?.mediaType === "video" ||
      /\.(mp4|webm|ogg|mov|m4v)(\?|$)/i.test(media)
    );
  }


  /* =====================================================
     API
  ===================================================== */

  async function api(url, options = {}) {

    const response = await fetch(url, {
      credentials: "include",
      ...options,
      headers: {
        ...(options.body instanceof FormData
          ? {}
          : {
              "Content-Type": "application/json"
            }),
        ...(options.headers || {})
      }
    });

    let data = null;

    try {
      data = await response.json();
    } catch {
      data = {};
    }

    if (!response.ok) {
      throw new Error(
        data.message ||
        data.error ||
        `Request failed (${response.status})`
      );
    }

    return data;
  }


  /* =====================================================
     LOAD CURRENT USER
  ===================================================== */

  async function loadMe() {
    try {
      const data = await api("/api/me");

      me = data.user || data;

      return me;

    } catch (error) {

      console.error("Unable to load current user:", error);

      return null;
    }
  }


  /* =====================================================
     LOAD PROFILE
  ===================================================== */

  async function loadProfile() {

    try {

      let username = requestedUsername;

      if (!username) {

        if (!me) {
          await loadMe();
        }

        username = me?.username;
      }

      if (!username) {
        window.location.href = "/login.html";
        return;
      }

      const data = await api(
        `/api/users/${encodeURIComponent(username)}`
      );

      profile = data.user || data.profile || data;

      renderProfile();

      await loadPosts(username);

    } catch (error) {

      console.error("Profile loading error:", error);

      $("loading").innerHTML = `
        <div style="
          text-align:center;
          padding:30px;
          color:#aaa;
        ">
          <div style="
            font-size:40px;
            margin-bottom:10px;
          ">⚠</div>

          <div style="
            color:white;
            font-weight:700;
            margin-bottom:5px;
          ">
            Unable to load profile
          </div>

          <div>
            ${escapeHTML(error.message)}
          </div>
        </div>
      `;
    }
  }


  /* =====================================================
     RENDER PROFILE
  ===================================================== */

  function renderProfile() {

    const username =
      profile.username ||
      requestedUsername ||
      "";

    const name =
      profile.name ||
      username ||
      "User";

    const verified = isVerified(profile);

    document.title =
      `${name} (@${username}) • Pulse Social`;

    $("topUsername").textContent =
      "@" + username;

    $("displayName").textContent =
      name;

    $("handle").textContent =
      "@" + username;

    $("bio").textContent =
      profile.bio || "";

    $("followersCount").textContent =
      formatNumber(profile.followersCount);

    $("followingCount").textContent =
      formatNumber(profile.followingCount);

    /*
      safeUser does not necessarily have a direct
      likes total, so calculate it from posts later.
    */

    $("likesCount").textContent =
      formatNumber(
        profile.likesCount ||
        profile.totalLikes ||
        0
      );

    $("avatar").src =
      getProfileImage(profile);

    const cover =
      getCoverImage(profile);

    if (cover) {

      $("coverImage").src = cover;
      $("coverImage").style.display = "block";

    } else {

      $("coverImage").style.display = "none";
    }

    if (verified) {

      $("verifiedBadge").style.display =
        "inline-flex";

      $("topVerified").style.display =
        "inline-flex";

    } else {

      $("verifiedBadge").style.display =
        "none";

      $("topVerified").style.display =
        "none";
    }

    const website =
      profile.website ||
      profile.link ||
      profile.url;

    if (website) {

      $("website").href =
        website.startsWith("http")
          ? website
          : "https://" + website;

      $("website").textContent =
        website.replace(/^https?:\/\//, "");

      $("website").style.display =
        "inline-block";

    } else {

      $("website").style.display =
        "none";
    }

    const ownProfile =
      me &&
      profile &&
      String(me.id) === String(profile.id);

    if (ownProfile) {

      $("followBtn").style.display =
        "none";

      $("editBtn").style.display =
        "flex";

      $("messageBtn").style.display =
        "none";

      $("avatarEditBtn").style.display =
        "flex";

      $("coverEditBtn").style.display =
        "flex";

    } else {

      $("followBtn").style.display =
        "flex";

      $("editBtn").style.display =
        "none";

      $("messageBtn").style.display =
        "flex";

      $("avatarEditBtn").style.display =
        "none";

      $("coverEditBtn").style.display =
        "none";

      updateFollowButton();
    }
  }


  /* =====================================================
     FOLLOW BUTTON
  ===================================================== */

  function updateFollowButton() {

    const following =
      Boolean(profile?.isFollowing);

    const button =
      $("followBtn");

    if (following) {

      button.textContent =
        "Following";

      button.classList.add(
        "following"
      );

    } else {

      button.textContent =
        "Follow";

      button.classList.remove(
        "following"
      );
    }
  }


  async function toggleFollow() {

    if (!profile?.id) return;

    const button =
      $("followBtn");

    button.disabled = true;

    try {

      const data = await api(
        `/api/users/${profile.id}/follow`,
        {
          method: "POST"
        }
      );

      if (
        typeof data.following === "boolean"
      ) {

        profile.isFollowing =
          data.following;

      } else {

        profile.isFollowing =
          !profile.isFollowing;
      }

      if (profile.isFollowing) {

        profile.followersCount =
          Number(profile.followersCount || 0) + 1;

      } else {

        profile.followersCount =
          Math.max(
            0,
            Number(profile.followersCount || 0) - 1
          );
      }

      $("followersCount").textContent =
        formatNumber(profile.followersCount);

      updateFollowButton();

    } catch (error) {

      showToast(
        error.message ||
        "Unable to update follow"
      );

    } finally {

      button.disabled = false;
    }
  }


  /* =====================================================
     LOAD POSTS
  ===================================================== */

  async function loadPosts(username) {

    try {

      const data = await api(
        `/api/users/${encodeURIComponent(username)}/posts`
      );

      profilePosts =
        data.posts ||
        data ||
        [];

      renderPosts();

    } catch (error) {

      console.error(
        "Unable to load profile posts:",
        error
      );

      $("loading").style.display =
        "none";

      $("postsGrid").style.display =
        "none";

      $("emptyPosts").style.display =
        "flex";

      $("emptyPosts").querySelector(
        ".empty-title"
      ).textContent =
        "Unable to load posts";
    }
  }


  /* =====================================================
     RENDER POSTS
  ===================================================== */

  function renderPosts() {

    $("loading").style.display =
      "none";

    const grid =
      $("postsGrid");

    grid.innerHTML = "";

    if (!profilePosts.length) {

      grid.style.display =
        "none";

      $("emptyPosts").style.display =
        "flex";

      return;
    }

    $("emptyPosts").style.display =
      "none";

    grid.style.display =
      "grid";

    let totalLikes = 0;

    profilePosts.forEach(post => {

      totalLikes += Number(
        post.likesCount ||
        post.likeCount ||
        0
      );

      const item =
        document.createElement("div");

      item.className =
        "post-item";

      const media =
        postMedia(post);

      const video =
        isVideo(post);

      if (media) {

        if (video) {

          item.innerHTML = `
            <video
              class="post-media"
              src="${escapeHTML(media)}"
              muted
              playsinline
              preload="metadata"
            ></video>

            <div class="post-video-icon">
              ▶
            </div>

            <div class="post-stats">
              ♥
              ${formatNumber(
                post.likesCount ||
                post.likeCount ||
                0
              )}
            </div>
          `;

        } else {

          item.innerHTML = `
            <img
              class="post-media"
              src="${escapeHTML(media)}"
              alt="Post"
              loading="lazy"
            />

            <div class="post-stats">
              ♥
              ${formatNumber(
                post.likesCount ||
                post.likeCount ||
                0
              )}
            </div>
          `;
        }

      } else {

        item.innerHTML = `
          <div style="
            width:100%;
            height:100%;
            padding:14px;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            background:
              linear-gradient(
                135deg,
                #151515,
                #272727
              );
            font-size:14px;
            line-height:1.45;
            color:#eee;
          ">
            ${escapeHTML(
              post.text ||
              post.caption ||
              "Post"
            )}
          </div>

          <div class="post-stats">
            ♥
            ${formatNumber(
              post.likesCount ||
              post.likeCount ||
              0
            )}
          </div>
        `;
      }

      item.addEventListener(
        "click",
        () => openPost(post)
      );

      grid.appendChild(item);
    });

    if (
      !profile.likesCount &&
      !profile.totalLikes
    ) {

      $("likesCount").textContent =
        formatNumber(totalLikes);
    }
  }


  /* =====================================================
     OPEN POST
  ===================================================== */

  function openPost(post) {

    /*
      Open the main feed with the selected
      post when possible.
    */

    if (post.id) {

      window.location.href =
        `/feed.html?post=${encodeURIComponent(post.id)}`;

    } else {

      window.location.href =
        "/feed.html";
    }
  }


  /* =====================================================
     EDIT PHOTOS
  ===================================================== */

  async function uploadProfilePicture(file) {

    if (!file) return;

    const formData =
      new FormData();

    formData.append(
      "profilePicture",
      file
    );

    await api(
      "/api/profile/picture",
      {
        method: "POST",
        body: formData
      }
    );
  }


  async function uploadCover(file) {

    if (!file) return;

    const formData =
      new FormData();

    formData.append(
      "coverPhoto",
      file
    );

    await api(
      "/api/profile/cover",
      {
        method: "POST",
        body: formData
      }
    );
  }


  async function savePhotos() {

    const profileFile =
      $("profilePictureInput").files[0];

    const coverFile =
      $("coverPhotoInput").files[0];

    if (!profileFile && !coverFile) {

      showToast(
        "Choose a profile or cover photo first"
      );

      return;
    }

    const button =
      $("savePhotosBtn");

    button.disabled = true;
    button.textContent =
      "Saving...";

    try {

      if (profileFile) {
        await uploadProfilePicture(
          profileFile
        );
      }

      if (coverFile) {
        await uploadCover(
          coverFile
        );
      }

      showToast(
        "Profile updated"
      );

      closeModal("editModal");

      await loadMe();
      await loadProfile();

    } catch (error) {

      console.error(error);

      showToast(
        error.message ||
        "Unable to update profile"
      );

    } finally {

      button.disabled = false;
      button.textContent =
        "Save photos";
    }
  }


  /* =====================================================
     SHARE PROFILE
  ===================================================== */

  async function shareProfile() {

    const username =
      profile?.username ||
      requestedUsername ||
      "";

    const shareUrl =
      `${window.location.origin}/profile.html?username=${encodeURIComponent(username)}`;

    const shareData = {
      title:
        `${profile?.name || username} on Pulse Social`,
      text:
        `Check out @${username} on Pulse Social.`,
      url: shareUrl
    };

    try {

      if (
        navigator.share &&
        typeof navigator.share === "function"
      ) {

        await navigator.share(
          shareData
        );

      } else {

        await navigator.clipboard.writeText(
          shareUrl
        );

        showToast(
          "Profile link copied"
        );
      }

    } catch (error) {

      if (
        error?.name !==
        "AbortError"
      ) {

        try {

          await navigator.clipboard.writeText(
            shareUrl
          );

          showToast(
            "Profile link copied"
          );

        } catch {
          showToast(
            "Unable to share profile"
          );
        }
      }
    }
  }


  /* =====================================================
     MESSAGE
  ===================================================== */

  function messageUser() {

    if (!profile?.id) return;

    window.location.href =
      `/messages.html?user=${encodeURIComponent(profile.id)}`;
  }


  /* =====================================================
     VERIFICATION
  ===================================================== */

  async function requestVerification() {

    closeModal("moreModal");

    try {

      window.location.href =
        "/verification.html";

    } catch {

      showToast(
        "Unable to open verification"
      );
    }
  }


  /* =====================================================
     LOGOUT
  ===================================================== */

  async function logout() {

    try {

      await api(
        "/api/logout",
        {
          method: "POST"
        }
      );

      window.location.href =
        "/login.html";

    } catch (error) {

      showToast(
        error.message ||
        "Unable to log out"
      );
    }
  }


  /* =====================================================
     CREATE
  ===================================================== */

  function openCreate() {

    /*
      The new TikTok-style feed owns the
      Create flow.
    */

    window.location.href =
      "/feed.html?create=1";
  }


  /* =====================================================
     EVENT LISTENERS
  ===================================================== */

  $("backBtn").addEventListener(
    "click",
    () => {

      if (
        window.history.length > 1
      ) {

        window.history.back();

      } else {

        window.location.href =
          "/feed.html";
      }
    }
  );


  $("followBtn").addEventListener(
    "click",
    toggleFollow
  );


  $("editBtn").addEventListener(
    "click",
    () => openModal("editModal")
  );


  $("messageBtn").addEventListener(
    "click",
    messageUser
  );


  $("shareProfileBtn").addEventListener(
    "click",
    shareProfile
  );


  $("menuBtn").addEventListener(
    "click",
    () => openModal("moreModal")
  );


  $("moreBtn").addEventListener(
    "click",
    () => openModal("moreModal")
  );


  $("avatarEditBtn").addEventListener(
    "click",
    () => openModal("editModal")
  );


  $("coverEditBtn").addEventListener(
    "click",
    () => openModal("editModal")
  );


  $("savePhotosBtn").addEventListener(
    "click",
    savePhotos
  );


  $("verificationBtn").addEventListener(
    "click",
    requestVerification
  );


  $("logoutBtn").addEventListener(
    "click",
    logout
  );


  $("followersStat").addEventListener(
    "click",
    () => {

      if (!profile?.username) return;

      window.location.href =
        `/profile.html?username=${encodeURIComponent(profile.username)}&tab=followers`;
    }
  );


  $("followingStat").addEventListener(
    "click",
    () => {

      if (!profile?.username) return;

      window.location.href =
        `/profile.html?username=${encodeURIComponent(profile.username)}&tab=following`;
    }
  );


  /* =====================================================
     CLOSE MODALS WHEN CLICKING OUTSIDE
  ===================================================== */

  document.querySelectorAll(".modal")
    .forEach(modal => {

      modal.addEventListener(
        "click",
        event => {

          if (
            event.target === modal
          ) {

            modal.classList.remove(
              "show"
            );
          }
        }
      );
    });


  /* =====================================================
     ESCAPE KEY
  ===================================================== */

  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Escape"
      ) {

        document
          .querySelectorAll(".modal.show")
          .forEach(modal => {
            modal.classList.remove(
              "show"
            );
          });
      }
    }
  );


  /* =====================================================
     INITIALIZE
  ===================================================== */

  async function init() {

    try {

      await loadMe();

      if (!me) {

        window.location.href =
          "/login.html";

        return;
      }

      await loadProfile();

    } catch (error) {

      console.error(
        "Profile initialization error:",
        error
      );
    }
  }

  init();

</script>

</body>
</html>
