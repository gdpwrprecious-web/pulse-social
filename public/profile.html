<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pulse Social - Profile</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue: #1877f2;
      --bg: #f0f2f5;
      --white: #fff;
      --text: #050505;
      --muted: #65676b;
      --border: #dddfe2;
      --hover: #e4e6eb;
      --green: #42b72a;
    }

    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* HEADER */

    .topbar {
      height: 64px;
      background: white;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      padding: 0 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
    }

    .topbar-inner {
      width: 100%;
      max-width: 1400px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 42px;
      height: 42px;
      background: var(--blue);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 24px;
    }

    .brand {
      color: var(--blue);
      font-size: 24px;
      font-weight: 800;
    }

    .search {
      width: 250px;
      height: 42px;
      border: none;
      outline: none;
      background: #f0f2f5;
      border-radius: 22px;
      padding: 0 16px;
    }

    .top-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-btn {
      width: 42px;
      height: 42px;
      border: none;
      background: #e4e6eb;
      border-radius: 50%;
      font-size: 19px;
    }

    .top-avatar {
      width: 42px;
      height: 42px;
      object-fit: cover;
      border-radius: 50%;
    }

    /* PROFILE */

    .profile-page {
      width: 100%;
      max-width: 1100px;
      margin: auto;
    }

    .profile-header {
      background: white;
      box-shadow: 0 1px 2px rgba(0,0,0,.2);
      margin-bottom: 18px;
    }

    .cover {
      height: 370px;
      background:
        linear-gradient(
          135deg,
          #d8e4f0,
          #b8c7d9
        );
      position: relative;
      overflow: hidden;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cover-edit {
      position: absolute;
      right: 22px;
      bottom: 20px;
      background: white;
      border: none;
      padding: 10px 14px;
      border-radius: 7px;
      font-weight: 700;
      box-shadow: 0 1px 4px rgba(0,0,0,.2);
    }

    .profile-info {
      position: relative;
      padding: 0 28px 20px;
    }

    .profile-picture-wrap {
      position: relative;
      margin-top: -90px;
      width: 180px;
    }

    .profile-picture {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      border: 6px solid white;
      background: white;
    }

    .picture-edit {
      position: absolute;
      right: 8px;
      bottom: 14px;
      width: 42px;
      height: 42px;
      border: 3px solid white;
      border-radius: 50%;
      background: #e4e6eb;
      font-size: 18px;
    }

    .profile-main {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-top: -25px;
      margin-left: 200px;
    }

    .profile-name {
      font-size: 32px;
      font-weight: 800;
    }

    .verified {
      color: var(--blue);
      font-size: 18px;
    }

    .username {
      color: var(--muted);
      margin-top: 4px;
    }

    .bio {
      margin-top: 12px;
      max-width: 650px;
      line-height: 1.45;
    }

    .website {
      display: inline-block;
      margin-top: 8px;
      color: var(--blue);
      font-weight: 600;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action {
      border: none;
      border-radius: 7px;
      padding: 10px 16px;
      font-weight: 700;
      background: #e4e6eb;
    }

    .action.primary {
      color: white;
      background: var(--blue);
    }

    .action:hover {
      filter: brightness(.97);
    }

    .profile-nav {
      border-top: 1px solid var(--border);
      margin-top: 20px;
      display: flex;
      gap: 5px;
      overflow-x: auto;
    }

    .profile-nav button {
      border: none;
      background: transparent;
      padding: 15px 20px;
      color: var(--muted);
      font-weight: 700;
      font-size: 15px;
    }

    .profile-nav button.active {
      color: var(--blue);
      border-bottom: 3px solid var(--blue);
    }

    /* BODY */

    .profile-body {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px;
      align-items: start;
    }

    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 1px 2px rgba(0,0,0,.2);
      overflow: hidden;
      margin-bottom: 18px;
    }

    .card-header {
      padding: 16px 18px 8px;
      font-size: 20px;
      font-weight: 800;
    }

    .intro {
      padding: 8px 18px 18px;
    }

    .intro-text {
      color: #333;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .intro-row {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 9px 0;
      color: #444;
    }

    .intro-icon {
      width: 28px;
      font-size: 20px;
      text-align: center;
    }

    .friends-preview {
      padding: 8px 12px 16px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .friend {
      overflow: hidden;
      border-radius: 7px;
      background: #f0f2f5;
    }

    .friend img {
      width: 100%;
      height: 90px;
      object-fit: cover;
    }

    .friend-name {
      padding: 7px;
      font-size: 12px;
      font-weight: 700;
    }

    /* CREATE */

    .create-post {
      padding: 14px 16px 10px;
    }

    .create-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .create-row img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
    }

    .fake-input {
      flex: 1;
      background: #f0f2f5;
      border-radius: 22px;
      padding: 12px 16px;
      color: var(--muted);
      cursor: pointer;
    }

    .create-actions {
      border-top: 1px solid var(--border);
      margin-top: 12px;
      padding-top: 8px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }

    .create-actions button {
      border: none;
      background: transparent;
      padding: 10px;
      border-radius: 7px;
      color: var(--muted);
      font-weight: 700;
    }

    .create-actions button:hover {
      background: #f0f2f5;
    }

    /* POSTS */

    .post-header {
      display: flex;
      gap: 10px;
      padding: 14px 16px 6px;
    }

    .post-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
    }

    .post-author {
      font-weight: 700;
    }

    .post-time {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .post-text {
      padding: 8px 16px 14px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .post-media {
      width: 100%;
      max-height: 650px;
      object-fit: cover;
      display: block;
      background: black;
    }

    .post-video {
      width: 100%;
      max-height: 650px;
      display: block;
      background: black;
    }

    .post-stats {
      padding: 9px 16px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      font-size: 13px;
    }

    .post-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--border);
      padding: 3px 8px;
    }

    .post-actions button {
      border: none;
      background: transparent;
      padding: 10px;
      color: var(--muted);
      font-weight: 700;
      border-radius: 7px;
    }

    .post-actions button:hover {
      background: #f0f2f5;
    }

    .liked {
      color: var(--blue) !important;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 3000;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: min(520px, 100%);
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    .modal-head {
      padding: 15px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }

    .modal-head button {
      border: none;
      background: #e4e6eb;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 20px;
    }

    .modal-body {
      padding: 15px;
    }

    .modal-body textarea {
      width: 100%;
      min-height: 150px;
      border: none;
      outline: none;
      resize: vertical;
      font-size: 19px;
      margin-bottom: 10px;
    }

    .modal-body input {
      width: 100%;
      margin-bottom: 12px;
    }

    .publish {
      width: 100%;
      border: none;
      background: var(--blue);
      color: white;
      padding: 12px;
      border-radius: 7px;
      font-weight: 700;
    }

    /* MOBILE NAV */

    .mobile-nav {
      display: none;
    }

    @media (max-width: 800px) {
      .profile-page {
        width: 100%;
      }

      .cover {
        height: 230px;
      }

      .profile-info {
        padding: 0 15px 15px;
      }

      .profile-picture-wrap {
        width: 130px;
        margin-top: -65px;
      }

      .profile-picture {
        width: 130px;
        height: 130px;
      }

      .profile-main {
        margin: 5px 0 0;
        display: block;
      }

      .profile-name {
        font-size: 26px;
      }

      .actions {
        margin-top: 14px;
      }

      .profile-nav {
        margin-top: 15px;
      }

      .profile-nav button {
        padding: 13px 14px;
      }

      .profile-body {
        display: block;
      }

      .left-column {
        display: block;
      }

      .topbar {
        height: 58px;
        padding: 0 10px;
      }

      .brand {
        display: none;
      }

      .search {
        flex: 1;
        width: auto;
      }

      .top-actions .top-btn {
        display: none;
      }

      .mobile-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 62px;
        background: white;
        border-top: 1px solid var(--border);
        z-index: 2000;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
      }

      .mobile-nav button {
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }

      .mobile-nav span {
        display: block;
        font-size: 20px;
      }

      body {
        padding-bottom: 62px;
      }
    }
  </style>
</head>

<body>

<header class="topbar">

  <div class="topbar-inner">

    <a
      class="logo"
      href="/feed.html"
    >
      P
    </a>

    <a
      class="brand"
      href="/feed.html"
    >
      Pulse
    </a>

    <input
      class="search"
      id="searchInput"
      placeholder="Search Pulse"
    >

    <div class="top-actions">

      <button
        class="top-btn"
        onclick="location.href='/messages.html'"
      >
        💬
      </button>

      <button
        class="top-btn"
        onclick="location.href='/notifications.html'"
      >
        🔔
      </button>

      <img
        id="topAvatar"
        class="top-avatar"
        src="/images/default-avatar.png"
        alt=""
      >

    </div>

  </div>

</header>

<main class="profile-page">

  <section class="profile-header">

    <div class="cover">

      <img
        id="coverImage"
        src=""
        alt="Cover photo"
      >

      <button
        id="coverButton"
        class="cover-edit"
        onclick="changeCover()"
      >
        📷 Edit cover photo
      </button>

    </div>

    <div class="profile-info">

      <div class="profile-picture-wrap">

        <img
          id="profilePicture"
          class="profile-picture"
          src="/images/default-avatar.png"
          alt=""
        >

        <button
          id="pictureButton"
          class="picture-edit"
          onclick="changeProfilePicture()"
        >
          📷
        </button>

      </div>

      <div class="profile-main">

        <div>

          <div
            id="profileName"
            class="profile-name"
          >
            Loading...
          </div>

          <div
            id="username"
            class="username"
          >
            @username
          </div>

          <div
            id="bio"
            class="bio"
          ></div>

          <a
            id="website"
            class="website"
            href="#"
            target="_blank"
            style="display:none"
          ></a>

        </div>

        <div
          id="actions"
          class="actions"
        ></div>

      </div>

      <nav class="profile-nav">

        <button
          class="active"
          onclick="switchTab('posts', this)"
        >
          Posts
        </button>

        <button
          onclick="switchTab('about', this)"
        >
          About
        </button>

        <button
          onclick="switchTab('friends', this)"
        >
          Friends
        </button>

        <button
          onclick="switchTab('photos', this)"
        >
          Photos
        </button>

        <button
          onclick="switchTab('videos', this)"
        >
          Videos
        </button>

        <button
          onclick="switchTab('more', this)"
        >
          More
        </button>

      </nav>

    </div>

  </section>

  <section class="profile-body">

    <div class="left-column">

      <div class="card">

        <div class="card-header">
          Intro
        </div>

        <div class="intro">

          <div
            id="introBio"
            class="intro-text"
          >
            No bio yet.
          </div>

          <div class="intro-row">
            <span class="intro-icon">
              👤
            </span>

            <span>
              Pulse Social member
            </span>
          </div>

          <div
            id="websiteRow"
            class="intro-row"
            style="display:none"
          >
            <span class="intro-icon">
              🔗
            </span>

            <a
              id="introWebsite"
              href="#"
              target="_blank"
              style="color:#1877f2"
            ></a>
          </div>

          <div class="intro-row">
            <span class="intro-icon">
              📅
            </span>

            <span id="joinedDate">
              Joined Pulse Social
            </span>
          </div>

        </div>

      </div>

      <div class="card">

        <div class="card-header">
          Friends
        </div>

        <div
          id="friendsPreview"
          class="friends-preview"
        >
          Loading...
        </div>

      </div>

    </div>

    <div class="right-column">

      <div
        id="createCard"
        class="card create-post"
      >

        <div class="create-row">

          <img
            id="createAvatar"
            src="/images/default-avatar.png"
            alt=""
          >

          <div
            class="fake-input"
            onclick="openPostModal()"
          >
            What's on your mind?
          </div>

        </div>

        <div class="create-actions">

          <button
            onclick="openPostModal()"
          >
            🔴 Live Video
          </button>

          <button
            onclick="openPostModal()"
          >
            🖼️ Photo/Video
          </button>

          <button
            onclick="openPostModal()"
          >
            😊 Feeling
          </button>

        </div>

      </div>

      <div id="posts"></div>

    </div>

  </section>

</main>

<nav class="mobile-nav">

  <button onclick="location.href='/feed.html'">
    <span>🏠</span>
    Home
  </button>

  <button>
    <span>👥</span>
    Friends
  </button>

  <button onclick="openPostModal()">
    <span>➕</span>
    Create
  </button>

  <button onclick="location.href='/messages.html'">
    <span>💬</span>
    Inbox
  </button>

  <button class="active">
    <span>👤</span>
    Profile
  </button>

</nav>

<!-- POST MODAL -->

<div
  id="postModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-head">

      <h2>
        Create post
      </h2>

      <button
        onclick="closePostModal()"
      >
        ×
      </button>

    </div>

    <div class="modal-body">

      <textarea
        id="postText"
        placeholder="What's on your mind?"
      ></textarea>

      <input
        id="postMedia"
        type="file"
        accept="image/*,video/*"
      >

      <button
        class="publish"
        onclick="publishPost()"
      >
        Post
      </button>

    </div>

  </div>

</div>

<script>
  let currentUser = null;
  let profileUser = null;

  const params =
    new URLSearchParams(
      location.search
    );

  const requestedUsername =
    params.get("username");

  async function api(
    url,
    options = {}
  ) {
    const response =
      await fetch(
        url,
        {
          credentials: "include",
          ...options
        }
      );

    const data =
      await response.json()
        .catch(() => ({}));

    if (!response.ok) {
      throw new Error(
        data.message ||
        "Request failed."
      );
    }

    return data;
  }

  function escapeHtml(value) {
    return String(value || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function avatar(user) {
    return (
      user?.profilePicture ||
      user?.profileImage ||
      user?.avatar ||
      "/images/default-avatar.png"
    );
  }

  function isVerified(user) {
    return (
      user?.verified ||
      user?.isVerified
    );
  }

  function timeAgo(date) {
    const seconds =
      Math.floor(
        (Date.now() -
          new Date(date).getTime()) /
        1000
      );

    if (seconds < 60)
      return "Just now";

    const minutes =
      Math.floor(seconds / 60);

    if (minutes < 60)
      return `${minutes}m`;

    const hours =
      Math.floor(minutes / 60);

    if (hours < 24)
      return `${hours}h`;

    const days =
      Math.floor(hours / 24);

    if (days < 7)
      return `${days}d`;

    return new Date(date)
      .toLocaleDateString();
  }

  async function loadMe() {
    const data =
      await api("/api/me");

    if (!data.authenticated) {
      location.href =
        "/login.html";

      return;
    }

    currentUser =
      data.user;

    document
      .getElementById(
        "topAvatar"
      )
      .src =
      avatar(currentUser);
  }

  async function loadProfile() {
    let data;

    if (requestedUsername) {
      data =
        await api(
          `/api/users/${encodeURIComponent(
            requestedUsername
          )}`
        );

      profileUser =
        data.user;
    } else {
      profileUser =
        currentUser;
    }

    if (!profileUser) {
      location.href =
        "/feed.html";

      return;
    }

    renderProfile();

    await loadPosts();

    await loadFriends();
  }

  function renderProfile() {
    const user =
      profileUser;

    document.title =
      `${user.name || user.username} - Pulse Social`;

    document
      .getElementById(
        "profileName"
      )
      .innerHTML =
      `${escapeHtml(
        user.name ||
        user.username
      )}
      ${
        isVerified(user)
          ? '<span class="verified">✔</span>'
          : ""
      }`;

    document
      .getElementById(
        "username"
      )
      .textContent =
      `@${user.username}`;

    document
      .getElementById(
        "profilePicture"
      )
      .src =
      avatar(user);

    document
      .getElementById(
        "createAvatar"
      )
      .src =
      avatar(currentUser);

    const cover =
      user.coverPhoto ||
      user.coverImage ||
      user.cover;

    const coverImage =
      document.getElementById(
        "coverImage"
      );

    if (cover) {
      coverImage.src =
        cover;
    } else {
      coverImage.src =
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`
          <svg xmlns="http://www.w3.org/2000/svg"
            width="1200"
            height="400">
            <defs>
              <linearGradient
                id="g"
                x1="0"
                y1="0"
                x2="1"
                y2="1">
                <stop
                  offset="0%"
                  stop-color="#1877f2"/>
                <stop
                  offset="100%"
                  stop-color="#6ca9ff"/>
              </linearGradient>
            </defs>
            <rect
              width="100%"
              height="100%"
              fill="url(#g)"/>
          </svg>
        `);
    }

    document
      .getElementById(
        "bio"
      )
      .textContent =
      user.bio || "";

    document
      .getElementById(
        "introBio"
      )
      .textContent =
      user.bio ||
      "No bio yet.";

    if (user.website) {
      const website =
        document.getElementById(
          "website"
        );

      website.style.display =
        "inline-block";

      website.href =
        user.website.startsWith("http")
          ? user.website
          : `https://${user.website}`;

      website.textContent =
        user.website;

      document
        .getElementById(
          "websiteRow"
        )
        .style.display =
        "flex";

      document
        .getElementById(
          "introWebsite"
        ).href =
        website.href;

      document
        .getElementById(
          "introWebsite"
        ).textContent =
        user.website;
    }

    if (user.createdAt) {
      document
        .getElementById(
          "joinedDate"
        )
        .textContent =
        `Joined ${
          new Date(
            user.createdAt
          ).toLocaleDateString(
            undefined,
            {
              month: "long",
              year: "numeric"
            }
          )
        }`;
    }

    const actions =
      document.getElementById(
        "actions"
      );

    const isMe =
      String(user.id) ===
      String(currentUser.id);

    if (isMe) {
      actions.innerHTML = `
        <button
          class="action primary"
          onclick="editProfile()"
        >
          ✏️ Edit profile
        </button>

        <button
          class="action"
          onclick="changeCover()"
        >
          📷 Edit cover
        </button>
      `;

      document
        .getElementById(
          "pictureButton"
        )
        .style.display =
        "block";

      document
        .getElementById(
          "coverButton"
        )
        .style.display =
        "block";

      document
        .getElementById(
          "createCard"
        )
        .style.display =
        "block";
    } else {
      actions.innerHTML = `
        <button
          id="followButton"
          class="action primary"
          onclick="toggleFollow()"
        >
          ${
            user.isFollowing
              ? "Following"
              : "Follow"
          }
        </button>

        <button
          class="action"
          onclick="messageUser()"
        >
          💬 Message
        </button>

        <button
          class="action"
          onclick="shareProfile()"
        >
          ↗ Share
        </button>
      `;

      document
        .getElementById(
          "pictureButton"
        )
        .style.display =
        "none";

      document
        .getElementById(
          "coverButton"
        )
        .style.display =
        "none";

      document
        .getElementById(
          "createCard"
        )
        .style.display =
        "none";
    }
  }

  async function loadPosts() {
    const container =
      document.getElementById(
        "posts"
      );

    container.innerHTML = `
      <div class="card" style="padding:25px;text-align:center">
        Loading posts...
      </div>
    `;

    try {
      const data =
        await api(
          `/api/users/${encodeURIComponent(
            profileUser.username
          )}/posts`
        );

      const posts =
        data.posts || [];

      if (!posts.length) {
        container.innerHTML = `
          <div
            class="card"
            style="padding:35px;text-align:center"
          >
            <h3>
              No posts yet
            </h3>

            <p style="color:#65676b;margin-top:8px">
              ${
                String(profileUser.id) ===
                String(currentUser.id)
                  ? "Create your first post."
                  : "This user hasn't posted anything yet."
              }
            </p>
          </div>
        `;

        return;
      }

      container.innerHTML =
        posts
          .map(renderPost)
          .join("");
    } catch (error) {
      container.innerHTML = `
        <div
          class="card"
          style="padding:25px;color:#d00"
        >
          ${escapeHtml(
            error.message
          )}
        </div>
      `;
    }
  }

  function renderPost(post) {
    const author =
      post.author ||
      post.user ||
      profileUser;

    let media = "";

    if (
      post.video ||
      post.videoUrl
    ) {
      media = `
        <video
          class="post-video"
          src="${escapeHtml(
            post.video ||
            post.videoUrl
          )}"
          controls
          preload="metadata"
        ></video>
      `;
    } else if (
      post.image ||
      post.imageUrl
    ) {
      media = `
        <img
          class="post-media"
          src="${escapeHtml(
            post.image ||
            post.imageUrl
          )}"
          alt=""
        >
      `;
    }

    return `
      <article
        class="card"
        data-post-id="${escapeHtml(
          post.id
        )}"
      >

        <div class="post-header">

          <img
            class="post-avatar"
            src="${escapeHtml(
              avatar(author)
            )}"
            alt=""
          >

          <div>

            <div class="post-author">

              ${escapeHtml(
                author.name ||
                author.username
              )}

              ${
                isVerified(author)
                  ? '<span class="verified">✔</span>'
                  : ""
              }

            </div>

            <div class="post-time">
              ${timeAgo(
                post.createdAt
              )} · 🌎
            </div>

          </div>

        </div>

        ${
          post.content ||
          post.caption
            ? `
              <div class="post-text">
                ${escapeHtml(
                  post.content ||
                  post.caption
                )}
              </div>
            `
            : ""
        }

        ${media}

        <div class="post-stats">

          <span>
            👍
            ${post.likesCount || 0}
          </span>

          <span>
            ${post.commentsCount || 0}
            comments
          </span>

        </div>

        <div class="post-actions">

          <button
            class="${
              post.liked
                ? "liked"
                : ""
            }"
            onclick="likePost(
              '${post.id}',
              this
            )"
          >
            👍 Like
          </button>

          <button
            onclick="commentPost(
              '${post.id}'
            )"
          >
            💬 Comment
          </button>

          <button
            onclick="sharePost(
              '${post.id}'
            )"
          >
            ↗ Share
          </button>

        </div>

      </article>
    `;
  }

  async function likePost(
    postId,
    button
  ) {
    try {
      const data =
        await api(
          `/api/posts/${postId}/like`,
          {
            method: "POST"
          }
        );

      button.classList.toggle(
        "liked",
        data.liked
      );

      const card =
        button.closest(".card");

      const stats =
        card.querySelector(
          ".post-stats span"
        );

      stats.textContent =
        `👍 ${data.likesCount || 0}`;
    } catch (error) {
      alert(error.message);
    }
  }

  async function commentPost(
    postId
  ) {
    const text =
      prompt(
        "Write a comment:"
      );

    if (!text?.trim()) {
      return;
    }

    try {
      await api(
        `/api/posts/${postId}/comments`,
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body: JSON.stringify({
            text: text.trim()
          })
        }
      );

      await loadPosts();
    } catch (error) {
      alert(error.message);
    }
  }

  async function sharePost(
    postId
  ) {
    const url =
      `${location.origin}/feed.html?post=${encodeURIComponent(
        postId
      )}`;

    if (
      navigator.share
    ) {
      await navigator.share({
        title:
          "Pulse Social",
        url
      }).catch(() => {});
    } else {
      await navigator.clipboard.writeText(
        url
      );

      alert(
        "Post link copied."
      );
    }
  }

  async function toggleFollow() {
    try {
      const data =
        await api(
          `/api/users/${profileUser.id}/follow`,
          {
            method: "POST"
          }
        );

      profileUser.isFollowing =
        data.following;

      const button =
        document.getElementById(
          "followButton"
        );

      button.textContent =
        data.following
          ? "Following"
          : "Follow";
    } catch (error) {
      alert(error.message);
    }
  }

  function messageUser() {
    location.href =
      `/messages.html?user=${encodeURIComponent(
        profileUser.id
      )}`;
  }

  async function shareProfile() {
    const url =
      location.href;

    if (
      navigator.share
    ) {
      await navigator.share({
        title:
          `${profileUser.name} on Pulse Social`,
        url
      }).catch(() => {});
    } else {
      await navigator.clipboard.writeText(
        url
      );

      alert(
        "Profile link copied."
      );
    }
  }

  async function loadFriends() {
    const container =
      document.getElementById(
        "friendsPreview"
      );

    try {
      const data =
        await api(
          `/api/users/${profileUser.id}/followers`
        );

      const friends =
        (data.users || [])
          .slice(0, 6);

      if (!friends.length) {
        container.innerHTML = `
          <div
            style="
              grid-column:1/-1;
              color:#65676b;
              padding:10px;
              text-align:center;
            "
          >
            No followers yet.
          </div>
        `;

        return;
      }

      container.innerHTML =
        friends
          .map(
            (user) => `
              <a
                class="friend"
                href="/profile.html?username=${encodeURIComponent(
                  user.username
                )}"
              >

                <img
                  src="${escapeHtml(
                    avatar(user)
                  )}"
                  alt=""
                >

                <div class="friend-name">
                  ${escapeHtml(
                    user.name ||
                    user.username
                  )}
                </div>

              </a>
            `
          )
          .join("");
    } catch {
      container.innerHTML =
        "Unable to load friends.";
    }
  }

  function switchTab(
    tab,
    button
  ) {
    document
      .querySelectorAll(
        ".profile-nav button"
      )
      .forEach(
        (btn) =>
          btn.classList.remove(
            "active"
          )
      );

    button.classList.add(
      "active"
    );

    if (
      tab === "posts"
    ) {
      loadPosts();
      return;
    }

    if (
      tab === "friends"
    ) {
      loadFriends();
      return;
    }

    if (
      tab === "about"
    ) {
      alert(
        `About ${profileUser.name || profileUser.username}\n\n${profileUser.bio || "No bio yet."}`
      );

      return;
    }

    if (
      tab === "photos"
    ) {
      alert(
        "Photos are displayed through the user's posts."
      );

      return;
    }

    if (
      tab === "videos"
    ) {
      alert(
        "Videos are displayed through the user's posts."
      );

      return;
    }

    if (
      tab === "more"
    ) {
      shareProfile();
    }
  }

  function changeProfilePicture() {
    const input =
      document.createElement(
        "input"
      );

    input.type =
      "file";

    input.accept =
      "image/*";

    input.onchange =
      async function () {
        const file =
          input.files[0];

        if (!file) return;

        const form =
          new FormData();

        form.append(
          "profilePicture",
          file
        );

        try {
          const data =
            await api(
              "/api/profile/picture",
              {
                method: "POST",
                body: form
              }
            );

          currentUser =
            data.user;

          if (
            String(profileUser.id) ===
            String(currentUser.id)
          ) {
            profileUser =
              data.user;
          }

          renderProfile();

          alert(
            "Profile picture updated."
          );
        } catch (error) {
          alert(
            error.message
          );
        }
      };

    input.click();
  }

  function changeCover() {
    const input =
      document.createElement(
        "input"
      );

    input.type =
      "file";

    input.accept =
      "image/*";

    input.onchange =
      async function () {
        const file =
          input.files[0];

        if (!file) return;

        const form =
          new FormData();

        form.append(
          "coverPhoto",
          file
        );

        try {
          const data =
            await api(
              "/api/profile/cover",
              {
                method: "POST",
                body: form
              }
            );

          profileUser =
            data.user;

          if (
            String(currentUser.id) ===
            String(profileUser.id)
          ) {
            currentUser =
              data.user;
          }

          renderProfile();

          alert(
            "Cover photo updated."
          );
        } catch (error) {
          alert(
            error.message
          );
        }
      };

    input.click();
  }

  async function editProfile() {
    const name =
      prompt(
        "Your name:",
        profileUser.name || ""
      );

    if (
      name === null
    ) {
      return;
    }

    const bio =
      prompt(
        "Your bio:",
        profileUser.bio || ""
      );

    if (
      bio === null
    ) {
      return;
    }

    const website =
      prompt(
        "Website:",
        profileUser.website || ""
      );

    try {
      const data =
        await api(
          "/api/profile",
          {
            method: "PUT",
            headers: {
              "Content-Type":
                "application/json"
            },
            body: JSON.stringify({
              name,
              bio,
              website
            })
          }
        );

      profileUser =
        data.user;

      currentUser =
        data.user;

      renderProfile();
    } catch (error) {
      alert(
        error.message
      );
    }
  }

  function openPostModal() {
    document
      .getElementById(
        "postModal"
      )
      .classList.add(
        "show"
      );
  }

  function closePostModal() {
    document
      .getElementById(
        "postModal"
      )
      .classList.remove(
        "show"
      );

    document
      .getElementById(
        "postText"
      ).value = "";

    document
      .getElementById(
        "postMedia"
      ).value = "";
  }

  async function publishPost() {
    const text =
      document
        .getElementById(
          "postText"
        )
        .value.trim();

    const media =
      document
        .getElementById(
          "postMedia"
        ).files[0];

    if (!text && !media) {
      alert(
        "Write something or select media."
      );

      return;
    }

    const form =
      new FormData();

    form.append(
      "content",
      text
    );

    if (media) {
      if (
        media.type.startsWith(
          "video/"
        )
      ) {
        form.append(
          "video",
          media
        );
      } else {
        form.append(
          "image",
          media
        );
      }
    }

    try {
      await api(
        "/api/posts",
        {
          method: "POST",
          body: form
        }
      );

      closePostModal();

      await loadPosts();
    } catch (error) {
      alert(
        error.message
      );
    }
  }

  document
    .getElementById(
      "searchInput"
    )
    .addEventListener(
      "keydown",
      function (event) {
        if (
          event.key === "Enter"
        ) {
          const q =
            this.value.trim();

          if (!q) return;

          location.href =
            `/profile.html?search=${encodeURIComponent(
              q
            )}`;
        }
      }
    );

  document
    .getElementById(
      "postModal"
    )
    .addEventListener(
      "click",
      function (event) {
        if (
          event.target === this
        ) {
          closePostModal();
        }
      }
    );

  async function init() {
    try {
      await loadMe();

      await loadProfile();
    } catch (error) {
      console.error(
        error
      );

      alert(
        error.message
      );
    }
  }

  init();
</script>

</body>
</html>
