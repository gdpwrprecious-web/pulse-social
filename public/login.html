<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In • Pulse Social</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1c1e21;
    }

    .page {
      width: 100%;
      max-width: 1050px;
      padding: 30px 20px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 70px;
      align-items: center;
    }

    .brand-section {
      padding-bottom: 30px;
    }

    .logo {
      font-size: 58px;
      font-weight: 800;
      color: #1877f2;
      letter-spacing: -3px;
      margin-bottom: 10px;
    }

    .tagline {
      font-size: 28px;
      line-height: 1.25;
      max-width: 500px;
    }

    .login-card {
      background: #fff;
      border-radius: 10px;
      padding: 18px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
    }

    .field {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid #dddfe2;
      border-radius: 6px;
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
      transition: 0.2s;
    }

    .field:focus {
      border-color: #1877f2;
      box-shadow: 0 0 0 2px rgba(24, 119, 242, 0.12);
    }

    .login-btn {
      width: 100%;
      border: none;
      border-radius: 6px;
      background: #1877f2;
      color: white;
      font-size: 20px;
      font-weight: bold;
      padding: 13px;
      cursor: pointer;
      margin-top: 2px;
    }

    .login-btn:hover {
      background: #166fe5;
    }

    .login-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .forgot {
      display: block;
      text-align: center;
      margin: 16px 0;
      color: #1877f2;
      text-decoration: none;
      font-size: 14px;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .divider {
      height: 1px;
      background: #dadde1;
      margin: 20px 0;
    }

    .signup-btn {
      display: block;
      width: fit-content;
      margin: 0 auto 5px;
      padding: 13px 20px;
      border-radius: 6px;
      background: #42b72a;
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
    }

    .signup-btn:hover {
      background: #36a420;
    }

    .message {
      display: none;
      padding: 11px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.error {
      display: block;
      background: #ffebe9;
      color: #c62828;
      border: 1px solid #ffcdd2;
    }

    .message.success {
      display: block;
      background: #e8f5e9;
      color: #1b5e20;
      border: 1px solid #c8e6c9;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: #65676b;
      font-size: 13px;
    }

    @media (max-width: 800px) {
      body {
        align-items: flex-start;
      }

      .page {
        padding: 35px 15px;
      }

      .layout {
        grid-template-columns: 1fr;
        gap: 25px;
        max-width: 430px;
        margin: auto;
      }

      .brand-section {
        text-align: center;
        padding-bottom: 0;
      }

      .logo {
        font-size: 50px;
      }

      .tagline {
        font-size: 21px;
        margin: auto;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="layout">

      <section class="brand-section">
        <div class="logo">pulse</div>

        <p class="tagline">
          Connect with people, share your moments,
          and stay connected on Pulse Social.
        </p>
      </section>

      <section>
        <div class="login-card">

          <div id="message" class="message"></div>

          <form id="loginForm">

            <input
              id="identifier"
              class="field"
              type="text"
              placeholder="Email or username"
              autocomplete="username"
              required
            >

            <input
              id="password"
              class="field"
              type="password"
              placeholder="Password"
              autocomplete="current-password"
              required
            >

            <button
              id="loginBtn"
              class="login-btn"
              type="submit"
            >
              Log In
            </button>

          </form>

          <a href="#" class="forgot" onclick="forgotPassword(event)">
            Forgotten password?
          </a>

          <div class="divider"></div>

          <a href="/signup.html" class="signup-btn">
            Create new account
          </a>

        </div>

        <div class="footer">
          © 2026 Pulse Social
        </div>
      </section>

    </div>

  </main>

  <script>
    const form = document.getElementById("loginForm");
    const identifierInput = document.getElementById("identifier");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const messageBox = document.getElementById("message");

    function showMessage(text, type = "error") {
      messageBox.textContent = text;
      messageBox.className = "message " + type;
    }

    function clearMessage() {
      messageBox.textContent = "";
      messageBox.className = "message";
    }

    function forgotPassword(event) {
      event.preventDefault();

      showMessage(
        "Password recovery is not enabled yet. Please contact the administrator.",
        "error"
      );
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      clearMessage();

      const identifier = identifierInput.value.trim();
      const password = passwordInput.value;

      if (!identifier || !password) {
        showMessage("Please enter your username/email and password.");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            identifier: identifier,
            username: identifier,
            email: identifier,
            password: password
          })
        });

        let data = {};

        try {
          data = await response.json();
        } catch {
          data = {};
        }

        if (!response.ok) {
          throw new Error(
            data.message ||
            data.error ||
            "Unable to sign in."
          );
        }

        if (!data.success && data.success !== undefined) {
          throw new Error(
            data.message ||
            data.error ||
            "Unable to sign in."
          );
        }

        showMessage("Login successful. Redirecting...", "success");

        /*
          Ask the server who is currently logged in.
          This is important because the server decides
          whether the account is an admin.
        */

        let me = null;

        try {
          const meResponse = await fetch("/api/me", {
            credentials: "include"
          });

          if (meResponse.ok) {
            const meData = await meResponse.json();

            me = meData.user || meData.data || meData;
          }
        } catch (error) {
          console.warn("Could not load current user:", error);
        }

        setTimeout(() => {

          /*
            Admin accounts go to admin.html.
          */

          if (
            me &&
            (
              me.isAdmin === true ||
              me.role === "admin" ||
              me.role === "superadmin"
            )
          ) {
            window.location.href = "/admin.html";
            return;
          }

          /*
            Normal users go to feed.html.
          */

          window.location.href = "/feed.html";

        }, 500);

      } catch (error) {

        console.error("LOGIN ERROR:", error);

        showMessage(
          error.message || "Unable to sign in."
        );

        loginBtn.disabled = false;
        loginBtn.textContent = "Log In";
      }
    });

    /*
      If the user is already logged in,
      don't show the login page unnecessarily.
    */

    async function checkExistingLogin() {
      try {
        const response = await fetch("/api/me", {
          credentials: "include"
        });

        if (!response.ok) return;

        const data = await response.json();

        if (!data.authenticated || !data.user) return;

        const user = data.user;

        if (
          user.isAdmin === true ||
          user.role === "admin" ||
          user.role === "superadmin"
        ) {
          window.location.href = "/admin.html";
        } else {
          window.location.href = "/feed.html";
        }

      } catch (error) {
        console.log("No active session.");
      }
    }

    checkExistingLogin();
  </script>

</body>
</html>
